<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Flow — FY27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --maroon:#4B1010; --maroon-dark:#350B0B;
    --bg:#F7F1E6;
    --card:#FFFFFF; --ink:#2B1A12; --sub:#8A7268; --line:#E8DCC8;
    --task-bg:#F3E9DC; --task-ink:#4B1010;
    --appr-bg:#F5E6C8; --appr-ink:#8A5A12;
    --gate-bg:#F3DCD8; --gate-ink:#8A2E2E;
    --comm-bg:#DCE9E3; --comm-ink:#1F6B4D;
    --done:#2F7A4F; --done-bg:#E3F2E7;
    --pending:#B8A99C; --pending-bg:#F2EDE6;
    --active:#4B1010;
    --restart:#C77A1F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 90px;}
  header{
    position:sticky;top:0;z-index:35;background:var(--maroon);
    padding:14px 16px 0;
  }
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brand-row img{height:38px;width:auto;border-radius:4px;}
  .brand-row .brand-text{color:#fff;}
  .eyebrow{
    font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#E8C79A;margin:0;font-weight:600;
  }
  h1{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;margin:0;color:#fff;}

  .nav-tabs{display:flex;gap:4px;margin-bottom:0;}
  .nav-tab{
    flex:1;text-align:center;padding:11px 0;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;
    letter-spacing:.02em;color:#E8C79A;background:none;border:none;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .nav-tab.active{color:#fff;border-bottom-color:#D68730;}

  .who-row{display:flex;gap:8px;align-items:center;margin:10px 0;padding:0 0 12px;}
  .who-row span{font-size:12px;color:#E8C79A;}
  .who-row input{
    flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--line);
    background:#fff;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
  }

  .store-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;-ms-overflow-style:none;scrollbar-width:none;}
  .store-tabs::-webkit-scrollbar{display:none;}

  /* ---- Desktop / wide-viewport layout: left-side collapsible panel ----
     Mobile stays exactly as designed above; this only kicks in on wider screens. */
  .sidebar-collapse-toggle{display:none;}
  .nav-tab-short{display:none;}
  @media (min-width: 900px){
    body{background:var(--bg);}
    .wrap{display:flex;align-items:flex-start;max-width:none;padding:0;}
    header{
      position:sticky;top:0;align-self:flex-start;height:100vh;width:220px;flex:none;
      overflow-y:auto;padding:16px 14px;box-sizing:border-box;transition:width .2s ease;
    }
    header.collapsed{width:64px;padding:16px 10px;}
    header.collapsed .brand-text,
    header.collapsed .nav-tab-label,
    header.collapsed .who-row span,
    header.collapsed #replayTutorialBtn{display:none;}
    header.collapsed .brand-row img{margin:0 auto;}
    header.collapsed .who-row{flex-direction:column;align-items:stretch;gap:4px;}
    .nav-tabs{flex-direction:column;gap:2px;}
    header.collapsed .nav-tab-short{display:inline;font-weight:700;}
    .nav-tab{text-align:left;padding:11px 10px;border-bottom:none;border-radius:6px;border-left:3px solid transparent;}
    .nav-tab.active{background:rgba(255,255,255,.08);border-left-color:#D68730;}
    header.collapsed .nav-tab{text-align:center;padding:11px 4px;}
    .who-row{flex-wrap:wrap;padding-bottom:0;}
    .sidebar-collapse-toggle{
      display:block;margin-top:14px;width:100%;background:rgba(255,255,255,.08);border:none;color:#E8C79A;
      border-radius:6px;padding:8px 0;font-size:14px;cursor:pointer;
    }
    .main-content{flex:1;min-width:0;max-width:640px;margin:0 auto;padding:0 0 40px;}
    .store-tabs{padding:16px 14px 12px;}
  }
  .store-tab{
    flex:none;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;
    padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--sub);
    cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
  }
  .store-tab .pip{width:6px;height:6px;border-radius:50%;background:var(--pending);}
  .store-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .store-tab.active .pip{background:#fff;}

  .store-summary{
    margin:14px 14px 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .store-summary .name{font-family:'Inter',sans-serif;font-weight:600;font-size:15px;}
  .store-summary .city{font-size:11.5px;color:var(--sub);}
  .stage-pill{
    font-family:'Inter',sans-serif;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;
  }

  #flow{padding:16px 14px 0;position:relative;}
  .rail-line{position:absolute;left:37px;top:16px;bottom:16px;width:2px;background:var(--line);z-index:0;}

  .delay-banner{
    background:#FDECD8;border:1px solid #F0CBA0;border-radius:10px;padding:11px 13px;margin:14px 0 4px;
    font-size:12.5px;line-height:1.5;color:#8A4A16;font-weight:500;
  }
  .delay-banner > div{margin-bottom:6px;}
  .delay-banner > div:last-child{margin-bottom:0;}

  .stage-row{position:relative;z-index:1;display:flex;gap:12px;margin-bottom:12px;}
  .stage-dot{
    flex:none;width:24px;height:24px;border-radius:50%;background:var(--pending-bg);border:2px solid var(--pending);
    display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:10px;
    font-weight:700;color:var(--pending);margin-top:14px;
  }
  .stage-dot.done{background:var(--done);border-color:var(--done);color:#fff;}
  .stage-dot.active{background:var(--active);border-color:var(--active);color:#fff;box-shadow:0 0 0 4px #F0DFC2;}
  .stage-dot.declined{background:var(--restart);border-color:var(--restart);color:#fff;}
  .stage-dot.overdue{background:#C13E3E;border-color:#C13E3E;color:#fff;}

  .stage-card{
    flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    box-shadow:0 1px 2px rgba(20,30,50,.04);cursor:pointer;
  }
  .stage-card.pending{opacity:.55;}
  .stage-card.active{border-color:var(--active);box-shadow:0 0 0 2px #F0DFC2;}
  .stage-card.skip{opacity:.35;}
  .stage-card.overdue-card{border-color:#E0A0A0;box-shadow:0 0 0 2px #FBE3E3;}

  .stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .stage-badge{
    font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:4px;
  }
  .stage-badge.task{background:var(--task-bg);color:var(--task-ink);}
  .stage-badge.approval{background:var(--appr-bg);color:var(--appr-ink);}
  .stage-badge.gate{background:var(--gate-bg);color:var(--gate-ink);}
  .stage-badge.checklist{background:var(--done-bg);color:var(--done);}
  .stage-title{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;margin-top:5px;line-height:1.25;}
  .stage-dur{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--sub);flex:none;white-space:nowrap;}
  .stage-dur.overdue-dur{color:#C13E3E;font-weight:700;}
  .stage-owner{font-size:11.5px;color:var(--sub);margin-top:5px;}
  .stage-status{font-size:11px;font-weight:600;margin-top:6px;}
  .stage-status.done{color:var(--done);}
  .stage-status.active{color:var(--active);}
  .stage-status.pending{color:var(--pending);}
  .stage-status.declined{color:var(--restart);}
  .stage-status.overdue{color:#C13E3E;}
  .restart-note{
    display:flex;align-items:center;gap:5px;margin:2px 0 8px 36px;font-size:11px;color:var(--restart);
    font-family:'Inter',sans-serif;font-weight:600;
  }

  .sheet-backdrop{
    display:none;position:fixed;inset:0;background:rgba(15,20,30,.55);z-index:30;
    align-items:flex-end;justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%;max-width:640px;background:#fff;border-radius:16px 16px 0 0;padding:20px 18px 26px;
    max-height:88vh;overflow-y:auto;
  }
  .sticky-close-x{
    position:sticky;top:0;float:right;margin:-4px -4px 0 12px;
    width:32px;height:32px;border-radius:50%;border:none;background:var(--card,#F4EFE6);
    color:var(--ink,#2B1A12);font-size:15px;line-height:1;cursor:pointer;z-index:5;
  }
  .sheet-badge{margin-bottom:6px;}
  .sheet h2{font-family:'Inter',sans-serif;font-size:19px;margin:4px 0 6px;}
  .sheet .meta{font-size:12.5px;color:var(--sub);margin-bottom:10px;}
  .sheet .desc{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:10px;}
  .warn{
    background:var(--gate-bg);color:#8A2E2E;font-size:12.5px;padding:10px 12px;border-radius:8px;
    margin-bottom:12px;line-height:1.4;font-weight:500;
  }
  .info-box{
    background:var(--task-bg);color:#333B7A;font-size:12.5px;padding:10px 12px;border-radius:8px;
    margin-bottom:12px;line-height:1.4;font-weight:500;
  }
  .approver-list{margin:10px 0;}

  .collapse-group{
    border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden;
  }
  .collapse-group summary{
    padding:12px 14px;font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;
    cursor:pointer;background:var(--task-bg);color:var(--maroon);list-style:none;
    display:flex;justify-content:space-between;align-items:center;
  }
  .collapse-group summary::-webkit-details-marker{display:none;}
  .collapse-group summary::after{content:'▾';font-size:11px;color:var(--sub);}
  .collapse-group[open] summary::after{content:'▴';}
  .collapse-group > *:not(summary){margin-left:14px;margin-right:14px;}
  .collapse-group > .field:last-of-type, .collapse-group > .mini-task-card:last-of-type{margin-bottom:14px;}
  .collapse-group > summary + *{margin-top:12px;}

  .mini-task-card{
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;
  }
  .mini-task-card.done{background:var(--done-bg);border-color:#BEDFC9;}
  .mini-task-card.overdue-card{border-color:#E0A0A0;background:var(--gate-bg);}
  .mini-task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .mini-task-label{font-weight:600;font-size:13px;color:var(--ink);}
  .mini-task-tat{font-size:10.5px;color:var(--sub);white-space:nowrap;}
  .mini-task-tat.overdue-dur{color:#8A2E2E;font-weight:700;}
  .mini-task-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .mini-task-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);white-space:nowrap;}
  .mini-task-check input{width:auto;}
  .mini-task-row input[type="date"]{flex:1;min-width:130px;padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid var(--line);}
  .mini-task-flag{color:#8A2E2E;font-size:11.5px;font-weight:700;margin-top:6px;}
  .approver{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .approver:last-child{border-bottom:none;}
  .approver .check{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;
  }
  .approver .check.on{background:var(--done);border-color:var(--done);}
  .approver-name{flex:1;}
  .approver-stamp{font-size:10.5px;color:var(--sub);font-family:'Inter',sans-serif;}

  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;padding:12px;border-radius:8px;border:none;font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.decline{background:transparent;color:var(--restart);border:1px solid #F0D2BC;}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .field label{
    display:block;font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--sub);margin-bottom:6px;margin-top:12px;
  }
  .field textarea, .field input, .field select{
    width:100%;padding:11px;border-radius:6px;border:1px solid var(--line);font-size:16px;font-family:'Inter',sans-serif;background:#fff;
  }
  .field textarea{min-height:56px;resize:vertical;}
  .progress-line{font-size:12px;color:var(--sub);margin-top:8px;font-family:'Inter',sans-serif;}
  .log{font-size:11px;color:var(--sub);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.6;max-height:110px;overflow-y:auto;}
  .log-entry{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);}
  .log-entry:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .loading{text-align:center;padding:50px;color:var(--sub);font-family:'Inter',sans-serif;font-size:12.5px;}

  /* Admin view */
  .admin-wrap{padding:16px 14px 0;}
  .admin-section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
  .admin-section h3{font-family:'Inter',sans-serif;font-size:15px;margin:0 0 3px;}
  .admin-section .sub{font-size:12px;color:var(--sub);margin-bottom:12px;}
  .admin-row{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;
  }
  .admin-row:last-child{border-bottom:none;}
  .admin-row-main{font-weight:600;}
  .admin-row-sub{font-size:11.5px;color:var(--sub);}
  .level-badge{
    font-family:'Inter',sans-serif;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;
    background:var(--task-bg);color:var(--task-ink);white-space:nowrap;
  }
  .remove-x{
    background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 6px;flex:none;
  }
  .approver-slot-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
  .approver-slot-row:last-child{border-bottom:none;}
  .approver-slot-row label{margin:0;font-size:12px;color:var(--sub);}
  .approver-slot-row select{width:auto;flex:1;margin-left:10px;}
  .empty-note{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px;}

  /* Dashboard tracker grid — the Excel-style view, fed entirely from live stage data */
  .tracker-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;}
  .tracker-scroll{overflow-x:auto;overflow-y:auto;max-height:70vh;border:1px solid var(--line);border-radius:10px;background:#fff;-webkit-overflow-scrolling:touch;}
  table.tracker{border-collapse:separate;border-spacing:0;font-size:11px;white-space:nowrap;}
  table.tracker th, table.tracker td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0 7px;height:26px;text-align:center;}
  table.tracker thead th{background:var(--task-bg);color:var(--maroon);font-weight:700;position:sticky;z-index:2;}
  table.tracker thead tr:nth-child(1) th{top:0;}
  table.tracker thead tr:nth-child(2) th{top:26px;}
  table.tracker thead tr:nth-child(3) th{top:52px;}
  table.tracker .col-proj{position:sticky;left:0;z-index:3;background:#fff;text-align:left;min-width:160px;max-width:160px;overflow:hidden;text-overflow:ellipsis;box-shadow:1px 0 0 var(--line);}
  table.tracker thead .col-proj{background:var(--task-bg);z-index:4;}
  table.tracker tbody tr:hover td{background:#FDFBF7;}
  table.tracker tbody tr:hover td.col-proj{background:#FDFBF7;}
  .cell-ontime{background:var(--done-bg);color:var(--done);}
  .cell-done{background:#EFF4EF;color:var(--done);}
  .cell-late{background:#FDECD8;color:#8A4A16;}
  .cell-overdue{background:var(--gate-bg);color:#8A2E2E;font-weight:700;}
  .cell-active{background:#F7EFD9;color:#8A5A12;}
  .cell-pending{color:var(--pending);}
  .cell-skip{background:#F6F3EE;color:#C9BFB3;}
  .tracker-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--sub);margin-top:10px;}
  .tracker-legend span{display:flex;align-items:center;gap:5px;}
  .tracker-legend i{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.06);}

  .attachment-row{gap:10px;}
  .attach-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none;cursor:pointer;}
  .attach-file-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:var(--task-bg);border-radius:6px;flex:none;font-size:18px;cursor:pointer;}
  .file-preview-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,10,10,.9);z-index:40;
    align-items:center;justify-content:center;padding:24px;
  }
  .file-preview-overlay.open{display:flex;}
  .file-preview-overlay img{max-width:100%;max-height:80vh;border-radius:8px;}
  .file-preview-overlay iframe{width:100%;height:80vh;border:none;border-radius:8px;background:#fff;}
  .file-preview-close{
    position:absolute;top:18px;right:18px;background:#fff;border:none;border-radius:50%;
    width:38px;height:38px;font-size:18px;cursor:pointer;z-index:41;
  }

  .tutorial-overlay{position:fixed;inset:0;z-index:300;pointer-events:none;}
  .tutorial-splash{
    position:fixed;inset:0;background:rgba(20,10,10,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px;pointer-events:auto;color:#fff;text-align:center;
  }
  .tutorial-splash h2{font-family:'Inter',sans-serif;font-weight:700;font-size:22px;margin:0 0 12px;}
  .tutorial-splash p{font-size:14px;color:#E8C79A;max-width:320px;margin:0 0 22px;line-height:1.5;}
  .tutorial-splash .btn-row{max-width:280px;}
  .tutorial-spotlight{
    position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,5,5,.82);
    pointer-events:none;transition:all .25s ease;z-index:301;border:2px solid var(--gold);
  }
  .tutorial-callout{
    position:fixed;background:#fff;border-radius:10px;padding:16px;max-width:280px;
    z-index:302;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:all .25s ease;
  }
  .tutorial-step-count{font-size:10.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .tutorial-callout h3{font-family:'Inter',sans-serif;font-size:15px;margin:0 0 6px;color:var(--maroon);}
  .tutorial-callout p{font-size:13px;color:var(--ink);margin:0 0 12px;line-height:1.4;}
  .tutorial-callout .btn-row{margin-top:0;}

  .login-gate{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
    background-image:radial-gradient(var(--dot) 1px, transparent 1px);background-size:16px 16px;
  }
  .login-card{
    width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:24px 22px;box-shadow:0 8px 30px rgba(20,30,50,.1);
  }
  .login-card h2{font-family:'Inter',sans-serif;font-size:20px;margin:2px 0 10px;}
  .login-note{font-size:12.5px;color:var(--sub);line-height:1.5;margin-bottom:6px;}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .auth-tabs .auth-tab{

// ROOT_ADMIN_EMAILS is a permanent, code-level fallback — it can never be removed through
// the UI, so a mistake in the roles list can never lock everyone out. Everyone else with
// these roles lives in roles/admins and roles/developers — a Firestore collection that
// denies all direct client writes (see firestore.rules); only the addAdmin/removeAdmin/
// addDeveloper/removeDeveloper Cloud Functions can change it, each re-checking the
// caller's own current role server-side first. This closes the gap where any signed-in
// user could previously grant themselves either role by writing straight to Firestore.
const ROOT_ADMIN_EMAILS = ['kumar.ayush@paradisefoodcourt.in'];
function isAdmin(){
  if(!currentUser) return false;
  const email = currentUser.email.toLowerCase();
  return ROOT_ADMIN_EMAILS.includes(email) || adminEmailsList.includes(email);
}
// Developer tier — can edit the shared stage pipeline (Templates → Stage Editor).
function isDeveloper(){
  if(!currentUser) return false;
  const email = currentUser.email.toLowerCase();
  return developerEmailsList.includes(email);
}
// Cost visibility is UI-level only (same trust model as the rest of this tool) — admin,
// or explicitly added to a site's cost-visible list, or one of that site's CapEx assignees.
function isCostVisible(s){
  if(isAdmin()) return true;
  const me = findMyStakeholder();
  if(!me || !s || !s.capex) return false;
  return s.capex.costVisibleTo.includes(me.id) || s.capex.tentativeAssignees.includes(me.id) || s.capex.actualAssignees.includes(me.id);
}
// A line item is only eligible for actual-cost entry once it has a real tentative rate —
// an item added but never estimated shouldn't block closure or accept an actual cost yet.
function hasTentativeRate(li){
  return li.tentativeRate !== '' && li.tentativeRate !== null && li.tentativeRate !== undefined && !isNaN(parseFloat(li.tentativeRate));
}
function capexActualsComplete(s){
  const items = (s.capex && s.capex.lineItems) || [];
  const relevant = items.filter(hasTentativeRate);
  if(!relevant.length) return true;
  return relevant.every(li => li.actualRate !== '' && li.actualRate !== null && li.actualRate !== undefined && !isNaN(parseFloat(li.actualRate)));
}

function makeSiteData(site){
  const stageData = {};
  STAGES.forEach(st=>{
    const skip = (st.bangaloreOnly && site.city !== 'BLR') || (st.formats && !st.formats.includes(site.format));
    stageData[st.id] = { status: skip ? 'skip' : (st.id===STAGES[0].id ? 'active' : 'pending'), approvals:{}, notes:'', updatedBy:'', updatedAt:0,
      startedAt: (st.id===STAGES[0].id && !skip && site.status !== 'draft') ? Date.now() : null, delayReason:'', delayLoggedBy:'', delayLoggedAt:0, attachments:[], assignedTo:[], blockerFlags:[] };
    if(st.id === 3){
      stageData[st.id].financials = { capex:'', dineInSteady:'', deliverySteady:'', dineInRamp:{}, deliveryRamp:{}, y2GrowthPct:'', y3GrowthPct:'', cogsPct:'', fixedOpex:'', costLines:{} };
    }
    if(st.id === 11){
      stageData[st.id].tasks = {};       // { key: {done, actualDate, tentativeStart, tentativeEnd, assignedTo, updatedBy, updatedAt} }
      stageData[st.id].design = {};      // { key: value }
      stageData[st.id].delivery = {};    // { key: value }
      stageData[st.id].finalStage = {};  // { key: value }
    }
    if(st.type === 'commercial-terms'){
      stageData[st.id].commercialTerms = {}; // { fieldId: value } — keyed against board.commercialTermsFields, not this stage's id, so the field list can grow later without touching existing data
      stageData[st.id].commercialTermsApprovals = {}; // { fieldId: {by, byId, at} } — per-line approval, separate from the value itself
    }
  });
  return { current: STAGES[0].id, stageData, log: [], signingDate: null, comments: [], emailThread: null, projectClosed: false, closedBy: null, closedAt: null,
    capex: { tentativeAssignees:[], actualAssignees:[], costVisibleTo:[], finalized:false, finalizedBy:null, finalizedAt:null, lineItems:[] }, closureOverride: null };
}

function subscribeToBoard(){
  if(unsubscribeBoard) unsubscribeBoard();
  unsubscribeBoard = BOARD_DOC.onSnapshot(async (docSnap)=>{
    if(docSnap.exists){
      board = docSnap.data();
    } else {
      board = defaultBoard();
      try{ await BOARD_DOC.set(board); }catch(e){ console.error('Firestore init failed', e); }
    }
    if(!board.users) board.users = [];
    if(!activeStore){ const vs = visibleSites(); if(vs.length) activeStore = vs[0].id; }
    migrateStageStructure();
    render();
  }, (err)=>{ console.error('Firestore snapshot error', err); });

  if(unsubscribeRoles) unsubscribeRoles();
  const rolesAdminsRef = db.collection('roles').doc('admins');
  const rolesDevsRef = db.collection('roles').doc('developers');
  const unsubAdmins = rolesAdminsRef.onSnapshot(snap=>{
    adminEmailsList = (snap.exists && snap.data().emails) || [];
    render();
  }, err=>console.error('roles/admins snapshot error', err));
  const unsubDevs = rolesDevsRef.onSnapshot(snap=>{
    developerEmailsList = (snap.exists && snap.data().emails) || [];
    render();
  }, err=>console.error('roles/developers snapshot error', err));
  unsubscribeRoles = ()=>{ unsubAdmins(); unsubDevs(); };
}

// Backfills any site whose stored data predates the Security Deposit / Agreement /
// Registration / Post-LOI Execution restructure (adding stages 8-11 in their new shape).
function migrateStageStructure(){
  if(!board || !board.sites) return;
  let changed = false;
  if(!board.cities || board.cities.length === 0){ board.cities = [{code:'BLR', name:'Bangalore'}, {code:'CHN', name:'Chennai'}]; changed = true; }
  // TAT is now a range {min, max} instead of one number — migrate any existing
  // per-project overrides from the old single-value shape, treating that old number as
  // both ends of the range so nothing's behavior changes until someone widens it.
  if(!board.tatOverrides){
    board.tatOverrides = {};
    if(board.slaOverrides){
      Object.keys(board.slaOverrides).forEach(siteId=>{
        board.tatOverrides[siteId] = {};
        Object.keys(board.slaOverrides[siteId]).forEach(key=>{
          const v = parseInt(board.slaOverrides[siteId][key]);
          if(!isNaN(v)) board.tatOverrides[siteId][key] = { min: 0, max: v };
        });
      });
      delete board.slaOverrides;
    }
    changed = true;
  }
  // adminEmails/developerEmails moved out of the board document entirely — see
  // roles/admins and roles/developers, and the addAdmin/addDeveloper Cloud Functions.
  // The stage pipeline itself lives in board.nsoStages so it's editable — seed it from
  // today's default the first time, then always point STAGES at whatever's actually
  // stored, so every function in the app automatically uses the live, edited version.
  if(!board.nsoStages || !board.nsoStages.length){ board.nsoStages = STAGES; changed = true; }
  // v2 pipeline — Chaayos-derived, format-specific (CK/F10/F20), with Manpower. Keeps
  // Commercial Terms(12)/P&L(3)/Site Visit(4)/Feasibility+CAPEX(5)/Electrical Load(6)
  // exactly as they were; everything else is replaced. Runs once per board — bump
  // PIPELINE_VERSION to force a re-migration later.
  const PIPELINE_VERSION = 'chaayos-manpower-v1';
  if(board.nsoStagesVersion !== PIPELINE_VERSION){
    board.nsoStages = STAGES; // STAGES here is the new default array defined near the top of this file
    board.nsoStagesVersion = PIPELINE_VERSION;
    const FORMAT_REMAP = { Omni: 'F10', CloudKitchen: 'CK' };
    (board.sites || []).forEach(site=>{ if(FORMAT_REMAP[site.format]) site.format = FORMAT_REMAP[site.format]; });
    changed = true;
  }
  STAGES = board.nsoStages;
  // Commercial Terms stage added after Ground Scouting — backfill it into any board whose
  // nsoStages was already seeded before this stage existed, so existing live pipelines
  // pick it up without needing to recreate the board from scratch.
  if(!STAGES.find(st=>st.type==='commercial-terms')){
    const groundScoutingIdx = STAGES.findIndex(st=>st.id===2);
    const newStage = {id:12, num:'00', title:'Commercial Terms', type:'commercial-terms', owner:'Business Development', duration:'Post scouting', tatMinDays:0, tatMaxDays:7,
      desc:'Commercial/lease terms negotiated and captured — rent, tenure, security deposit, lock-in, and related terms. Filled in by Business Development.'};
    if(groundScoutingIdx === -1) STAGES.push(newStage);
    else STAGES.splice(groundScoutingIdx+1, 0, newStage);
    // Renumber everything right away, same formula as renumberAndSave — numbering has
    // always started at 02 (Stage 1 was removed early on), and inserting a stage here
    // shifts every stage after it by one. Doing this now means the very first render
    // after this migration already shows correct numbers, not just after the next
    // manual Stage Editor edit.
    STAGES.forEach((st,i)=>{ st.num = String(i+2).padStart(2,'0'); });
    changed = true;
  }
  if(!board.commercialTermsFields || board.commercialTermsFields.length === 0){ board.commercialTermsFields = defaultCommercialTermsFields(); changed = true; }
  if(!board.restaurantCostHeaders || board.restaurantCostHeaders.length === 0){ board.restaurantCostHeaders = defaultRestaurantCostHeaders(); changed = true; }
  if(!board.dropApprovers){ board.dropApprovers = []; changed = true; }
  if(!board.postLoiTasks || board.postLoiTasks.length === 0){ board.postLoiTasks = defaultPostLoiTasks(); changed = true; }
  if(!board.postLoiDelivery || board.postLoiDelivery.length === 0){ board.postLoiDelivery = defaultPostLoiDelivery(); changed = true; }
  if(!board.scoutingLocations){ board.scoutingLocations = []; changed = true; }
  if(!board.scoutingSiteData){ board.scoutingSiteData = {}; changed = true; }
  if(!board.scoutingFields || board.scoutingFields.length === 0){ board.scoutingFields = defaultScoutingFields(); changed = true; }
  if(!board.scoutingApprovers){ board.scoutingApprovers = []; changed = true; }
  // Backfill any scouting site saved before a field/flag existed on it, same
  // "extend, never erase" principle as the rest of migrateStageStructure.
  Object.values(board.scoutingSiteData || {}).forEach(site=>{
    if(!site.log){ site.log = []; changed = true; }
    if(!site.attachments){ site.attachments = []; changed = true; }
    if(!site.assignedTo){ site.assignedTo = []; changed = true; }
    if(!site.values){ site.values = {}; changed = true; }
    if(!site.status){ site.status = 'scouting'; changed = true; }
  });
  // Migrate each project's single fixedOpex number into the new itemized costLines
  // shape, under the SAME header id ('fixedOpex') the default list starts with — so
  // existing payback/ROI numbers don't change the moment this loads, just the storage
  // shape does.
  if(board.sites){
    board.sites.forEach(site=>{
      const s = board.siteData[site.id];
      const f = s && s.stageData && s.stageData[3] && s.stageData[3].financials;
      if(f && f.costLines === undefined){
        f.costLines = {};
        if(f.fixedOpex !== undefined && f.fixedOpex !== ''){ f.costLines.fixedOpex = f.fixedOpex; }
        changed = true;
      }
    });
  }
  // Universal Assignment/Approval toggle migration — backward-compatible defaults based
  // on each stage's CURRENT type, so every existing stage keeps behaving exactly as it
  // already does. type:'approval' migrates onto the same generic requiresApproval flag
  // Site Visit + Sign-Off already uses under the hood (its own board.stageApprovers list
  // and toggleApproval mechanism are untouched — this just stops gating them on a
  // hardcoded type string). Commercial Terms and the Post-LOI checklist keep their own
  // fully separate mechanisms; both flags stay false there deliberately.
  STAGES.forEach(st=>{
    if(st.requiresAssignment === undefined || st.requiresApproval === undefined){
      if(st.type === 'commercial-terms' || st.type === 'checklist'){
        st.requiresAssignment = false; st.requiresApproval = false;
      } else if(st.type === 'approval'){
        st.requiresAssignment = false; st.requiresApproval = true;
      } else { // task, gate, or anything else — matches current assign-and-complete behavior
        st.requiresAssignment = true; st.requiresApproval = false;
      }
      changed = true;
    }
    // Correct an existing bad state directly — these two checkboxes were toggleable in
    // Stage Editor for every stage, including Commercial Terms and the checklist, even
    // though they have their own dedicated approval/assignment handling and must never
    // route through the generic one. Runs every load, not just once, so it self-heals
    // regardless of how the flags got set to true.
    if((st.type === 'commercial-terms' || st.type === 'checklist') && (st.requiresAssignment || st.requiresApproval)){
      st.requiresAssignment = false; st.requiresApproval = false;
      changed = true;
    }
    // Execution page classification — every existing stage is Project Flow by default,
    // so nothing currently in the pipeline moves to the new Execution tab on its own.
    // This is purely a display grouping — recompute(), TAT, due dates, and overdue
    // detection all still walk the full STAGES array unchanged, exactly one sequence.
    if(!st.page){ st.page = 'project-flow'; changed = true; }
  });
  // Approvers move from one fixed global 5-person panel to a variable-length list per
  // approval-capable stage — preserves the existing Site Visit + Sign-Off panel by
  // migrating it into stageApprovers[4] rather than losing who was already set up there.
  if(!board.stageApprovers){
    board.stageApprovers = {};
    if(board.approvalPanel){ board.stageApprovers[4] = board.approvalPanel.filter(Boolean); }
    changed = true;
  }
  STAGES.forEach(st=>{
    if((st.requiresApproval || st.type==='commercial-terms') && !board.stageApprovers[st.id]){
      board.stageApprovers[st.id] = [];
      changed = true;
    }
  });
  // Separate from the insertion above — catches boards that already have the Commercial
  // Terms stage but picked up wrong numbers from an earlier bug (renumberAndSave used to
  // start at 01 instead of 02, silently overwriting the intended numbering on any Stage
  // Editor edit). Runs every load; cheap, and a no-op once numbers are already correct.
  {
    let numsWrong = false;
    STAGES.forEach((st,i)=>{ if(st.num !== String(i+2).padStart(2,'0')) numsWrong = true; });
    if(numsWrong){
      STAGES.forEach((st,i)=>{ st.num = String(i+2).padStart(2,'0'); });
      changed = true;
    }
  }
  // Migrate each stage's old single slaDays into the new {tatMinDays, tatMaxDays} range —
  // old value becomes the max, min defaults to 0, so nothing's overdue status changes.
  STAGES.forEach(st=>{
    if(st.slaDays !== undefined && st.tatMaxDays === undefined){
      st.tatMinDays = 0;
      st.tatMaxDays = st.slaDays;
      delete st.slaDays;
      changed = true;
    }
  });
  if(!board.templates){
    board.templates = [{
      id: 'tmpl_nso', name: 'NSO — New Store Opening',
      description: "Paradise's NSO pipeline — Chaayos-derived, format-specific (CK & Kiosks / 1.0 / 2.0), with Manpower.",
      builtIn: true, ownerId: null, createdAt: Date.now(),
    }];
    changed = true;
  }
  board.sites.forEach(site=>{
    if(!site.templateId){ site.templateId = 'tmpl_nso'; changed = true; }
    if(!site.status){ site.status = 'live'; changed = true; } // pre-existing sites were always immediately visible
    if(site.ownerId === undefined){ site.ownerId = null; changed = true; }
  });
  if(board.users){
    board.users.forEach(u=>{ if(!u.tutorialsSeen){ u.tutorialsSeen = []; changed = true; } });
  }
  board.sites.forEach(site=>{
    const s = board.siteData[site.id];
    if(!s) return;
    if(!s.comments){ s.comments = []; changed = true; }
    if(s.projectClosed === undefined){ s.projectClosed = false; s.closedBy = null; s.closedAt = null; changed = true; }
    if(!s.capex){ s.capex = { tentativeAssignees:[], actualAssignees:[], costVisibleTo:[], finalized:false, finalizedBy:null, finalizedAt:null, lineItems:[] }; changed = true; }
    if(s.closureOverride === undefined){ s.closureOverride = null; changed = true; }
    // Stage 1 (Market & Area Identification) was removed from the NSO pipeline — any
    // existing site whose current stage pointer still points at it needs recomputing.
    // Its old stageData[1] is deliberately left untouched, not deleted — just no longer shown.
    if(!STAGES.find(st=>st.id===s.current)){ s.current = STAGES[0].id; changed = true; }
    STAGES.forEach(st=>{
      if(!s.stageData[st.id]){
        const skip = (st.bangaloreOnly && site.city !== 'BLR') || (st.formats && !st.formats.includes(site.format));
        s.stageData[st.id] = { status: skip ? 'skip' : 'pending', approvals:{}, notes:'', updatedBy:'', updatedAt:0,
          startedAt: null, delayReason:'', delayLoggedBy:'', delayLoggedAt:0, attachments:[], assignedTo:[], blockerFlags:[] };
        changed = true;
      }
      if(!s.stageData[st.id].attachments){ s.stageData[st.id].attachments = []; changed = true; }
      if(!s.stageData[st.id].blockerFlags){ s.stageData[st.id].blockerFlags = []; changed = true; }
      // Notes move from one shared box (whoever saved last silently overwrote anyone
      // before them) to an attributed, append-only log. Existing notes become the first
      // log entry rather than being lost — attributed to whoever the stage's own
      // updatedBy/updatedAt already shows, since that's the closest fact on record.
      if(s.stageData[st.id].notesLog === undefined){
        const oldNotes = s.stageData[st.id].notes;
        s.stageData[st.id].notesLog = (oldNotes && oldNotes.trim())
          ? [{ text: oldNotes.trim(), by: s.stageData[st.id].updatedBy || 'Unknown', byId: null, at: s.stageData[st.id].updatedAt || Date.now() }]
          : [];
        changed = true;
      }
      if(!Array.isArray(s.stageData[st.id].assignedTo)){ s.stageData[st.id].assignedTo = s.stageData[st.id].assignedTo ? [s.stageData[st.id].assignedTo] : []; changed = true; }
      if(st.id === 11 && !s.stageData[11].tasks){
        s.stageData[11].tasks = {};
        s.stageData[11].design = {};
        s.stageData[11].delivery = {};
        s.stageData[11].finalStage = {};
        changed = true;
      }
      if(st.id === 11 && s.stageData[11].tasks){
        Object.values(s.stageData[11].tasks).forEach(rec=>{
          if(!Array.isArray(rec.assignedTo)){ rec.assignedTo = rec.assignedTo ? [rec.assignedTo] : []; changed = true; }
          // Old shape had tentativeStart/tentativeEnd + a separate done checkbox —
          // folds into one tentativeCompletion date; "done" is now just "has an actual
          // date", so anything checked-done-but-dateless correctly reverts to
          // not-complete rather than silently keeping a state with no date behind it.
          if(rec.tentativeCompletion === undefined){
            rec.tentativeCompletion = rec.tentativeEnd || rec.tentativeStart || '';
            delete rec.tentativeStart; delete rec.tentativeEnd; delete rec.done;
            changed = true;
          }
        });
      }
      if(st.id === 11 && s.stageData[11].delivery){
        Object.values(s.stageData[11].delivery).forEach(rec=>{
          // Old shape was a 3-date triplet (tentativeStart/deliveryDate/actualDate) —
          // deliveryDate is the closer match for "tentative delivery date", so that's
          // what carries over; tentativeStart only fills in if deliveryDate was never set.
          if(rec.tentativeDate === undefined){
            rec.tentativeDate = rec.deliveryDate || rec.tentativeStart || '';
            delete rec.tentativeStart; delete rec.deliveryDate;
            changed = true;
          }
        });
      }
      if(st.type === 'commercial-terms' && !s.stageData[st.id].commercialTerms){
        s.stageData[st.id].commercialTerms = {};
        s.stageData[st.id].commercialTermsApprovals = {};
        changed = true;
      }
      if(st.type === 'commercial-terms' && s.stageData[st.id].commercialTerms && !s.stageData[st.id].commercialTermsApprovals){
        s.stageData[st.id].commercialTermsApprovals = {};
        changed = true;
      }
    });
  });
  if(board.stakeholders){
    const legacyLevelLabels = {1:'Team Member', 2:'Manager', 3:'Senior Manager', 4:'Director', 5:'Leadership (MD/CFO/CXO)'};
    board.stakeholders.forEach(p=>{
      if(p.email === undefined){ p.email = ''; changed = true; }
      if(p.reportsTo === undefined){ p.reportsTo = null; changed = true; }
      if(typeof p.level === 'number'){ p.level = legacyLevelLabels[p.level] || ''; changed = true; }
    });
  }
  if(changed) saveBoard();
}

function getWho(){ return (currentUser && currentUser.name) || 'someone'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Generates a sample CSV in-browser and downloads it — used next to every bulk-upload
// control so people can see the exact expected column format before uploading their own.
function downloadSampleCsv(headers, rows, filename){
  const esc = v => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
// Escapes text, then turns any URL back into a real clickable link — for notes/comments,
// where someone might paste a Drive/Docs link and expect it to actually work.
function escapeAndLinkify(s){
  const escaped = escapeHtml(s);
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, url => `<a href="${url}" target="_blank" rel="noopener">${url}</a>`);
}

// A date input with a Clear (✕) button — mobile date pickers default to "today" when
// opened on an empty field, so this is the escape hatch if that gets confirmed by mistake.
function dateFieldWithClear(id, value){

    <input type="date" id="${id}" value="${escapeHtml(value||'')}" style="flex:1;">
    <button type="button" class="remove-x" data-clear-target="${id}" title="Clear date">✕</button>
  </div>`;
}
// Three related dates for one item — tentative start, (tentative) delivery date, actual date.

}
// Clean 2-field version for anything that's genuinely just "when's it tentatively
// happening" + "when did it actually happen" — used for Equipment Delivery specifically,
// simpler than the 3-date triplet above since delivery items don't need a separate
// "start" date distinct from the delivery date itself.
function renderDatePair(prefix, key, label, rec, tentLabel, actualLabel){

    <label style="font-weight:600;font-size:12.5px;display:block;margin-bottom:8px;">${escapeHtml(label)}</label>

  </div>`;
}
function isImageFile(name){ return /\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(name||''); }
function openFilePreview(url, name){
  const content = document.getElementById('filePreviewContent');
  if(isImageFile(name)){
    content.innerHTML = `<img src="${url}" alt="${escapeHtml(name)}">`;
  } else {
    content.innerHTML = `<iframe src="${url}" title="${escapeHtml(name)}"></iframe>`;
  }
  document.getElementById('filePreviewOverlay').classList.add('open');
}
function timeAgo(ts){
  if(!ts) return '';
  const s = Math.round((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  const m = Math.round(s/60); if(m<60) return m+'m ago';
  const h = Math.round(m/60); if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}
function fmtDate(ts){
  if(!ts) return null;
  return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}
function fmtINR(n){
  if(!isFinite(n)) return '—';
  const abs = Math.abs(n);
  let s;
  if(abs >= 10000000) s = (n/10000000).toFixed(2)+'Cr';
  else if(abs >= 100000) s = (n/100000).toFixed(2)+'L';
  else s = Math.round(n).toLocaleString('en-IN');
  return '₹'+s;
}
function levelLabel(level){ return level ? level : 'No title set'; }

function getSite(id){ return board.sites.find(s=>s.id===id); }
function storeState(id){ return board.siteData[id]; }

// Walks backward from month m to find the most recently-specified ramp %, so a channel
// that only has M1-M4 filled in naturally holds flat at M4's value for M5 onward,
// without needing every later month manually filled with the same number.
function effectiveRampPct(rampObj, m){
  for(let i=m; i>=1; i--){
    if(rampObj[i] !== undefined && rampObj[i] !== '' && !isNaN(parseFloat(rampObj[i]))) return parseFloat(rampObj[i]);
  }
  return 100; // nothing specified yet at all — assume full steady-state from day one
}

function calcProjection(f){
  const capex = parseFloat(f.capex) || 0;
  const cogsPct = parseFloat(f.cogsPct) || 0;
  // Fixed opex is now the sum of however many restaurant cost lines this project has —
  // one number used to be typed directly here; now it's whatever the itemized list adds
  // up to, so the payback/ROI math stays correct however many lines exist.
  const fixedOpex = Object.values(f.costLines || {}).reduce((sum,v)=>sum+(parseFloat(v)||0), 0);
  const dineInSteady = parseFloat(f.dineInSteady) || 0;
  const deliverySteady = parseFloat(f.deliverySteady) || 0;
  const dineInRamp = f.dineInRamp || {};
  const deliveryRamp = f.deliveryRamp || {};
  const y2GrowthPct = parseFloat(f.y2GrowthPct) || 0;
  const y3GrowthPct = parseFloat(f.y3GrowthPct) || 0;
  let revenue = 0;
  let cumulative = -capex;
  let paybackMonth = null;
  let y = [ {rev:0, ebitda:0}, {rev:0, ebitda:0}, {rev:0, ebitda:0} ];
  for(let m=1; m<=36; m++){
    if(m<=12){
      // Each channel ramps independently against its own steady-state (mature) revenue,
      // then holds flat once its ramp completes — Dine-in and Delivery are summed for
      // the site's total revenue that month.
      revenue = dineInSteady * effectiveRampPct(dineInRamp, m)/100 + deliverySteady * effectiveRampPct(deliveryRamp, m)/100;
    } else if(m===13) revenue = revenue * (1 + y2GrowthPct/100);
    else if(m===25) revenue = revenue * (1 + y3GrowthPct/100);
    const cogs = revenue * cogsPct/100;
    const ebitda = revenue - cogs - fixedOpex;
    cumulative += ebitda;
    if(paybackMonth===null && cumulative>=0 && capex>0) paybackMonth = m;
    const yi = m<=12?0:(m<=24?1:2);
    y[yi].rev += revenue; y[yi].ebitda += ebitda;
  }
  const totalEBITDA = y[0].ebitda + y[1].ebitda + y[2].ebitda;
  const totalRev = y[0].rev + y[1].rev + y[2].rev;
  const roi3yr = capex>0 ? ((totalEBITDA - capex)/capex*100) : 0;
  // EBITDA margin — per year and overall. Guarded against divide-by-zero for a year
  // with no revenue yet (e.g. capex entered but nothing else filled in).
  y.forEach(yy=>{ yy.ebitdaPct = yy.rev > 0 ? (yy.ebitda / yy.rev * 100) : 0; });
  const totalEbitdaPct = totalRev > 0 ? (totalEBITDA / totalRev * 100) : 0;
  return { paybackMonth, y, totalEBITDA, roi3yr, totalEbitdaPct };
}

function recompute(id){
  const s = storeState(id);
  let current = STAGES[0].id; // fallback if every stage is somehow done/skip — always the pipeline's actual first stage
  for(const st of STAGES){
    const d = s.stageData[st.id];
    if(d.status === 'done' || d.status === 'skip') continue;
    current = st.id;
    break;
  }
  s.current = current;
  STAGES.forEach(st=>{
    const d = s.stageData[st.id];
    if(d.status === 'pending' && st.id === current){
      d.status = 'active';
      if(!d.startedAt) d.startedAt = Date.now();
    }
    if(d.status === 'active' && st.id !== current) d.status = 'pending';
  });
}

// Once P&L (stage 3) has started, every later stage gets a projected due date — walking
// the pipeline forward from stage 3's start, stacking each stage's TAT max as its planned
// duration. Anchored on REAL progress, not a rigid original plan: a stage that's already
// done anchors the next one on its actual completion time, so if something finishes late
// (or gets declined and reworked), every later due date shifts automatically — recomputed
// fresh each time, not stored as a one-time snapshot.
function recalculateDueDates(id){
  const s = storeState(id);
  const plStage = s.stageData[3];
  if(!plStage || !plStage.startedAt) return; // nothing to project until P&L actually starts

  const startIdx = STAGES.findIndex(st=>st.id===3);
  if(startIdx === -1) return;
  let anchor = plStage.startedAt;
  let i = startIdx;

  while(i < STAGES.length){
    const st = STAGES[i];
    const d = s.stageData[st.id];
    if(!d){ i++; continue; }

    if(d.status === 'done'){
      // Anchor the rest of the schedule on when this one ACTUALLY finished, not when
      // it was originally planned to — this is what makes later due dates shift.
      anchor = d.updatedAt || anchor;
      i++;
      continue;
    }

    const site = getSite(id);
    // Consecutive stages sharing a parallelGroup start together at the same anchor and
    // each get their own due date, but the pipeline only moves past the group once the
    // LONGEST of them would finish — not the sum of both.
    if(st.parallelGroup){
      const group = [st];
      let j = i+1;
      while(j < STAGES.length && STAGES[j].parallelGroup === st.parallelGroup){ group.push(STAGES[j]); j++; }
      let maxTat = 0;
      group.forEach(gst=>{
        const gd = s.stageData[gst.id];
        const gTat = formatTat(gst, site).max||0;
        if(gd && gd.status !== 'done' && gd.status !== 'skip') gd.dueDate = anchor + gTat * 86400000;
        maxTat = Math.max(maxTat, gTat);
      });
      anchor = anchor + maxTat * 86400000;
      i = j;
      continue;
    }

    d.dueDate = anchor + (formatTat(st, site).max||0) * 86400000;
    anchor = d.dueDate;
    i++;
  }
}

// Admin-editable TAT overrides live in board.tatOverrides, keyed 'stage_<id>' or 'task_<key>'.
// Falls back to the built-in default (from STAGES / board.postLoiTasks) when no override is set.
// Scoped per individual project, not shared globally — board.tatOverrides is
// { siteId: { 'stage_<id>': {min,max}, 'task_<key>': {min,max} } }.
// Single formatter for every TAT range shown anywhere in the app — always computed
// live from the actual min/max, never from a stored text snapshot that can drift out of
// sync once someone changes the real numbers via Stage Editor. Collapses to one number
// only when min and max are genuinely equal, per spec.
function fmtTatRange(min, max){
  min = min || 0;
  if(max === undefined || max === null) return `${min} Days`;
  return min === max ? `${max} Days` : `${min}–${max} Days`;
}

function effectiveTat(siteId, key, defaultMin, defaultMax, tatByFormat){
  if(board && board.tatOverrides && board.tatOverrides[siteId] && board.tatOverrides[siteId][key]){
    const ov = board.tatOverrides[siteId][key];
    const min = parseInt(ov.min), max = parseInt(ov.max);
    if(!isNaN(min) && !isNaN(max)) return { min, max };
  }
  if(tatByFormat){
    const site = getSite(siteId);
    const fv = site && tatByFormat[site.format];
    if(fv) return { min: fv.min, max: fv.max };
  }
  return { min: defaultMin||0, max: defaultMax };
}
// Format-aware duration lookup used by recalculateDueDates() above — per-project
// tatOverrides don't apply here (that's what effectiveTat() is for); this just resolves
// a stage's own TAT for the site's format before falling back to its flat default.
function formatTat(st, site){
  if(st.tatByFormat && site && st.tatByFormat[site.format]) return st.tatByFormat[site.format];
  return { min: st.tatMinDays||0, max: st.tatMaxDays };
}

function stageTiming(st, d, siteId){
  const site = getSite(siteId);
  if(site && site.status === 'dropped') return null; // dropped projects never show as overdue
  if(!d.startedAt || d.status==='done' || d.status==='skip') return null;
  const elapsedDays = Math.floor((Date.now() - d.startedAt) / 86400000);
  const tat = effectiveTat(siteId, 'stage_'+st.id, st.tatMinDays, st.tatMaxDays, st.tatByFormat);
  const overdueDays = elapsedDays - tat.max;
  return { elapsedDays, overdueDays, isOverdue: overdueDays > 0, tatMin: tat.min, tatMax: tat.max };
}

function siteHasOverdueStages(site, s){
  return STAGES.some(st=>{
    const d = s.stageData[st.id];
    if(!d) return false;
    const t = stageTiming(st, d, site.id);
    if(t && t.isOverdue) return true;
    return !t && d.dueDate && Date.now() > d.dueDate && d.status !== 'done' && d.status !== 'skip';
  });
}

// Single source of truth for a project's overall health status — used everywhere a
// project's status is shown (store tabs, project header, Dashboard) so the same project
// never shows conflicting colors in two different places. Priority matches the spec
// exactly: Dropped beats everything, Completed beats Delayed, Delayed beats In Progress.
function getProjectStatus(site, s){
  if(site.status === 'dropped'){
    return { status:'dropped', label:'Dropped', bg:'#E2E0D9', ink:'#5F5E5A' };
  }
  const doneFinal = s.stageData[11] && s.stageData[11].status === 'done';
  if(doneFinal){
    return { status:'completed', label:'Completed', bg:'#DCE9DC', ink:'#2F7A4F' };
  }
  if(siteHasOverdueStages(site, s)){
    return { status:'delayed', label:'Delayed', bg:'#F3DCD8', ink:'#8A2E2E' };
  }
  return { status:'in-progress', label:'In Progress', bg:'#F5E6C8', ink:'#8A5A12' };
}

// Same idea as stageTiming, but for an individual checklist item within Stage 11 —
// all items share the stage's own startedAt (Construction Start) as their reference point.
function itemTiming(startedAt, tatMinDays, tatMaxDays, taskKey, siteId){
  if(!startedAt) return null;
  const elapsedDays = Math.floor((Date.now() - startedAt) / 86400000);
  const tat = taskKey ? effectiveTat(siteId, 'task_'+taskKey, tatMinDays, tatMaxDays) : { min: tatMinDays||0, max: tatMaxDays };
  const overdueDays = elapsedDays - tat.max;
  return { elapsedDays, overdueDays, isOverdue: overdueDays > 0, tatMin: tat.min, tatMax: tat.max };
}

// Target opening date for a site — projected from Construction Start (Stage 11's start)
// plus the Standard Opening Date TAT, or the actual/revised date once logged.
function computeTargetOpening(s){
  const d11 = s.stageData[11];
  if(!d11) return null;
  if(d11.finalStage && d11.finalStage.actualOpening) return { label:'opened', value: d11.finalStage.actualOpening };
  if(d11.finalStage && d11.finalStage.revisedOpeningDate) return { label:'revised target', value: d11.finalStage.revisedOpeningDate };
  if(d11.startedAt){
    const standardOpeningTat = board.postLoiTasks.find(t=>t.key==='standardOpening').tatMaxDays;
    return { label:'target opening', value: d11.startedAt + standardOpeningTat * 86400000 };
  }
  return null;
}

// Matches the signed-in email to a stakeholder record, so assignments can be found.
// Display label for a stakeholder in any picker — name, department, and who they report to.
function stakeholderLabel(p){
  const mgr = p.reportsTo ? board.stakeholders.find(x=>x.id===p.reportsTo) : null;
  let label = p.name;
  if(p.department) label += ' — ' + p.department;
  if(mgr) label += ` (reports to ${mgr.name})`;
  return label;
}

// Reusable searchable person-picker — a text input backed by a native <datalist>, so
// typing filters the list instead of scrolling a giant dropdown. Renders the markup;
// personPickerSelectedId() below reads back which person (if any) was actually chosen.
function personPickerHtml(id, people, placeholder){
  return `<input list="dl_${id}" id="${id}" placeholder="${placeholder||'Search and select...'}" autocomplete="off" style="width:100%;">
    <datalist id="dl_${id}">
      ${people.map(p=>`<option value="${escapeHtml(stakeholderLabel(p))}">`).join('')}
    </datalist>`;
}
function personPickerSelectedId(id, people){
  const el = document.getElementById(id);
  if(!el) return null;
  const typed = el.value.trim();
  const match = people.find(p => stakeholderLabel(p) === typed);
  return match ? match.id : null;
}

function findMyStakeholder(){
  if(!currentUser || !board || !board.stakeholders) return null;
  return board.stakeholders.find(p => p.email && p.email.toLowerCase() === currentUser.email.toLowerCase()) || null;
}

// Every open (not done/skipped) stage or Stage 11 task assigned to the signed-in person, across all sites.
function findMyOpenAssignments(){
  const me = findMyStakeholder();
  if(!me || !board) return [];
  const results = [];
  board.sites.forEach(site=>{
    const s = board.siteData[site.id];
    if(!s) return;
    STAGES.forEach(st=>{
      const d = s.stageData[st.id];
      if(!d || d.status==='done' || d.status==='skip') return;
      if((d.assignedTo||[]).includes(me.id)){
        results.push({ siteId: site.id, siteName: site.name, stageId: st.id, label: `${st.num} · ${st.title}` });
      }
      if(st.id === 11 && d.tasks){
        board.postLoiTasks.forEach(item=>{
          const rec = d.tasks[item.key];
          if(rec && (rec.assignedTo||[]).includes(me.id) && !rec.actualDate){
            results.push({ siteId: site.id, siteName: site.name, stageId: 11, label: `11 · ${item.label}` });
          }
        });
      }
    });
  });
  return results;
}

function showTutorialSplash(tutorialId, steps){
  activeTutorial = { id: tutorialId, steps, index: 0 };
  document.getElementById('tutorialSplashTitle').textContent = tutorialId==='admin' ? 'Welcome, Admin' : (tutorialId===null ? 'Tutorial' : 'Welcome to Project Flow');
  document.getElementById('tutorialSplashText').textContent = tutorialId==='admin'
    ? 'A quick look at where you manage sites, stakeholders, and cost.'
    : (tutorialId===null ? 'A replay of the full walkthrough.' : 'Track every store opening from Market ID to Grand Opening, one shared board for everyone involved. Want a quick tour?');
  document.getElementById('tutorialOverlay').style.display = 'block';
  document.getElementById('tutorialSplash').style.display = 'flex';
}

function runTutorialStep(){
  const step = activeTutorial.steps[activeTutorial.index];
  if(step.view && step.view !== currentView){
    currentView = step.view;
    render();
  }
  requestAnimationFrame(()=>{
    const target = document.querySelector(step.selector);
    if(target) target.scrollIntoView({block:'center'});
    requestAnimationFrame(positionTutorialStep);
  });
}

function positionTutorialStep(){
  if(!activeTutorial) return;
  const step = activeTutorial.steps[activeTutorial.index];
  const target = document.querySelector(step.selector);
  const spotlight = document.getElementById('tutorialSpotlight');
  const callout = document.getElementById('tutorialCallout');
  if(!target){
    // this step's element isn't on screen right now — skip it rather than get stuck
    advanceTutorialStep();
    return;
  }
  const rect = target.getBoundingClientRect();
  const pad = 6;
  spotlight.style.left = (rect.left-pad)+'px';
  spotlight.style.top = (rect.top-pad)+'px';
  spotlight.style.width = (rect.width+pad*2)+'px';
  spotlight.style.height = (rect.height+pad*2)+'px';
  spotlight.style.display = 'block';

  document.getElementById('tutorialStepCount').textContent = `Step ${activeTutorial.index+1} of ${activeTutorial.steps.length}`;
  document.getElementById('tutorialStepTitle').textContent = step.title;
  document.getElementById('tutorialStepText').textContent = step.text;
  document.getElementById('tutorialNextBtn').textContent = (activeTutorial.index === activeTutorial.steps.length-1) ? 'Done' : 'Next';

  const calloutTop = rect.bottom + 16;
  const wouldOverflow = calloutTop + 180 > window.innerHeight;
  callout.style.left = Math.max(12, Math.min(rect.left, window.innerWidth-292)) + 'px';
  callout.style.top = (wouldOverflow ? Math.max(12, rect.top - 190) : calloutTop) + 'px';
  callout.style.display = 'block';
}

function advanceTutorialStep(){
  activeTutorial.index++;
  if(activeTutorial.index >= activeTutorial.steps.length){ finishTutorial(); return; }
  runTutorialStep();
}

async function finishTutorial(){
  const id = activeTutorial ? activeTutorial.id : null;
  document.getElementById('tutorialOverlay').style.display = 'none';
  document.getElementById('tutorialSpotlight').style.display = 'none';
  document.getElementById('tutorialCallout').style.display = 'none';
  document.getElementById('tutorialSplash').style.display = 'none';
  if(id){
    const myUser = board.users.find(u=>u.email===currentUser.email);
    if(myUser){
      myUser.tutorialsSeen = myUser.tutorialsSeen || [];
      if(!myUser.tutorialsSeen.includes(id)) myUser.tutorialsSeen.push(id);
      await saveBoard();
    }
  }
  activeTutorial = null;
  currentView = 'tracker';
  render();
  maybeStartTutorials(); // chains into the admin tutorial if applicable and not yet seen
}

function maybeStartTutorials(){
  if(!currentUser || !board) return;
  const myUser = board.users.find(u=>u.email===currentUser.email);
  const seen = (myUser && myUser.tutorialsSeen) || [];
  if(!seen.includes('general')){
    showTutorialSplash('general', GENERAL_TUTORIAL_STEPS);
  } else if(isAdmin() && !seen.includes('admin')){
    showTutorialSplash('admin', ADMIN_TUTORIAL_STEPS);
  }
}

function replayTutorial(){
  const steps = isAdmin() ? GENERAL_TUTORIAL_STEPS.concat(ADMIN_TUTORIAL_STEPS) : GENERAL_TUTORIAL_STEPS;
  showTutorialSplash(null, steps);
}

document.getElementById('tutorialStartBtn').onclick = ()=>{
  document.getElementById('tutorialSplash').style.display = 'none';
  runTutorialStep();
};
document.getElementById('tutorialSkipSplashBtn').onclick = ()=> finishTutorial();
document.getElementById('tutorialSkipBtn').onclick = ()=> finishTutorial();
document.getElementById('tutorialNextBtn').onclick = ()=> advanceTutorialStep();
document.getElementById('replayTutorialBtn').onclick = ()=> replayTutorial();

// Desktop-only left sidebar collapse — remembered locally per device, purely a display preference.
(function initSidebarCollapse(){
  const headerEl = document.querySelector('header');
  const toggleBtn = document.getElementById('sidebarCollapseToggle');
  if(!headerEl || !toggleBtn) return;
  let collapsed = false;
  try{ collapsed = localStorage.getItem('nsoSidebarCollapsed') === '1'; }catch(e){}
  if(collapsed){ headerEl.classList.add('collapsed'); toggleBtn.textContent = '›'; }
  toggleBtn.onclick = ()=>{
    collapsed = !collapsed;
    headerEl.classList.toggle('collapsed', collapsed);
    toggleBtn.textContent = collapsed ? '›' : '‹';
    try{ localStorage.setItem('nsoSidebarCollapsed', collapsed ? '1' : '0'); }catch(e){}
  };
})();
