<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Flow — FY27</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-functions-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<style>
  :root{
    --maroon:#4B1010; --maroon-dark:#350B0B;
    --bg:#F7F1E6;
    --card:#FFFFFF; --ink:#2B1A12; --sub:#8A7268; --line:#E8DCC8;
    --task-bg:#F3E9DC; --task-ink:#4B1010;
    --appr-bg:#F5E6C8; --appr-ink:#8A5A12;
    --gate-bg:#F3DCD8; --gate-ink:#8A2E2E;
    --done:#2F7A4F; --done-bg:#E3F2E7;
    --pending:#B8A99C; --pending-bg:#F2EDE6;
    --active:#4B1010;
    --restart:#C77A1F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 90px;}
  header{
    position:sticky;top:0;z-index:10;background:var(--maroon);
    padding:14px 16px 0;
  }
  .brand-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .brand-row img{height:38px;width:auto;border-radius:4px;}
  .brand-row .brand-text{color:#fff;}
  .eyebrow{
    font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#E8C79A;margin:0;font-weight:600;
  }
  h1{font-family:'Inter',sans-serif;font-weight:700;font-size:19px;margin:0;color:#fff;}

  .nav-tabs{display:flex;gap:4px;margin-bottom:0;}
  .nav-tab{
    flex:1;text-align:center;padding:11px 0;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:700;
    letter-spacing:.02em;color:#E8C79A;background:none;border:none;
    border-bottom:2px solid transparent;cursor:pointer;
  }
  .nav-tab.active{color:#fff;border-bottom-color:#D68730;}

  .who-row{display:flex;gap:8px;align-items:center;margin:10px 0;padding:0 0 12px;}
  .who-row span{font-size:12px;color:#E8C79A;}
  .who-row input{
    flex:1;padding:8px 10px;border-radius:6px;border:1px solid var(--line);
    background:#fff;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;
  }

  .store-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;-ms-overflow-style:none;scrollbar-width:none;}
  .store-tabs::-webkit-scrollbar{display:none;}

  /* ---- Desktop / wide-viewport layout: left-side collapsible panel ----
     Mobile stays exactly as designed above; this only kicks in on wider screens. */
  .sidebar-collapse-toggle{display:none;}
  .nav-tab-short{display:none;}
  @media (min-width: 900px){
    body{background:var(--bg);}
    .wrap{display:flex;align-items:flex-start;max-width:none;padding:0;}
    header{
      position:sticky;top:0;align-self:flex-start;height:100vh;width:220px;flex:none;
      overflow-y:auto;padding:16px 14px;box-sizing:border-box;transition:width .2s ease;
    }
    header.collapsed{width:64px;padding:16px 10px;}
    header.collapsed .brand-text,
    header.collapsed .nav-tab-label,
    header.collapsed .who-row span,
    header.collapsed #replayTutorialBtn{display:none;}
    header.collapsed .brand-row img{margin:0 auto;}
    header.collapsed .who-row{flex-direction:column;align-items:stretch;gap:4px;}
    .nav-tabs{flex-direction:column;gap:2px;}
    header.collapsed .nav-tab-short{display:inline;font-weight:700;}
    .nav-tab{text-align:left;padding:11px 10px;border-bottom:none;border-radius:6px;border-left:3px solid transparent;}
    .nav-tab.active{background:rgba(255,255,255,.08);border-left-color:#D68730;}
    header.collapsed .nav-tab{text-align:center;padding:11px 4px;}
    .who-row{flex-wrap:wrap;padding-bottom:0;}
    .sidebar-collapse-toggle{
      display:block;margin-top:14px;width:100%;background:rgba(255,255,255,.08);border:none;color:#E8C79A;
      border-radius:6px;padding:8px 0;font-size:14px;cursor:pointer;
    }
    .main-content{flex:1;min-width:0;max-width:640px;margin:0 auto;padding:0 0 40px;}
    .store-tabs{padding:16px 14px 12px;}
  }
  .store-tab{
    flex:none;font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;
    padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--sub);
    cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
  }
  .store-tab .pip{width:6px;height:6px;border-radius:50%;background:var(--pending);}
  .store-tab.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .store-tab.active .pip{background:#fff;}

  .store-summary{
    margin:14px 14px 0;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .store-summary .name{font-family:'Inter',sans-serif;font-weight:600;font-size:15px;}
  .store-summary .city{font-size:11.5px;color:var(--sub);}
  .stage-pill{
    font-family:'Inter',sans-serif;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;
  }

  #flow{padding:16px 14px 0;position:relative;}
  .rail-line{position:absolute;left:37px;top:16px;bottom:16px;width:2px;background:var(--line);z-index:0;}

  .delay-banner{
    background:#FDECD8;border:1px solid #F0CBA0;border-radius:10px;padding:11px 13px;margin:14px 0 4px;
    font-size:12.5px;line-height:1.5;color:#8A4A16;font-weight:500;
  }
  .delay-banner > div{margin-bottom:6px;}
  .delay-banner > div:last-child{margin-bottom:0;}

  .stage-row{position:relative;z-index:1;display:flex;gap:12px;margin-bottom:12px;}
  .stage-dot{
    flex:none;width:24px;height:24px;border-radius:50%;background:var(--pending-bg);border:2px solid var(--pending);
    display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:10px;
    font-weight:700;color:var(--pending);margin-top:14px;
  }
  .stage-dot.done{background:var(--done);border-color:var(--done);color:#fff;}
  .stage-dot.active{background:var(--active);border-color:var(--active);color:#fff;box-shadow:0 0 0 4px #F0DFC2;}
  .stage-dot.declined{background:var(--restart);border-color:var(--restart);color:#fff;}
  .stage-dot.overdue{background:#C13E3E;border-color:#C13E3E;color:#fff;}

  .stage-card{
    flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    box-shadow:0 1px 2px rgba(20,30,50,.04);cursor:pointer;
  }
  .stage-card.pending{opacity:.55;}
  .stage-card.active{border-color:var(--active);box-shadow:0 0 0 2px #F0DFC2;}
  .stage-card.skip{opacity:.35;}
  .stage-card.overdue-card{border-color:#E0A0A0;box-shadow:0 0 0 2px #FBE3E3;}

  .stage-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .stage-badge{
    font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 7px;border-radius:4px;
  }
  .stage-badge.task{background:var(--task-bg);color:var(--task-ink);}
  .stage-badge.approval{background:var(--appr-bg);color:var(--appr-ink);}
  .stage-badge.gate{background:var(--gate-bg);color:var(--gate-ink);}
  .stage-badge.checklist{background:var(--done-bg);color:var(--done);}
  .stage-title{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;margin-top:5px;line-height:1.25;}
  .stage-dur{font-family:'Inter',sans-serif;font-size:10.5px;color:var(--sub);flex:none;white-space:nowrap;}
  .stage-dur.overdue-dur{color:#C13E3E;font-weight:700;}
  .stage-owner{font-size:11.5px;color:var(--sub);margin-top:5px;}
  .stage-status{font-size:11px;font-weight:600;margin-top:6px;}
  .stage-status.done{color:var(--done);}
  .stage-status.active{color:var(--active);}
  .stage-status.pending{color:var(--pending);}
  .stage-status.declined{color:var(--restart);}
  .stage-status.overdue{color:#C13E3E;}
  .restart-note{
    display:flex;align-items:center;gap:5px;margin:2px 0 8px 36px;font-size:11px;color:var(--restart);
    font-family:'Inter',sans-serif;font-weight:600;
  }

  .sheet-backdrop{
    display:none;position:fixed;inset:0;background:rgba(15,20,30,.55);z-index:30;
    align-items:flex-end;justify-content:center;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    width:100%;max-width:640px;background:#fff;border-radius:16px 16px 0 0;padding:20px 18px 26px;
    max-height:88vh;overflow-y:auto;
  }
  .sheet-badge{margin-bottom:6px;}
  .sheet h2{font-family:'Inter',sans-serif;font-size:19px;margin:4px 0 6px;}
  .sheet .meta{font-size:12.5px;color:var(--sub);margin-bottom:10px;}
  .sheet .desc{font-size:13.5px;line-height:1.5;color:var(--ink);margin-bottom:10px;}
  .warn{
    background:var(--gate-bg);color:#8A2E2E;font-size:12.5px;padding:10px 12px;border-radius:8px;
    margin-bottom:12px;line-height:1.4;font-weight:500;
  }
  .info-box{
    background:var(--task-bg);color:#333B7A;font-size:12.5px;padding:10px 12px;border-radius:8px;
    margin-bottom:12px;line-height:1.4;font-weight:500;
  }
  .approver-list{margin:10px 0;}

  .collapse-group{
    border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden;
  }
  .collapse-group summary{
    padding:12px 14px;font-family:'Inter',sans-serif;font-weight:700;font-size:13.5px;
    cursor:pointer;background:var(--task-bg);color:var(--maroon);list-style:none;
    display:flex;justify-content:space-between;align-items:center;
  }
  .collapse-group summary::-webkit-details-marker{display:none;}
  .collapse-group summary::after{content:'▾';font-size:11px;color:var(--sub);}
  .collapse-group[open] summary::after{content:'▴';}
  .collapse-group > *:not(summary){margin-left:14px;margin-right:14px;}
  .collapse-group > .field:last-of-type, .collapse-group > .mini-task-card:last-of-type{margin-bottom:14px;}
  .collapse-group > summary + *{margin-top:12px;}

  .mini-task-card{
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;
  }
  .mini-task-card.done{background:var(--done-bg);border-color:#BEDFC9;}
  .mini-task-card.overdue-card{border-color:#E0A0A0;background:var(--gate-bg);}
  .mini-task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .mini-task-label{font-weight:600;font-size:13px;color:var(--ink);}
  .mini-task-sla{font-size:10.5px;color:var(--sub);white-space:nowrap;}
  .mini-task-sla.overdue-dur{color:#8A2E2E;font-weight:700;}
  .mini-task-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .mini-task-check{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink);white-space:nowrap;}
  .mini-task-check input{width:auto;}
  .mini-task-row input[type="date"]{flex:1;min-width:130px;padding:6px 8px;font-size:12px;border-radius:6px;border:1px solid var(--line);}
  .mini-task-flag{color:#8A2E2E;font-size:11.5px;font-weight:700;margin-top:6px;}
  .approver{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .approver:last-child{border-bottom:none;}
  .approver .check{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;cursor:pointer;
  }
  .approver .check.on{background:var(--done);border-color:var(--done);}
  .approver-name{flex:1;}
  .approver-stamp{font-size:10.5px;color:var(--sub);font-family:'Inter',sans-serif;}

  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .btn{flex:1;padding:12px;border-radius:8px;border:none;font-weight:600;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.decline{background:transparent;color:var(--restart);border:1px solid #F0D2BC;}
  .btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);}
  .field label{
    display:block;font-family:'Inter',sans-serif;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--sub);margin-bottom:6px;margin-top:12px;
  }
  .field textarea, .field input, .field select{
    width:100%;padding:11px;border-radius:6px;border:1px solid var(--line);font-size:16px;font-family:'Inter',sans-serif;background:#fff;
  }
  .field textarea{min-height:56px;resize:vertical;}
  .progress-line{font-size:12px;color:var(--sub);margin-top:8px;font-family:'Inter',sans-serif;}
  .log{font-size:11px;color:var(--sub);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.6;max-height:110px;overflow-y:auto;}
  .loading{text-align:center;padding:50px;color:var(--sub);font-family:'Inter',sans-serif;font-size:12.5px;}

  /* Admin view */
  .admin-wrap{padding:16px 14px 0;}
  .admin-section{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px;}
  .admin-section h3{font-family:'Inter',sans-serif;font-size:15px;margin:0 0 3px;}
  .admin-section .sub{font-size:12px;color:var(--sub);margin-bottom:12px;}
  .admin-row{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;
  }
  .admin-row:last-child{border-bottom:none;}
  .admin-row-main{font-weight:600;}
  .admin-row-sub{font-size:11.5px;color:var(--sub);}
  .level-badge{
    font-family:'Inter',sans-serif;font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;
    background:var(--task-bg);color:var(--task-ink);white-space:nowrap;
  }
  .remove-x{
    background:none;border:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 6px;flex:none;
  }
  .approver-slot-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);}
  .approver-slot-row:last-child{border-bottom:none;}
  .approver-slot-row label{margin:0;font-size:12px;color:var(--sub);}
  .approver-slot-row select{width:auto;flex:1;margin-left:10px;}
  .empty-note{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px;}

  .attachment-row{gap:10px;}
  .attach-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;flex:none;cursor:pointer;}
  .attach-file-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:var(--task-bg);border-radius:6px;flex:none;font-size:18px;cursor:pointer;}
  .file-preview-overlay{
    display:none;position:fixed;inset:0;background:rgba(20,10,10,.9);z-index:40;
    align-items:center;justify-content:center;padding:24px;
  }
  .file-preview-overlay.open{display:flex;}
  .file-preview-overlay img{max-width:100%;max-height:80vh;border-radius:8px;}
  .file-preview-overlay iframe{width:100%;height:80vh;border:none;border-radius:8px;background:#fff;}
  .file-preview-close{
    position:absolute;top:18px;right:18px;background:#fff;border:none;border-radius:50%;
    width:38px;height:38px;font-size:18px;cursor:pointer;z-index:41;
  }

  .tutorial-overlay{position:fixed;inset:0;z-index:300;pointer-events:none;}
  .tutorial-splash{
    position:fixed;inset:0;background:rgba(20,10,10,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:28px;pointer-events:auto;color:#fff;text-align:center;
  }
  .tutorial-splash h2{font-family:'Inter',sans-serif;font-weight:700;font-size:22px;margin:0 0 12px;}
  .tutorial-splash p{font-size:14px;color:#E8C79A;max-width:320px;margin:0 0 22px;line-height:1.5;}
  .tutorial-splash .btn-row{max-width:280px;}
  .tutorial-spotlight{
    position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,5,5,.82);
    pointer-events:none;transition:all .25s ease;z-index:301;border:2px solid var(--gold);
  }
  .tutorial-callout{
    position:fixed;background:#fff;border-radius:10px;padding:16px;max-width:280px;
    z-index:302;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.35);transition:all .25s ease;
  }
  .tutorial-step-count{font-size:10.5px;color:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
  .tutorial-callout h3{font-family:'Inter',sans-serif;font-size:15px;margin:0 0 6px;color:var(--maroon);}
  .tutorial-callout p{font-size:13px;color:var(--ink);margin:0 0 12px;line-height:1.4;}
  .tutorial-callout .btn-row{margin-top:0;}

  .login-gate{
    position:fixed;inset:0;z-index:100;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px;
    background-image:radial-gradient(var(--dot) 1px, transparent 1px);background-size:16px 16px;
  }
  .login-card{
    width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:24px 22px;box-shadow:0 8px 30px rgba(20,30,50,.1);
  }
  .login-card h2{font-family:'Inter',sans-serif;font-size:20px;margin:2px 0 10px;}
  .login-note{font-size:12.5px;color:var(--sub);line-height:1.5;margin-bottom:6px;}
  .auth-tabs{display:flex;gap:6px;margin-bottom:18px;}
  .auth-tabs .auth-tab{
    flex:1;padding:9px;font-size:13px;font-weight:600;border-radius:7px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;font-family:'Inter',sans-serif;
  }
  .auth-tabs .auth-tab.active{background:var(--maroon);border-color:var(--maroon);color:#fff;}
  .switch-link{
    background:none;border:none;color:var(--task-ink);font-size:12px;font-weight:600;cursor:pointer;
    text-decoration:underline;padding:0;
  }
  .who-row .switch-link{color:#E8C79A;} /* header has a dark background — needs a light color, unlike other uses of this class */
</style>
</head>
<body>
<div class="login-gate" id="loginGate">
  <div class="login-card">
    <p class="eyebrow">Project Flow</p>
    <h2>Sign in to continue</h2>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="authTabLogin">Log in</button>
      <button type="button" class="auth-tab" id="authTabSignup">Sign up</button>
    </div>

    <!-- Log in: plain email + password, no OTP -->
    <div id="loginForm">
      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" placeholder="you@company.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input id="loginPassword" type="password" placeholder="••••••••">
      </div>
      <div id="loginMsg" class="login-note" style="color:#C13E3E;display:none;"></div>
      <div class="btn-row"><button class="btn primary" id="loginBtn">Log in</button></div>
      <div class="btn-row"><button class="btn ghost" id="forgotPasswordBtn">Forgot password?</button></div>
    </div>

    <!-- Sign up (authFlowMode='signup') and Forgot password (authFlowMode='reset') share
         these same three steps — only the copy, button text, and final call differ. -->
    <div id="signupStep1" style="display:none;">
      <p class="login-note" id="step1Intro" style="margin-top:0;"></p>
      <div class="field">
        <label id="step1EmailLabel">Work email</label>
        <input id="signupEmail" type="email" placeholder="you@company.com">
      </div>
      <div id="signupStep1Msg" class="login-note" style="color:#C13E3E;display:none;"></div>
      <div class="btn-row"><button class="btn primary" id="sendOtpBtn">Send verification code</button></div>
    </div>

    <div id="signupStep2" style="display:none;">
      <p class="login-note">Enter the 6-digit code sent to <strong id="signupEmailConfirm"></strong></p>
      <div class="field">
        <input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" style="letter-spacing:4px;font-size:18px;">
      </div>
      <div id="signupStep2Msg" class="login-note" style="color:#C13E3E;display:none;"></div>
      <div class="btn-row"><button class="btn primary" id="verifyOtpBtn">Verify code</button></div>
      <div class="btn-row"><button class="btn ghost" id="resendOtpBtn">Resend code</button></div>
    </div>

// A line item is only eligible for actual-cost entry once it has a real tentative rate —
// an item added but never estimated shouldn't block closure or accept an actual cost yet.
function hasTentativeRate(li){
  return li.tentativeRate !== '' && li.tentativeRate !== null && li.tentativeRate !== undefined && !isNaN(parseFloat(li.tentativeRate));
}
function capexActualsComplete(s){
  const items = (s.capex && s.capex.lineItems) || [];
  const relevant = items.filter(hasTentativeRate);
  if(!relevant.length) return true;
  return relevant.every(li => li.actualRate !== '' && li.actualRate !== null && li.actualRate !== undefined && !isNaN(parseFloat(li.actualRate)));
}

// Backfills any site whose stored data predates the Security Deposit / Agreement /
// Registration / Post-LOI Execution restructure (adding stages 8-11 in their new shape).
function migrateStageStructure(){
  if(!board || !board.sites) return;
  let changed = false;
  if(!board.cities){ board.cities = [{code:'BLR', name:'Bangalore'}, {code:'CHN', name:'Chennai'}]; changed = true; }
  if(!board.slaOverrides){ board.slaOverrides = {}; changed = true; }
  if(!board.adminEmails){ board.adminEmails = []; changed = true; }
  if(!board.developerEmails){ board.developerEmails = []; changed = true; }
  // The stage pipeline itself lives in board.nsoStages so it's editable — seed it from
  // today's default the first time, then always point STAGES at whatever's actually
  // stored, so every function in the app automatically uses the live, edited version.
  if(!board.nsoStages || !board.nsoStages.length){ board.nsoStages = STAGES; changed = true; }
  STAGES = board.nsoStages;
  if(!board.templates){
    board.templates = [{
      id: 'tmpl_nso', name: 'NSO — New Store Opening',
      description: "Paradise's 11-stage new store opening pipeline — Market Identification through Post-LOI Execution.",
      builtIn: true, ownerId: null, createdAt: Date.now(),
    }];
    changed = true;
  }
  board.sites.forEach(site=>{
    if(!site.templateId){ site.templateId = 'tmpl_nso'; changed = true; }
    if(!site.status){ site.status = 'live'; changed = true; } // pre-existing sites were always immediately visible
    if(site.ownerId === undefined){ site.ownerId = null; changed = true; }
  });
  if(board.users){
    board.users.forEach(u=>{ if(!u.tutorialsSeen){ u.tutorialsSeen = []; changed = true; } });
  }
  board.sites.forEach(site=>{
    const s = board.siteData[site.id];
    if(!s) return;
    if(!s.comments){ s.comments = []; changed = true; }
    if(s.projectClosed === undefined){ s.projectClosed = false; s.closedBy = null; s.closedAt = null; changed = true; }
    if(!s.capex){ s.capex = { tentativeAssignees:[], actualAssignees:[], costVisibleTo:[], finalized:false, finalizedBy:null, finalizedAt:null, lineItems:[] }; changed = true; }
    if(s.closureOverride === undefined){ s.closureOverride = null; changed = true; }
    // Stage 1 (Market & Area Identification) was removed from the NSO pipeline — any
    // existing site whose current stage pointer still points at it needs recomputing.
    // Its old stageData[1] is deliberately left untouched, not deleted — just no longer shown.
    if(!STAGES.find(st=>st.id===s.current)){ s.current = STAGES[0].id; changed = true; }
    STAGES.forEach(st=>{
      if(!s.stageData[st.id]){
        const skip = st.bangaloreOnly && site.city !== 'BLR';
        s.stageData[st.id] = { status: skip ? 'skip' : 'pending', approvals:{}, notes:'', updatedBy:'', updatedAt:0,
          startedAt: null, delayReason:'', delayLoggedBy:'', delayLoggedAt:0, attachments:[], assignedTo:[], blockerFlags:[] };
        changed = true;
      }
      if(!s.stageData[st.id].attachments){ s.stageData[st.id].attachments = []; changed = true; }
      if(!s.stageData[st.id].blockerFlags){ s.stageData[st.id].blockerFlags = []; changed = true; }
      if(!Array.isArray(s.stageData[st.id].assignedTo)){ s.stageData[st.id].assignedTo = s.stageData[st.id].assignedTo ? [s.stageData[st.id].assignedTo] : []; changed = true; }
      if(st.id === 11 && !s.stageData[11].tasks){
        s.stageData[11].tasks = {};
        s.stageData[11].design = {};
        s.stageData[11].delivery = {};
        s.stageData[11].finalStage = {};
        changed = true;
      }
      if(st.id === 11 && s.stageData[11].tasks){
        Object.values(s.stageData[11].tasks).forEach(rec=>{
          if(!Array.isArray(rec.assignedTo)){ rec.assignedTo = rec.assignedTo ? [rec.assignedTo] : []; changed = true; }
        });
      }
    });
  });
  if(board.stakeholders){
    const legacyLevelLabels = {1:'Team Member', 2:'Manager', 3:'Senior Manager', 4:'Director', 5:'Leadership (MD/CFO/CXO)'};
    board.stakeholders.forEach(p=>{
      if(p.email === undefined){ p.email = ''; changed = true; }
      if(p.reportsTo === undefined){ p.reportsTo = null; changed = true; }
      if(typeof p.level === 'number'){ p.level = legacyLevelLabels[p.level] || ''; changed = true; }
    });
  }
  if(changed) saveBoard();
}

// Generates a sample CSV in-browser and downloads it — used next to every bulk-upload
// control so people can see the exact expected column format before uploading their own.
function downloadSampleCsv(headers, rows, filename){
  const esc = v => { const s = String(v); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = [headers.map(esc).join(','), ...rows.map(r => r.map(esc).join(','))].join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function timeAgo(ts){
  if(!ts) return '';
  const s = Math.round((Date.now()-ts)/1000);
  if(s<60) return 'just now';
  const m = Math.round(s/60); if(m<60) return m+'m ago';
  const h = Math.round(m/60); if(h<24) return h+'h ago';
  return Math.round(h/24)+'d ago';
}

function fmtINR(n){
  if(!isFinite(n)) return '—';
  const abs = Math.abs(n);
  let s;
  if(abs >= 10000000) s = (n/10000000).toFixed(2)+'Cr';
  else if(abs >= 100000) s = (n/100000).toFixed(2)+'L';
  else s = Math.round(n).toLocaleString('en-IN');
  return '₹'+s;
}

function calcProjection(f){
  const capex = parseFloat(f.capex) || 0;
  const cogsPct = parseFloat(f.cogsPct) || 0;
  const fixedOpex = parseFloat(f.fixedOpex) || 0;
  const monthlyGrowthByMonth = f.monthlyGrowthByMonth || {};
  const y2GrowthPct = parseFloat(f.y2GrowthPct) || 0;
  const y3GrowthPct = parseFloat(f.y3GrowthPct) || 0;
  let revenue = parseFloat(f.m1Revenue) || 0;
  let cumulative = -capex;
  let paybackMonth = null;
  let y = [ {rev:0, ebitda:0}, {rev:0, ebitda:0}, {rev:0, ebitda:0} ];
  for(let m=1; m<=36; m++){
    if(m>1){
      if(m<=12) revenue = revenue * (1 + (parseFloat(monthlyGrowthByMonth[m]) || 0)/100);
      else if(m===13) revenue = revenue * (1 + y2GrowthPct/100);
      else if(m===25) revenue = revenue * (1 + y3GrowthPct/100);
    }
    const cogs = revenue * cogsPct/100;
    const ebitda = revenue - cogs - fixedOpex;
    cumulative += ebitda;
    if(paybackMonth===null && cumulative>=0 && capex>0) paybackMonth = m;
    const yi = m<=12?0:(m<=24?1:2);
    y[yi].rev += revenue; y[yi].ebitda += ebitda;
  }
  const totalEBITDA = y[0].ebitda + y[1].ebitda + y[2].ebitda;
  const roi3yr = capex>0 ? ((totalEBITDA - capex)/capex*100) : 0;
  return { paybackMonth, y, totalEBITDA, roi3yr };
}

function recompute(id){
  const s = storeState(id);
  let current = STAGES[0].id; // fallback if every stage is somehow done/skip — always the pipeline's actual first stage
  for(const st of STAGES){
    const d = s.stageData[st.id];
    if(d.status === 'done' || d.status === 'skip') continue;
    current = st.id;
    break;
  }
  s.current = current;
  STAGES.forEach(st=>{
    const d = s.stageData[st.id];
    if(d.status === 'pending' && st.id === current){
      d.status = 'active';
      if(!d.startedAt) d.startedAt = Date.now();
    }
    if(d.status === 'active' && st.id !== current) d.status = 'pending';
  });
}

// Admin-editable SLA overrides live in board.slaOverrides, keyed 'stage_<id>' or 'task_<key>'.
// Falls back to the built-in default (from STAGES / STAGE11_TASKS) when no override is set.
// SLA overrides are scoped per individual project, not shared globally — board.slaOverrides
// is now { siteId: { 'stage_<id>': days, 'task_<key>': days } } instead of one flat table.
function effectiveSla(siteId, key, defaultDays){
  if(board && board.slaOverrides && board.slaOverrides[siteId] && board.slaOverrides[siteId][key] !== undefined && board.slaOverrides[siteId][key] !== ''){
    const v = parseInt(board.slaOverrides[siteId][key]);
    if(!isNaN(v)) return v;
  }
  return defaultDays;
}

function stageTiming(st, d, siteId){
  if(!d.startedAt || d.status==='done' || d.status==='skip') return null;
  const elapsedDays = Math.floor((Date.now() - d.startedAt) / 86400000);
  const sla = effectiveSla(siteId, 'stage_'+st.id, st.slaDays);
  const overdueDays = elapsedDays - sla;
  return { elapsedDays, overdueDays, isOverdue: overdueDays > 0, sla };
}

// Same idea as stageTiming, but for an individual checklist item within Stage 11 —
// all items share the stage's own startedAt (Construction Start) as their reference point.
function itemTiming(startedAt, slaDays, taskKey, siteId){
  if(!startedAt) return null;
  const elapsedDays = Math.floor((Date.now() - startedAt) / 86400000);
  const sla = taskKey ? effectiveSla(siteId, 'task_'+taskKey, slaDays) : slaDays;
  const overdueDays = elapsedDays - sla;
  return { elapsedDays, overdueDays, isOverdue: overdueDays > 0, sla };
}

// Target opening date for a site — projected from Construction Start (Stage 11's start)
// plus the Standard Opening Date SLA, or the actual/revised date once logged.
function computeTargetOpening(s){
  const d11 = s.stageData[11];
  if(!d11) return null;
  if(d11.finalStage && d11.finalStage.actualOpening) return { label:'opened', value: d11.finalStage.actualOpening };
  if(d11.finalStage && d11.finalStage.revisedOpeningDate) return { label:'revised target', value: d11.finalStage.revisedOpeningDate };
  if(d11.startedAt){
    const standardOpeningSla = STAGE11_TASKS.find(t=>t.key==='standardOpening').slaDays;
    return { label:'target opening', value: d11.startedAt + standardOpeningSla * 86400000 };
  }
  return null;
}

// Matches the signed-in email to a stakeholder record, so assignments can be found.
// Display label for a stakeholder in any picker — name, department, and who they report to.
function stakeholderLabel(p){
  const mgr = p.reportsTo ? board.stakeholders.find(x=>x.id===p.reportsTo) : null;
  let label = p.name;
  if(p.department) label += ' — ' + p.department;
  if(mgr) label += ` (reports to ${mgr.name})`;
  return label;
}

function findMyStakeholder(){
  if(!currentUser || !board || !board.stakeholders) return null;
  return board.stakeholders.find(p => p.email && p.email.toLowerCase() === currentUser.email.toLowerCase()) || null;
}

// Every open (not done/skipped) stage or Stage 11 task assigned to the signed-in person, across all sites.
function findMyOpenAssignments(){
  const me = findMyStakeholder();
  if(!me || !board) return [];
  const results = [];
  board.sites.forEach(site=>{
    const s = board.siteData[site.id];
    if(!s) return;
    STAGES.forEach(st=>{
      const d = s.stageData[st.id];
      if(!d || d.status==='done' || d.status==='skip') return;
      if((d.assignedTo||[]).includes(me.id)){
        results.push({ siteId: site.id, siteName: site.name, stageId: st.id, label: `${st.num} · ${st.title}` });
      }
      if(st.id === 11 && d.tasks){
        STAGE11_TASKS.forEach(item=>{
          const rec = d.tasks[item.key];
          if(rec && (rec.assignedTo||[]).includes(me.id) && !rec.done){
            results.push({ siteId: site.id, siteName: site.name, stageId: 11, label: `11 · ${item.label}` });
          }
        });
      }
    });
  });
  return results;
}

function showTutorialSplash(tutorialId, steps){
  activeTutorial = { id: tutorialId, steps, index: 0 };
  document.getElementById('tutorialSplashTitle').textContent = tutorialId==='admin' ? 'Welcome, Admin' : (tutorialId===null ? 'Tutorial' : 'Welcome to Project Flow');
  document.getElementById('tutorialSplashText').textContent = tutorialId==='admin'
    ? 'A quick look at where you manage sites, stakeholders, and cost.'
    : (tutorialId===null ? 'A replay of the full walkthrough.' : 'Track every store opening from Market ID to Grand Opening, one shared board for everyone involved. Want a quick tour?');
  document.getElementById('tutorialOverlay').style.display = 'block';
  document.getElementById('tutorialSplash').style.display = 'flex';
}

function runTutorialStep(){
  const step = activeTutorial.steps[activeTutorial.index];
  if(step.view && step.view !== currentView){
    currentView = step.view;
    render();
  }
  requestAnimationFrame(()=>{
    const target = document.querySelector(step.selector);
    if(target) target.scrollIntoView({block:'center'});
    requestAnimationFrame(positionTutorialStep);
  });
}

function positionTutorialStep(){
  if(!activeTutorial) return;
  const step = activeTutorial.steps[activeTutorial.index];
  const target = document.querySelector(step.selector);
  const spotlight = document.getElementById('tutorialSpotlight');
  const callout = document.getElementById('tutorialCallout');
  if(!target){
    // this step's element isn't on screen right now — skip it rather than get stuck
    advanceTutorialStep();
    return;
  }
  const rect = target.getBoundingClientRect();
  const pad = 6;
  spotlight.style.left = (rect.left-pad)+'px';
  spotlight.style.top = (rect.top-pad)+'px';
  spotlight.style.width = (rect.width+pad*2)+'px';
  spotlight.style.height = (rect.height+pad*2)+'px';
  spotlight.style.display = 'block';

  document.getElementById('tutorialStepCount').textContent = `Step ${activeTutorial.index+1} of ${activeTutorial.steps.length}`;
  document.getElementById('tutorialStepTitle').textContent = step.title;
  document.getElementById('tutorialStepText').textContent = step.text;
  document.getElementById('tutorialNextBtn').textContent = (activeTutorial.index === activeTutorial.steps.length-1) ? 'Done' : 'Next';

  const calloutTop = rect.bottom + 16;
  const wouldOverflow = calloutTop + 180 > window.innerHeight;
  callout.style.left = Math.max(12, Math.min(rect.left, window.innerWidth-292)) + 'px';
  callout.style.top = (wouldOverflow ? Math.max(12, rect.top - 190) : calloutTop) + 'px';
  callout.style.display = 'block';
}

function advanceTutorialStep(){
  activeTutorial.index++;
  if(activeTutorial.index >= activeTutorial.steps.length){ finishTutorial(); return; }
  runTutorialStep();
}

async function finishTutorial(){
  const id = activeTutorial ? activeTutorial.id : null;
  document.getElementById('tutorialOverlay').style.display = 'none';
  document.getElementById('tutorialSpotlight').style.display = 'none';
  document.getElementById('tutorialCallout').style.display = 'none';
  document.getElementById('tutorialSplash').style.display = 'none';
  if(id){
    const myUser = board.users.find(u=>u.email===currentUser.email);
    if(myUser){
      myUser.tutorialsSeen = myUser.tutorialsSeen || [];
      if(!myUser.tutorialsSeen.includes(id)) myUser.tutorialsSeen.push(id);
      await saveBoard();
    }
  }
  activeTutorial = null;
  currentView = 'tracker';
  render();
  maybeStartTutorials(); // chains into the admin tutorial if applicable and not yet seen
}

function maybeStartTutorials(){
  if(!currentUser || !board) return;
  const myUser = board.users.find(u=>u.email===currentUser.email);
  const seen = (myUser && myUser.tutorialsSeen) || [];
  if(!seen.includes('general')){
    showTutorialSplash('general', GENERAL_TUTORIAL_STEPS);
  } else if(isAdmin() && !seen.includes('admin')){
    showTutorialSplash('admin', ADMIN_TUTORIAL_STEPS);
  }
}

function replayTutorial(){
  const steps = isAdmin() ? GENERAL_TUTORIAL_STEPS.concat(ADMIN_TUTORIAL_STEPS) : GENERAL_TUTORIAL_STEPS;
  showTutorialSplash(null, steps);
}

document.getElementById('tutorialStartBtn').onclick = ()=>{
  document.getElementById('tutorialSplash').style.display = 'none';
  runTutorialStep();
};
document.getElementById('tutorialSkipSplashBtn').onclick = ()=> finishTutorial();
document.getElementById('tutorialSkipBtn').onclick = ()=> finishTutorial();
document.getElementById('tutorialNextBtn').onclick = ()=> advanceTutorialStep();
document.getElementById('replayTutorialBtn').onclick = ()=> replayTutorial();

function renderFilesView(){
  const el = document.getElementById('filesView');
  let html = `<div class="admin-section"><h3>Files</h3><div class="sub">Every file uploaded, organized by site and stage, newest first.</div></div>`;

  const sites = visibleSites();
  if(sites.length === 0){
    html += `<div class="empty-note">No sites yet.</div>`;
  }

  sites.forEach(site=>{
    const s = board.siteData[site.id];
    if(!s) return;
    const stagesWithFiles = STAGES.filter(st => s.stageData[st.id] && (s.stageData[st.id].attachments||[]).length);
    const totalFiles = stagesWithFiles.reduce((sum,st)=>sum + s.stageData[st.id].attachments.length, 0);
    if(totalFiles === 0) return;

    html += `<details class="collapse-group">
      <summary>${escapeHtml(site.name)} (${totalFiles})</summary>`;
    stagesWithFiles.forEach(st=>{
      const files = s.stageData[st.id].attachments.slice().sort((a,b)=>b.uploadedAt - a.uploadedAt);
      html += `<details class="collapse-group" style="margin-top:8px;">
        <summary style="background:var(--cream);color:var(--ink);">${st.num} · ${escapeHtml(st.title)} (${files.length})</summary>`;
      files.forEach(a=>{
        const canDelete = a.uploadedBy === getWho() || isAdmin();
        const thumb = isImageFile(a.name)
          ? `<img src="${a.url}" class="attach-thumb" data-file-preview data-url="${a.url}" data-name="${escapeHtml(a.name)}" alt="">`
          : `<div class="attach-file-icon" data-file-preview data-url="${a.url}" data-name="${escapeHtml(a.name)}">📄</div>`;
        html += `<div class="approver attachment-row" style="margin:0 14px 8px;">
          ${thumb}
          <div class="approver-name" data-file-preview data-url="${a.url}" data-name="${escapeHtml(a.name)}" style="cursor:pointer;">${escapeHtml(a.name)}
            <div class="approver-stamp">${escapeHtml(a.uploadedBy)} · ${timeAgo(a.uploadedAt)}</div></div>
          ${canDelete ? `<button class="remove-x" data-files-del="${site.id}|${st.id}|${a.path||''}|${a.uploadedAt}">✕</button>` : ''}
        </div>`;
      });
      html += `</details>`;
    });
    html += `</details>`;
  });

  el.innerHTML = html;

  el.querySelectorAll('[data-file-preview]').forEach(node=>{
    node.onclick = ()=> openFilePreview(node.dataset.url, node.dataset.name);
  });
  el.querySelectorAll('[data-files-del]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [siteId, stageIdStr, path, uploadedAtStr] = btn.dataset.filesDel.split('|');
      const stageId = parseInt(stageIdStr);
      const uploadedAt = parseFloat(uploadedAtStr);
      const d = board.siteData[siteId].stageData[stageId];
      const idx = d.attachments.findIndex(a => a.uploadedAt === uploadedAt && (a.path||'') === path);
      if(idx === -1) return;
      const att = d.attachments[idx];
      if(!(att.uploadedBy === getWho() || isAdmin())) return;
      if(!window.confirm(`Delete "${att.name}"? This can't be undone.`)) return;
      try{ if(att.path) await storage.ref(att.path).delete(); }catch(e){ console.error('storage delete failed', e); }
      d.attachments.splice(idx, 1);
      await saveBoard(); render();
    };
  });
}

    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      let added = 0;
      rows.forEach(row=>{
        const name = String(row['Item']||'').trim();
        if(!name) return;
        c.lineItems.push({
          id: uid('li'), name,
          qty: String(row['Quantity']||''), tentativeRate: String(row['Tentative Rate']||''),
          actualRate:'', actualBy:'', actualAt:0,
        });
        added++;
      });
      await saveBoard();
      statusEl.textContent = `Imported ${added} line item(s).`;
      render();
    }catch(e){
      statusEl.textContent = 'Import failed: ' + e.message;
    }

  if(downloadSampleCapexActual) downloadSampleCapexActual.onclick = ()=>{

      ['DG Set','192000'], ['POS Terminals','47500'], ['Chairs','3200'],
    ], 'sample-capex-actual.csv');
  };
  const capexActualBulkBtn = document.getElementById('capexActualBulkBtn');
  if(capexActualBulkBtn) capexActualBulkBtn.onclick = async ()=>{
    const file = document.getElementById('capexActualBulkFile').files[0];
    const statusEl = document.getElementById('capexActualBulkStatus');
    if(!file){ statusEl.textContent = 'Choose a file first.'; return; }
    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      let matched = 0, unmatched = [], skippedNoTentative = [];
      const who = getWho();
      rows.forEach(row=>{
        const name = String(row['Item']||'').trim();
        const rate = String(row['Actual Rate']||'').trim();
        if(!name || !rate) return;
        const li = c.lineItems.find(x=>x.name.toLowerCase()===name.toLowerCase());
        if(!li){ unmatched.push(name); return; }
        if(!hasTentativeRate(li)){ skippedNoTentative.push(name); return; }
        li.actualRate = rate; li.actualBy = who; li.actualAt = Date.now(); matched++;
      });
      await saveBoard();
      let msg = `Updated ${matched} item(s).`;
      if(skippedNoTentative.length) msg += ` Skipped (no tentative rate set): ${skippedNoTentative.join(', ')}.`;
      if(unmatched.length) msg += ` No line item matched: ${unmatched.join(', ')}.`;
      statusEl.textContent = msg;
      render();
    }catch(e){
      statusEl.textContent = 'Import failed: ' + e.message;
    }
  };
  const finalizeBtn = document.getElementById('capexFinalizeBtn');
  if(finalizeBtn) finalizeBtn.onclick = async ()=>{
    if(!window.confirm('Finalize the tentative CapEx? Line items lock for editing until actuals are reconciled.')) return;
    c.finalized = true; c.finalizedBy = getWho(); c.finalizedAt = Date.now();
    s.log.push({stageId:3, text:`Tentative CapEx finalized by ${getWho()}`, at: Date.now()});
    await saveBoard(); render();
  };
}

// Visibility rule: Admin sees everything. Drafts are creator-only. Live/closed projects
// are visible to their creator plus anyone assigned to any stage or Post-LOI task in them.
function canSeeSite(site){
  if(isAdmin()) return true;
  if(!currentUser) return false;
  if(site.status === 'draft') return site.ownerId === currentUser.email;
  if(site.ownerId === currentUser.email) return true;
  const me = findMyStakeholder();
  if(!me) return false;
  const s = board.siteData[site.id];
  if(!s) return false;
  return STAGES.some(st=>{
    const d = s.stageData[st.id];
    if(!d) return false;
    if((d.assignedTo||[]).includes(me.id)) return true;
    if(st.id===11 && d.tasks){
      return Object.values(d.tasks).some(t=>(t.assignedTo||[]).includes(me.id));
    }
    return false;
  });
}
function visibleSites(){ return board.sites.filter(site => !site.deletedAt && canSeeSite(site)); }

function renderTabs(){
  const el = document.getElementById('storeTabs');
  const sites = visibleSites();
  if(sites.length === 0){ el.innerHTML=''; return; }
  el.innerHTML = sites.map(site=>{
    const st = storeState(site.id);
    const curStage = STAGES.find(x=>x.id===st.current);
    const curD = st.stageData[st.current];
    const curT = curStage ? stageTiming(curStage, curD, site.id) : null;
    let pipColor = 'var(--active)';
    if(curStage && curStage.type==='approval') pipColor = 'var(--appr-ink)';
    if(curStage && curStage.type==='gate') pipColor = 'var(--gate-ink)';
    if(st.stageData[11] && st.stageData[11].status==='done') pipColor = 'var(--done)';
    if(curT && curT.isOverdue) pipColor = '#C13E3E';
    return `<button class="store-tab ${site.id===activeStore?'active':''}" data-s="${site.id}">
      <span class="pip" style="background:${site.id===activeStore?'#fff':pipColor}"></span>${escapeHtml(site.name.replace(' — ',' · '))}
    </button>`;
  }).join('');
  el.querySelectorAll('.store-tab').forEach(b=>{
    b.onclick = ()=>{ activeStore = b.dataset.s; render(); };
  });
}
