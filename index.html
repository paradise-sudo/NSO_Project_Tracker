          const assignedNames = (site.assignedTo||[]).map(id=>{const p=board.stakeholders.find(x=>x.id===id);return p?p.name:null;}).filter(Boolean);
          return `<div class="admin-row" data-open-scout-site="${site.id}" style="cursor:pointer;flex-wrap:wrap;">
            <div style="flex:1 1 100%;">
              <div class="admin-row-main">${escapeHtml(site.label)}</div>
              <div class="admin-row-sub">${assignedNames.length ? 'Assigned: '+escapeHtml(assignedNames.join(', ')) : 'Unassigned'}</div>
            </div>
            <div class="stage-pill" style="background:${meta.bg};color:${meta.ink};margin-top:6px;">${escapeHtml(meta.label)}</div>
          </div>`;
        }).join('')}
        <div class="field" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;">
          <label>New site label</label><input id="newScoutSiteLabel_${loc.id}" value="Site ${sites.length+1}">
        </div>
        <div class="btn-row"><button class="btn ghost" data-add-scout-site="${loc.id}">Add site</button></div>
      </details>
    </div>`;
  });

  el.innerHTML = html;
  wireAccordionPersistence(el);

  const addLocBtn = document.getElementById('addScoutLocationBtn');
  if(addLocBtn) addLocBtn.onclick = withClickLoading(addLocBtn, 'Working…', async ()=>{
    const name = document.getElementById('newScoutLocationName').value.trim();
    if(!name) return;
    const city = document.getElementById('newScoutLocationCity').value;
    const me = findMyStakeholder();
    board.scoutingLocations = board.scoutingLocations || [];
    board.scoutingLocations.push({ id: uid('loc'), name, city, createdBy: me?me.id:null, createdByName: getWho(), createdAt: Date.now(), archivedAt: null });
    await saveBoard();
    document.getElementById('newScoutLocationName').value = '';
    render();
  });

  el.querySelectorAll('[data-add-scout-site]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      const locId = btn.dataset.addScoutSite;
      const loc = board.scoutingLocations.find(l=>l.id===locId);
      if(!loc) return;
      const labelInput = document.getElementById(`newScoutSiteLabel_${locId}`);
      const label = (labelInput && labelInput.value.trim()) || `Site ${scoutingSitesForLocation(locId).length+1}`;
      const me = findMyStakeholder();
      const who = getWho();
      const id = uid('scout');
      board.scoutingSiteData = board.scoutingSiteData || {};
      board.scoutingSiteData[id] = {
        id, locationId: locId, locationName: loc.name, label, city: loc.city,
        assignedTo: me ? [me.id] : [],
        values: {}, attachments: [], status: 'scouting',
        createdBy: me ? me.id : null, createdByName: who, createdAt: Date.now(),
        updatedBy: who, updatedAt: Date.now(),
        log: [{ text: `Site created by ${who}`, by: who, byId: me?me.id:null, at: Date.now() }],
      };
      await saveBoard();
      render();
      openScoutingSiteSheet(id);
    });
  });

  el.querySelectorAll('[data-open-scout-site]').forEach(row=>{
    row.onclick = ()=> openScoutingSiteSheet(row.dataset.openScoutSite);
  });
}

// GeoIQ report — upload once the scouting site is approved, then Claude reads the PDF
// and pulls out the numbers that matter. Kept separate from the generic "Photos &
// Documents" attachments below, since this one drives its own AI analysis step and a
// dedicated summary — not just a file link.
function renderGeoiqReportSection(site, canEdit){
  const g = site.geoiqReport || {};
  let html = `<details class="collapse-group" open><summary>GeoIQ Site Report <span style="font-weight:400;color:var(--sub);font-size:11px;">${g.status==='done'?'analyzed':g.status==='analyzing'?'analyzing…':g.status==='failed'?'failed':'not uploaded'}</span></summary>`;

  if(!g.fileUrl){
    html += `<div class="info-box">Upload the GeoIQ site report (PDF from retailiq.geoiq.ai) to pull its numbers in automatically.</div>`;
    if(canEdit){
      html += `<div class="field"><input id="geoiqFile" type="file" accept="application/pdf"></div>
        <div class="btn-row"><button class="btn ghost" id="uploadGeoiqBtn">Upload &amp; analyze</button></div>
        <div id="geoiqUploadStatus" class="progress-line"></div>`;
    }
  } else {
    html += `<div class="progress-line">${escapeHtml(g.fileName||'GeoIQ report')} · uploaded by ${escapeHtml(g.uploadedBy||'—')} · ${timeAgo(g.uploadedAt)} — <a href="${g.fileUrl}" target="_blank" rel="noopener">open PDF</a></div>`;
    if(g.status === 'analyzing'){
      html += `<div class="info-box">Analyzing — Claude is reading the report. This can take a minute or two; feel free to close this and come back.</div>`;
    } else if(g.status === 'failed'){
      html += `<div class="warn">⚠ Could not read this report: ${escapeHtml(g.error||'unknown error')}</div>`;
      if(canEdit) html += `<div class="btn-row"><button class="btn ghost" id="retryGeoiqBtn">Retry analysis</button></div>`;
    } else if(g.status === 'done' && g.parsedData){
      html += renderGeoiqFullSummary(g);
      html += `<div class="progress-line">Analyzed ${timeAgo(g.analyzedAt)}.</div>`;
    }
    if(canEdit && g.status !== 'analyzing'){
      html += `<div class="field" style="margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;"><label>Replace with a new PDF</label><input id="geoiqFile" type="file" accept="application/pdf"></div>
        <div class="btn-row"><button class="btn ghost" id="uploadGeoiqBtn">Upload &amp; analyze</button></div>
        <div id="geoiqUploadStatus" class="progress-line"></div>`;
    }
  }
  html += `</details>`;
  return html;
}
function fmtNum(n){ const v = parseFloat(n); return (n===null||n===undefined||isNaN(v)) ? '—' : v.toLocaleString('en-IN'); }
// Small colored chip for a benchmark zone — mirrors the reference tool's good/mid/weak/
// top/na coloring using this app's own palette instead of introducing new CSS classes.
function zoneChipHtml(z){
  const map = { top:['#fff','var(--done)'], good:['var(--done)','var(--done-bg)'], mid:['#8A5A12','var(--appr-bg)'], weak:['#8A2E2E','var(--gate-bg)'], na:['var(--sub)','var(--pending-bg)'] };
  const [ink,bg] = map[z] || map.na;
  const label = {top:'Top',good:'Good',mid:'Borderline',weak:'Weak',na:'—'}[z] || '—';
  return `<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;background:${bg};color:${ink};">${label}</span>`;
}
// Renders the full parsed GeoIQ data — overview score/highlights, population, retail
// indicators, footfall, competition, risk, the Paradise 18-feature benchmark fit, key
// highlights and data-quality flags. Every sub-block checks for its own data and is
// skipped when the PDF didn't have it, so a partially-read report still shows cleanly.
function renderGeoiqFullSummary(g){
  const d = g.parsedData;
  const bf = g.benchmarkFit;
  let html = `<div style="margin:8px 0;">`;
  if(d.summary) html += `<div class="progress-line" style="font-weight:600;color:var(--ink);margin-bottom:10px;">${escapeHtml(d.summary)}</div>`;

  // Paradise benchmark fit — the most decision-relevant number, shown first
  if(bf && (bf.dinein.scored + bf.delivery.scored) > 0){
    html += `<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
      <div style="flex:1;min-width:140px;background:var(--task-bg);border-radius:8px;padding:10px 12px;">
        <div style="font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;">Dine-in fit</div>
        <div style="font-size:20px;font-weight:700;color:var(--ink);">${bf.dinein.pass}/${bf.dinein.scored}<span style="font-size:12px;font-weight:400;color:var(--sub);"> of 10 features</span></div>
        ${bf.dinein.pct!==null?`<div style="font-size:11px;color:var(--sub);">${bf.dinein.pct}% correlation-weighted</div>`:''}
      </div>
      <div style="flex:1;min-width:140px;background:var(--task-bg);border-radius:8px;padding:10px 12px;">
        <div style="font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;">Delivery fit</div>
        <div style="font-size:20px;font-weight:700;color:var(--ink);">${bf.delivery.pass}/${bf.delivery.scored}<span style="font-size:12px;font-weight:400;color:var(--sub);"> of 8 features</span></div>
        ${bf.delivery.pct!==null?`<div style="font-size:11px;color:var(--sub);">${bf.delivery.pct}% correlation-weighted</div>`:''}
      </div>
    </div>
    <div class="progress-line" style="margin-top:0;margin-bottom:10px;">Against the 18 GeoIQ features correlated with revenue across Paradise's own stores. Indicative — built from whatever this PDF's radius supports, not GeoIQ's exact feature export.</div>`;
  }

  // Overview: score + highlight chips
  const ov = d.overview || {};
  if(ov.score !== null && ov.score !== undefined || ov.highlights){
    html += `<div style="margin-bottom:10px;">`;
    if(ov.score !== null && ov.score !== undefined) html += `<div style="font-size:11px;color:var(--sub);">GeoIQ site score</div><div style="font-size:22px;font-weight:700;color:var(--ink);margin-bottom:6px;">${escapeHtml(String(ov.score))}<span style="font-size:13px;color:var(--sub);font-weight:400;"> /5</span></div>`;
    const hl = ov.highlights || {};
    const hlLabels = { footfall:'Footfall', spend_quotient:'Spend quotient', growth:'Growth', complementary_presence:'Complementary brands', competitor_presence:'Competitor presence', cannibalisation:'Cannibalisation', total_addressable_market:'Addressable market' };
    const hlRows = Object.keys(hlLabels).filter(k=>hl[k]);
    if(hlRows.length){
      html += `<div style="display:flex;flex-wrap:wrap;gap:6px;">` + hlRows.map(k=>`<span style="font-size:11px;background:var(--pending-bg);border-radius:6px;padding:4px 8px;">${hlLabels[k]}: <b>${escapeHtml(hl[k])}</b></span>`).join('') + `</div>`;
    }
    html += `</div>`;
  }

  // Population
  const p = d.population || {};
  const popRows = [];
  if(p.hh_total) popRows.push(['Total households', fmtNum(p.hh_total)]);
  if(p.hh_10l) popRows.push(['Households ₹10L+ income', fmtNum(p.hh_10l) + (p.hh_10l_pct?` (${Math.round(p.hh_10l_pct)}%)`:'')]);
  if(p.hh_20l) popRows.push(['Households ₹20L+ income', fmtNum(p.hh_20l) + (p.hh_20l_pct?` (${Math.round(p.hh_20l_pct)}%)`:'')]);
  if(p.affluence !== null && p.affluence !== undefined) popRows.push(['Affluence index', p.affluence.toFixed(2) + (p.affluence_city?` (city ${p.affluence_city.toFixed(2)})`:'')]);
  if(p.res_rent_sqft) popRows.push(['Residential rent', '₹'+fmtNum(p.res_rent_sqft)+'/sq.ft' + (p.res_rent_sqft_city?` (city ₹${fmtNum(p.res_rent_sqft_city)})`:'')]);
  if(popRows.length) html += geoiqMetricBlock('Population & lifestyle', popRows);

  // Retail indicators
  const r = d.retail || {};
  const retRows = [];
  if(r.footfall !== null && r.footfall !== undefined) retRows.push(['Footfall index', r.footfall.toFixed(0) + (r.footfall_city?` (city ${r.footfall_city.toFixed(0)})`:'') + ' /100']);
  if(r.growth !== null && r.growth !== undefined) retRows.push(['Growth index', r.growth.toFixed(0) + (r.growth_city?` (city ${r.growth_city.toFixed(0)})`:'') + ' /100']);
  if(r.spending !== null && r.spending !== undefined) retRows.push(['Spending capacity', r.spending.toFixed(0) + (r.spending_city?` (city ${r.spending_city.toFixed(0)})`:'') + ' /100']);
  if(r.stores !== null && r.stores !== undefined) retRows.push(['Stores nearby', fmtNum(r.stores) + (r.stores_city?` (city avg ${fmtNum(r.stores_city)})`:'')]);
  if(retRows.length) html += geoiqMetricBlock('Retail indicators', retRows);

  // Footfall trend (simple text, no chart on the sheet — the PPT gets the bar chart)
  if(d.footfall_hourly && Array.isArray(d.footfall_hourly) && d.footfall_hourly.length===24){
    const peak = d.footfall_hourly.indexOf(Math.max(...d.footfall_hourly));
    const peakLabel = peak===0?'12 AM':peak<12?`${peak} AM`:peak===12?'12 PM':`${peak-12} PM`;
    html += geoiqMetricBlock('Footfall', [['Peak hour', peakLabel + (d.footfall_month?` (${escapeHtml(d.footfall_month)})`:'')]]);
  }

  // Competition
  const comp = d.competitors || [], compl = d.complementary || [];
  if(comp.length || compl.length){
    const compNames = [...new Set(comp.map(c=>c.name))];
    const compRows = [];
    if(comp.length) compRows.push(['Competitor outlets', `${comp.length} outlets, ${compNames.length} brand${compNames.length===1?'':'s'}`]);
    if(compl.length) compRows.push(['Complementary outlets nearby', String(compl.length)]);
    html += geoiqMetricBlock('Competition', compRows);
    if(compNames.length) html += `<div class="progress-line" style="margin-top:-4px;">${compNames.slice(0,8).map(escapeHtml).join(', ')}${compNames.length>8?', …':''}</div>`;
  }

  // Risk: cannibalisation + closures
  const can = d.cannibalisation || {};
  const riskRows = [];
  if(can.pct !== null && can.pct !== undefined) riskRows.push(['Cannibalisation', can.pct.toFixed(1)+'%']);
  else if(can.rating) riskRows.push(['Cannibalisation', escapeHtml(can.rating) + (can.active_stores===0?' (no Paradise stores loaded in GeoIQ — unverified)':'')]);
  if(Array.isArray(d.closures) && d.closures.length){
    const total = d.closures.reduce((s,c)=>s+(parseFloat(c.count)||0),0);
    const fnb = d.closures.filter(c=>/^(?!.*internet).*(restaurant|cafe|bakery|dessert|food|qsr|sweet)/i.test(c.category||'')).reduce((s,c)=>s+(parseFloat(c.count)||0),0);
    riskRows.push(['Closures nearby (12mo)', `${fnb} F&B of ${total} total`]);
  }
  if(riskRows.length) html += geoiqMetricBlock('Risk', riskRows);

  if(Array.isArray(d.key_highlights) && d.key_highlights.length){
    html += `<div class="field" style="margin-top:10px;"><label>Key highlights</label><ul style="margin:0;padding-left:18px;font-size:13px;">` + d.key_highlights.map(h=>`<li>${escapeHtml(h)}</li>`).join('') + `</ul></div>`;
  }
  if(Array.isArray(d.flags) && d.flags.length){
    html += `<div class="warn" style="margin-top:10px;font-size:12px;"><strong>Data checks:</strong><ul style="margin:4px 0 0;padding-left:18px;">` + d.flags.map(f=>`<li>${escapeHtml(f)}</li>`).join('') + `</ul></div>`;
  }
  html += `</div>`;
  return html;
}
function geoiqMetricBlock(title, rows){
  return `<div style="margin-bottom:10px;">
    <div style="font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;">${escapeHtml(title)}</div>
    <div class="approver-list">${rows.map(r=>`<div class="approver" style="padding:6px 0;"><div class="approver-name" style="font-size:12.5px;">${escapeHtml(r[0])}</div><div style="font-weight:600;font-size:12.5px;">${r[1]}</div></div>`).join('')}</div>
  </div>`;
}

// Quick-estimate financials — deliberately lightweight (flat monthly revenue, not the
// full 12-month ramp curve the P&L stage uses), since this is a preliminary scouting-
// stage read, not the detailed model. Computed live from whatever's saved.
function computePrelimFinancials(pf){
  const capex = parseFloat(pf.capex) || 0;
  const revenue = parseFloat(pf.monthlyRevenue) || 0;
  const cogsPct = parseFloat(pf.cogsPct) || 0;
  const fixedOpex = parseFloat(pf.monthlyFixedOpex) || 0;
  const ebitda = revenue - (revenue * cogsPct/100) - fixedOpex;
  const ebitdaPct = revenue > 0 ? (ebitda/revenue*100) : 0;
  const paybackDays = (capex > 0 && ebitda > 0) ? Math.round((capex/ebitda) * 30) : null;
  return { capex, revenue, cogsPct, fixedOpex, ebitda, ebitdaPct, paybackDays };
}

// Fetches a Storage URL and returns it as a data: URL — PptxGenJS needs actual image
// bytes (a bare https URL isn't reliably fetchable from inside the generated file),
// so every photo is pulled down and re-embedded rather than linked.
async function urlToDataUrl(url){
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Builds and downloads one PPTX for a single scouting site — title, GeoIQ summary,
// preliminary financials, every photo attachment embedded as its own slide, and a
// closing slide linking out to videos/reports/other non-image files. True video
// embedding is deliberately skipped: encoding a playable video into a pptx means
// pulling down the full file and re-muxing it, which balloons file size for little
// benefit when a hyperlink opens the same clip instantly.
async function generateScoutingSitePpt(site, statusEl){
  if(!window.PptxGenJS){ throw new Error('The PowerPoint builder did not load — check your connection and try again.'); }
  if(statusEl) statusEl.textContent = 'Building deck…';
  const pptx = new window.PptxGenJS();
  pptx.defineLayout({ name: 'PARADISE', width: 10, height: 5.63 });
  pptx.layout = 'PARADISE';

  const MAROON = '4B1010', GOLD = 'D68730', CREAM = 'F7F1E6', INK = '2B1A12';

  // Title slide
  let slide = pptx.addSlide();
  slide.background = { color: CREAM };
  slide.addText(escapeHtml(site.locationName) ? site.locationName : site.locationName, { x:0.5, y:1.7, w:9, h:1, fontSize:32, bold:true, color:MAROON, fontFace:'Arial' });
  slide.addText(site.label || '', { x:0.5, y:2.5, w:9, h:0.6, fontSize:18, color:INK });
  const meta = SCOUTING_STATUS_META[site.status] || {};
  slide.addText(`${(board.cities.find(c=>c.code===site.city)||{}).name || site.city} · ${meta.label||site.status} · ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`,
    { x:0.5, y:3.1, w:9, h:0.5, fontSize:13, color:'8A7268' });

  // Preliminary financials
  const pf = site.prelimFinancials || {};
  const calc = computePrelimFinancials(pf);
  slide = pptx.addSlide();
  slide.background = { color: 'FFFFFF' };
  slide.addText('Preliminary Financials', { x:0.5, y:0.4, w:9, h:0.6, fontSize:24, bold:true, color:MAROON });
  const finRows = [
    ['Estimated CAPEX', pf.capex ? fmtINR(parseFloat(pf.capex)) : '—'],
    ['Estimated monthly revenue', pf.monthlyRevenue ? fmtINR(parseFloat(pf.monthlyRevenue)) : '—'],
    ['Estimated COGS %', pf.cogsPct ? pf.cogsPct+'%' : '—'],
    ['Estimated monthly fixed opex', pf.monthlyFixedOpex ? fmtINR(parseFloat(pf.monthlyFixedOpex)) : '—'],
    ['Preliminary monthly EBITDA', fmtINR(calc.ebitda) + ` (${calc.ebitdaPct.toFixed(1)}%)`],
    ['Preliminary payback', calc.paybackDays ? calc.paybackDays+' days' : '—'],
  ];
  slide.addTable(finRows.map(r=>[{text:r[0],options:{bold:true,color:INK}},{text:r[1],options:{color:INK}}]),
    { x:0.5, y:1.2, w:9, colW:[4.5,4.5], fontSize:14, border:{type:'solid',color:'E8DCC8',pt:1}, autoPage:false });
  if(statusEl) statusEl.textContent = 'Building deck — added financials…';

  // GeoIQ — spread across a few focused slides rather than one crowded one
  const g = site.geoiqReport;
  if(g && g.status === 'done' && g.parsedData){
    const d = g.parsedData;
    const bf = g.benchmarkFit;

    // Slide: Overview + Paradise benchmark fit (the single most decision-relevant slide)
    slide = pptx.addSlide();
    slide.background = { color: 'FFFFFF' };
    slide.addText('GeoIQ Site Report — Overview', { x:0.5, y:0.4, w:9, h:0.6, fontSize:24, bold:true, color:MAROON });
    if(d.summary) slide.addText(d.summary, { x:0.5, y:1.0, w:9, h:0.7, fontSize:13, italic:true, color:'4B5A61' });
    let ovY = 1.75;
    const ov = d.overview || {};
    if(ov.score !== null && ov.score !== undefined){
      slide.addText(`GeoIQ site score: ${ov.score} / 5`, { x:0.5, y:ovY, w:9, h:0.4, fontSize:15, bold:true, color:INK });
      ovY += 0.5;
    }
    if(bf && (bf.dinein.scored + bf.delivery.scored) > 0){
      const bfRows = [
        ['Dine-in fit', `${bf.dinein.pass}/${bf.dinein.scored} of 10 features` + (bf.dinein.pct!==null?` (${bf.dinein.pct}% weighted)`:'')],
        ['Delivery fit', `${bf.delivery.pass}/${bf.delivery.scored} of 8 features` + (bf.delivery.pct!==null?` (${bf.delivery.pct}% weighted)`:'')],
      ];
      slide.addTable(bfRows.map(r=>[{text:r[0],options:{bold:true,color:INK}},{text:r[1],options:{color:INK}}]),
        { x:0.5, y:ovY, w:9, colW:[3,6], fontSize:13, border:{type:'solid',color:'E8DCC8',pt:1}, autoPage:false });
      ovY += bfRows.length * 0.4 + 0.3;
    }
    if(Array.isArray(d.key_highlights) && d.key_highlights.length){
      slide.addText(d.key_highlights.map(h=>({text:h, options:{bullet:true, breakLine:true}})),
        { x:0.5, y:ovY, w:9, h:5.4-ovY, fontSize:12, color:INK });
    }
    if(statusEl) statusEl.textContent = 'Building deck — added GeoIQ overview…';

    // Slide: Population, retail indicators, footfall
    const popRetailRows = [];
    const p = d.population || {};
    if(p.hh_total) popRetailRows.push(['Total households', fmtNum(p.hh_total)]);
    if(p.hh_10l) popRetailRows.push(['Households ₹10L+ income', fmtNum(p.hh_10l) + (p.hh_10l_pct?` (${Math.round(p.hh_10l_pct)}%)`:'')]);
    if(p.hh_20l) popRetailRows.push(['Households ₹20L+ income', fmtNum(p.hh_20l) + (p.hh_20l_pct?` (${Math.round(p.hh_20l_pct)}%)`:'')]);
    if(p.affluence !== null && p.affluence !== undefined) popRetailRows.push(['Affluence index', p.affluence.toFixed(2) + (p.affluence_city?` (city ${p.affluence_city.toFixed(2)})`:'')]);
    if(p.res_rent_sqft) popRetailRows.push(['Residential rent /sq.ft', '₹'+fmtNum(p.res_rent_sqft) + (p.res_rent_sqft_city?` (city ₹${fmtNum(p.res_rent_sqft_city)})`:'')]);
    const r = d.retail || {};
    if(r.footfall !== null && r.footfall !== undefined) popRetailRows.push(['Footfall index /100', r.footfall.toFixed(0) + (r.footfall_city?` (city ${r.footfall_city.toFixed(0)})`:'')]);
    if(r.growth !== null && r.growth !== undefined) popRetailRows.push(['Growth index /100', r.growth.toFixed(0) + (r.growth_city?` (city ${r.growth_city.toFixed(0)})`:'')]);
    if(r.spending !== null && r.spending !== undefined) popRetailRows.push(['Spending capacity /100', r.spending.toFixed(0) + (r.spending_city?` (city ${r.spending_city.toFixed(0)})`:'')]);
    if(r.stores !== null && r.stores !== undefined) popRetailRows.push(['Stores nearby', fmtNum(r.stores) + (r.stores_city?` (city avg ${fmtNum(r.stores_city)})`:'')]);
    if(d.footfall_hourly && Array.isArray(d.footfall_hourly) && d.footfall_hourly.length===24){
      const peak = d.footfall_hourly.indexOf(Math.max(...d.footfall_hourly));
      const peakLabel = peak===0?'12 AM':peak<12?`${peak} AM`:peak===12?'12 PM':`${peak-12} PM`;
      popRetailRows.push(['Peak footfall hour', peakLabel + (d.footfall_month?` (${d.footfall_month})`:'')]);
    }
    if(popRetailRows.length){
      slide = pptx.addSlide();
      slide.background = { color: 'FFFFFF' };
      slide.addText('Population & Retail Indicators', { x:0.5, y:0.4, w:9, h:0.6, fontSize:24, bold:true, color:MAROON });
      slide.addTable(popRetailRows.map(r=>[{text:r[0],options:{bold:true,color:INK}},{text:r[1],options:{color:INK}}]),
        { x:0.5, y:1.15, w:9, colW:[4.5,4.5], fontSize:12.5, border:{type:'solid',color:'E8DCC8',pt:1}, autoPage:false });
      if(statusEl) statusEl.textContent = 'Building deck — added population & retail slide…';
    }

    // Slide: Competition & risk
    const comp = d.competitors || [], compl = d.complementary || [];
    const can = d.cannibalisation || {};
    const compRiskRows = [];
    if(comp.length){ const names = [...new Set(comp.map(c=>c.name))]; compRiskRows.push(['Competitor outlets', `${comp.length} outlets, ${names.length} brands`]); }
    if(compl.length) compRiskRows.push(['Complementary outlets nearby', String(compl.length)]);
    if(can.pct !== null && can.pct !== undefined) compRiskRows.push(['Cannibalisation', can.pct.toFixed(1)+'%']);
    else if(can.rating) compRiskRows.push(['Cannibalisation', can.rating + (can.active_stores===0?' (unverified — no Paradise stores loaded in GeoIQ)':'')]);
    if(Array.isArray(d.closures) && d.closures.length){
      const total = d.closures.reduce((s,c)=>s+(parseFloat(c.count)||0),0);
      const fnb = d.closures.filter(c=>/^(?!.*internet).*(restaurant|cafe|bakery|dessert|food|qsr|sweet)/i.test(c.category||'')).reduce((s,c)=>s+(parseFloat(c.count)||0),0);
      compRiskRows.push(['Closures, last 12mo', `${fnb} F&B of ${total} total nearby`]);
    }
    if(compRiskRows.length){
      slide = pptx.addSlide();
      slide.background = { color: 'FFFFFF' };
      slide.addText('Competition & Risk', { x:0.5, y:0.4, w:9, h:0.6, fontSize:24, bold:true, color:MAROON });
      slide.addTable(compRiskRows.map(r=>[{text:r[0],options:{bold:true,color:INK}},{text:r[1],options:{color:INK}}]),
        { x:0.5, y:1.15, w:9, colW:[4.5,4.5], fontSize:13, border:{type:'solid',color:'E8DCC8',pt:1}, autoPage:false });
      const compNames = [...new Set(comp.map(c=>c.name))];
      if(compNames.length) slide.addText('Named competitors: ' + compNames.slice(0,12).join(', ') + (compNames.length>12?', …':''),
        { x:0.5, y:1.15 + compRiskRows.length*0.4 + 0.3, w:9, h:1.5, fontSize:11, color:'4B5A61' });
      if(statusEl) statusEl.textContent = 'Building deck — added competition & risk slide…';
    }
  }

  // Photos — each embedded as its own slide, fetched and re-encoded as a data URL
  const attachments = site.attachments || [];
  const photos = attachments.filter(a => isImageFile(a.name));
  for(let i=0;i<photos.length;i++){
    if(statusEl) statusEl.textContent = `Building deck — embedding photo ${i+1} of ${photos.length}…`;
    try{
      const dataUrl = await urlToDataUrl(photos[i].url);
      slide = pptx.addSlide();
      slide.background = { color: '000000' };
      slide.addImage({ data: dataUrl, x:0.5, y:0.4, w:9, h:4.4, sizing:{type:'contain', w:9, h:4.4} });
      slide.addText(photos[i].name, { x:0.5, y:4.9, w:9, h:0.4, fontSize:11, color:'FFFFFF' });
    }catch(e){
      console.error('Could not embed photo', photos[i].name, e);
    }
  }

  // Linked files — videos, the GeoIQ PDF, and any other non-image attachment, as
  // clickable links rather than embedded, per the note above.
  const linkable = [];
  if(g && g.fileUrl) linkable.push({ label: 'GeoIQ Report — ' + (g.fileName||'PDF'), url: g.fileUrl });
  attachments.filter(a => !isImageFile(a.name)).forEach(a => linkable.push({ label: a.name, url: a.url }));
  if(linkable.length){
    slide = pptx.addSlide();
    slide.background = { color: 'FFFFFF' };
    slide.addText('Videos & Linked Files', { x:0.5, y:0.4, w:9, h:0.6, fontSize:24, bold:true, color:MAROON });
    slide.addText('Tap a link below to open the original file.', { x:0.5, y:1.0, w:9, h:0.4, fontSize:12, color:'8A7268' });
    slide.addText(linkable.map(l=>({text:l.label, options:{bullet:true, breakLine:true, hyperlink:{url:l.url}, color:'1F5F66'}})),
      { x:0.5, y:1.5, w:9, h:3.5, fontSize:13 });
  }

  if(statusEl) statusEl.textContent = 'Saving…';
  const fname = `${(site.locationName+'_'+site.label).replace(/[^\w@ -]+/g,'').replace(/\s+/g,'_')}_Site_Report.pptx`;
  await pptx.writeFile({ fileName: fname });
  if(statusEl) statusEl.textContent = `Done — ${fname} downloaded.`;
}

function renderPrelimFinancialsSection(site, canEdit){
  const pf = site.prelimFinancials || { capex:'', monthlyRevenue:'', cogsPct:'', monthlyFixedOpex:'' };
  const calc = computePrelimFinancials(pf);
  let html = `<details class="collapse-group" open><summary>Preliminary Financials <span style="font-weight:400;color:var(--sub);font-size:11px;">quick estimate</span></summary>
    <div class="progress-line" style="margin-top:0;">A rough, flat-month estimate for scouting-stage comparison — not the full P&L model used once this becomes an NSO project.</div>
    <div class="field"><label>Estimated CAPEX (₹)</label><input id="pfCapex" type="number" value="${escapeHtml(pf.capex||'')}" ${canEdit?'':'disabled'} placeholder="e.g. 6000000"></div>
    <div class="field"><label>Estimated monthly revenue (₹)</label><input id="pfRevenue" type="number" value="${escapeHtml(pf.monthlyRevenue||'')}" ${canEdit?'':'disabled'} placeholder="e.g. 3500000"></div>
    <div class="field"><label>Estimated COGS (%)</label><input id="pfCogs" type="number" value="${escapeHtml(pf.cogsPct||'')}" ${canEdit?'':'disabled'} placeholder="e.g. 32"></div>
    <div class="field"><label>Estimated monthly fixed opex (₹)</label><input id="pfOpex" type="number" value="${escapeHtml(pf.monthlyFixedOpex||'')}" ${canEdit?'':'disabled'} placeholder="e.g. 450000"></div>
    ${canEdit ? `<div class="btn-row"><button class="btn ghost" id="savePrelimFinBtn">Save &amp; recalculate</button></div>` : ''}
    <div class="progress-line" style="font-size:13px;font-weight:700;color:var(--ink);margin-top:10px;">
      Preliminary EBITDA: ${fmtINR(calc.ebitda)}/month (${calc.ebitdaPct.toFixed(1)}%) · Payback: ${calc.paybackDays ? calc.paybackDays+' days' : '—'}
    </div>
  </details>`;
  return html;
}


function openScoutingSiteSheet(siteId){
  const site = board.scoutingSiteData[siteId];
  if(!site) return;
  const body = document.getElementById('sheetBody');
  const meta = SCOUTING_STATUS_META[site.status] || SCOUTING_STATUS_META.scouting;
  const myStakeholder = findMyStakeholder();
  const myId = myStakeholder ? myStakeholder.id : null;
  const iAmAssigned = myId && (site.assignedTo||[]).includes(myId);
  const iAmApprover = myId && (board.scoutingApprovers||[]).includes(myId);
  const canEdit = isAdmin() || iAmAssigned;

  let inner = `
    <button id="stickyCloseBtn" class="sticky-close-x" aria-label="Close">✕</button>
    <span class="stage-badge task sheet-badge">${escapeHtml(site.locationName)}</span>
    <h2>${escapeHtml(site.label)}</h2>
    <div class="meta">Created by ${escapeHtml(site.createdByName||'—')} · ${timeAgo(site.createdAt)}</div>
    <div class="stage-pill" style="background:${meta.bg};color:${meta.ink};display:inline-block;margin-bottom:12px;">${escapeHtml(meta.label)}</div>
  `;

  if(site.status === 'rejected' && site.rejectionRemarks){
    inner += `<div class="warn">⚠ Rejected by ${escapeHtml(site.rejectedByName||'someone')}: "${escapeAndLinkify(site.rejectionRemarks)}"</div>`;
  }
  if(site.status === 'approved'){
    inner += `<div class="info-box">✓ Approved by ${escapeHtml(site.approvedByName||'someone')} · ${fmtDate(site.approvedAt)} — ready to start as an NSO project.</div>`;
    inner += renderGeoiqReportSection(site, canEdit);
    inner += renderPrelimFinancialsSection(site, canEdit);
  }

  const assignedIds = site.assignedTo || [];
  const assignedList = assignedIds.map(id=>board.stakeholders.find(p=>p.id===id)).filter(Boolean);
  inner += `<details class="collapse-group" open><summary>Assigned to <span style="font-weight:400;color:var(--sub);font-size:11px;">${assignedList.length?assignedList.length+' people':'nobody yet'}</span></summary><div class="field">`;
  inner += assignedList.length ? `<div class="approver-list">` + assignedList.map(p=>`
      <div class="approver"><div class="approver-name">${escapeHtml(stakeholderLabel(p))}</div>
      ${(isAdmin()||iAmAssigned) ? `<button class="remove-x" data-scout-remove-assignee="${p.id}">✕</button>` : ''}</div>`).join('') + `</div>`
    : `<div class="progress-line">Nobody assigned yet.</div>`;
  if(isAdmin() || iAmAssigned){
    inner += personPickerHtml('scoutAssignAdd', board.stakeholders.filter(p=>!assignedIds.includes(p.id)), '+ search and add someone');
  }
  inner += `</div></details>`;

  const fields = board.scoutingFields || [];
  inner += `<details class="collapse-group" open><summary>Scouting Details</summary>`;
  fields.forEach(f=>{
    const val = (site.values||{})[f.id] || '';
    inner += `<div class="field"><label>${escapeHtml(f.label)}</label>`;
    inner += f.type === 'textarea'
      ? `<textarea data-scout-field="${f.id}" ${canEdit?'':'disabled'}>${escapeHtml(val)}</textarea>`
      : `<input data-scout-field="${f.id}" type="text" value="${escapeHtml(val)}" ${canEdit?'':'disabled'}>`;
    inner += `</div>`;
  });
  if(canEdit) inner += `<div class="btn-row"><button class="btn ghost" id="saveScoutFieldsBtn">Save details</button></div>`;
  inner += `</details>`;

  site.attachments = site.attachments || [];
  inner += `<details class="collapse-group"><summary>Photos & Documents <span style="font-weight:400;color:var(--sub);font-size:11px;">${site.attachments.length?site.attachments.length+' files':'none yet'}</span></summary>`;
  if(site.attachments.length){
    inner += `<div class="approver-list">` + site.attachments.map((a,i)=>{
      const canDelete = a.uploadedBy===getWho() || isAdmin();
      const thumb = isImageFile(a.name)
        ? `<img src="${a.url}" class="attach-thumb" data-scout-preview="${i}" alt="">`
        : `<div class="attach-file-icon" data-scout-preview="${i}">📄</div>`;
      return `<div class="approver attachment-row">${thumb}
        <div class="approver-name" data-scout-preview="${i}" style="cursor:pointer;">${escapeHtml(a.name)}
        <div class="approver-stamp">${escapeHtml(a.uploadedBy)} · ${timeAgo(a.uploadedAt)}</div></div>
        ${canDelete?`<button class="remove-x" data-scout-del-attachment="${i}">✕</button>`:''}</div>`;
    }).join('') + `</div>`;
  } else { inner += `<div class="progress-line">No files yet.</div>`; }
  if(canEdit){
    inner += `<div class="field"><input id="scoutAttachmentFile" type="file" multiple accept="image/*,video/*,.pdf,.doc,.docx"></div>
      <div class="progress-line" style="margin-top:0;">Photos, videos, and documents all go here — the PPT report picks up photos and videos automatically.</div>
      <div class="btn-row"><button class="btn ghost" id="uploadScoutAttachmentBtn">Upload</button></div>
      <div id="scoutUploadStatus" class="progress-line"></div>`;
  }
  inner += `</details>`;

  inner += `<details class="collapse-group" open><summary>Activity Log <span style="font-weight:400;color:var(--sub);font-size:11px;">${(site.log||[]).length}</span></summary>`;
  inner += `<div class="log">` + (site.log||[]).slice().reverse().map(l=>`
    <div class="log-entry"><div>${escapeHtml(l.text)}</div><div class="approver-stamp">${timeAgo(l.at)}</div></div>`).join('') + `</div>`;
  if(canEdit){
    inner += `<div class="field" style="margin-top:8px;"><textarea id="scoutNoteField" placeholder="Add a note..."></textarea></div>
      <div class="btn-row"><button class="btn ghost" id="addScoutNoteBtn">Add note</button></div>`;
  }
  inner += `</details>`;

  if(site.status === 'scouting' && iAmAssigned){
    inner += `<div class="btn-row"><button class="btn primary" id="submitScoutForApprovalBtn">Submit for approval</button></div>`;
  }
  if(site.status === 'rejected' && iAmAssigned){
    inner += `<div class="btn-row"><button class="btn primary" id="resubmitScoutBtn">Revise &amp; resubmit</button></div>`;
  }
  if(site.status === 'pending_approval' && iAmApprover){
    inner += `<div class="btn-row">
      <button class="btn decline" id="rejectScoutBtn">Reject</button>
      <button class="btn primary" id="approveScoutBtn">Approve — Ready for NSO</button>
    </div>`;
  }
  if(site.status === 'approved'){
    inner += `<div class="btn-row"><button class="btn primary" id="startNsoFromScoutBtn">Start NSO Project from this site</button></div>
      <div class="btn-row"><button class="btn ghost" id="generateSitePptBtn">Generate Site Report (PPT)</button></div>
      <div id="sitePptStatus" class="progress-line"></div>`;
  }
  inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;

  body.innerHTML = inner;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('stickyCloseBtn').onclick = closeSheet;
  wireScoutingSheetActions(site, canEdit, iAmAssigned, iAmApprover);
}

function wireScoutingSheetActions(site, canEdit, iAmAssigned, iAmApprover){
  const closeBtn = document.getElementById('closeBtn');
  if(closeBtn) closeBtn.onclick = closeSheet;

  const addSel = document.getElementById('scoutAssignAdd');
  if(addSel) addSel.onchange = async ()=>{
    const id = personPickerSelectedId('scoutAssignAdd', board.stakeholders.filter(p=>!(site.assignedTo||[]).includes(p.id)));
    if(!id) return;
    site.assignedTo = site.assignedTo || [];
    if(!site.assignedTo.includes(id)) site.assignedTo.push(id);
    const p = board.stakeholders.find(x=>x.id===id);
    const who = getWho();
    site.log = site.log || []; site.log.push({ text:`${p?p.name:'Someone'} assigned by ${who}`, by: who, at: Date.now() });
    site.updatedBy = who; site.updatedAt = Date.now();
    await saveBoard(); render(); openScoutingSiteSheet(site.id);
  };
  document.querySelectorAll('[data-scout-remove-assignee]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      site.assignedTo = (site.assignedTo||[]).filter(x=>x!==btn.dataset.scoutRemoveAssignee);
      site.updatedBy = getWho(); site.updatedAt = Date.now();
      await saveBoard(); render(); openScoutingSiteSheet(site.id);
    });
  });

  const saveFieldsBtn = document.getElementById('saveScoutFieldsBtn');
  if(saveFieldsBtn) saveFieldsBtn.onclick = withClickLoading(saveFieldsBtn, 'Working…', async ()=>{
    site.values = site.values || {};
    document.querySelectorAll('[data-scout-field]').forEach(elx=>{ site.values[elx.dataset.scoutField] = elx.value.trim(); });
    const who = getWho();
    site.log = site.log || []; site.log.push({ text:`Details updated by ${who}`, by: who, at: Date.now() });
    site.updatedBy = who; site.updatedAt = Date.now();
    await saveBoard(); render(); openScoutingSiteSheet(site.id);
  });

  const uploadBtn = document.getElementById('uploadScoutAttachmentBtn');
  if(uploadBtn) uploadBtn.onclick = withClickLoading(uploadBtn, 'Working…', async ()=>{
    const fileInput = document.getElementById('scoutAttachmentFile');
    const files = Array.from(fileInput.files);
    const statusEl = document.getElementById('scoutUploadStatus');
    if(!files.length){ statusEl.textContent = 'Choose at least one file first.'; return; }
    site.attachments = site.attachments || [];
    let uploaded = 0;
    for(const file of files){
      statusEl.textContent = `Uploading ${uploaded+1} of ${files.length}...`;
      try{
        const path = `scouting/${site.id}/${Date.now()}_${file.name}`;
        const ref = storage.ref(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        site.attachments.push({ name: file.name, url, path, uploadedBy: getWho(), uploadedAt: Date.now() });
        uploaded++;
      }catch(e){
        statusEl.textContent = `Upload failed on "${file.name}": ` + (e.message || e.code);
        if(uploaded > 0) await saveBoard();
        return;
      }
    }
    const who = getWho();
    site.log = site.log || []; site.log.push({ text:`${uploaded} file(s) uploaded by ${who}`, by: who, at: Date.now() });
    site.updatedBy = who; site.updatedAt = Date.now();
    await saveBoard(); render(); openScoutingSiteSheet(site.id);
  });
  document.querySelectorAll('[data-scout-preview]').forEach(elx=>{
    elx.onclick = ()=>{ const a = site.attachments[parseInt(elx.dataset.scoutPreview)]; if(a) openFilePreview(a.url, a.name); };
  });
  document.querySelectorAll('[data-scout-del-attachment]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      const i = parseInt(btn.dataset.scoutDelAttachment);
      const a = site.attachments[i];
      if(!a) return;
      if(!(a.uploadedBy === getWho() || isAdmin())) return;
      if(!window.confirm(`Delete "${a.name}"? This can't be undone.`)) return;
      try{ if(a.path) await storage.ref(a.path).delete(); }catch(e){ console.error('storage delete failed', e); }
      site.attachments.splice(i,1);
      await saveBoard(); render(); openScoutingSiteSheet(site.id);
    });
  });

  const addNoteBtn = document.getElementById('addScoutNoteBtn');
  if(addNoteBtn) addNoteBtn.onclick = withClickLoading(addNoteBtn, 'Working…', async ()=>{
    const field = document.getElementById('scoutNoteField');
    const text = field ? field.value.trim() : '';
    if(!text) return;
    const who = getWho();
    site.log = site.log || []; site.log.push({ text, by: who, byId: (findMyStakeholder()||{}).id || null, at: Date.now() });
    site.updatedBy = who; site.updatedAt = Date.now();
    await saveBoard(); render(); openScoutingSiteSheet(site.id);
  });

  const submitBtn = document.getElementById('submitScoutForApprovalBtn');
  if(submitBtn) submitBtn.onclick = withClickLoading(submitBtn, 'Working…', async ()=>{
    if(!(board.scoutingApprovers||[]).length){
      window.alert('No Scouting Approvers are configured yet — ask an Admin to add one in Admin → Scouting Approvers.');
      return;
    }
    const who = getWho();
    site.status = 'pending_approval';
    site.submittedBy = who; site.submittedAt = Date.now();
    site.log = site.log || []; site.log.push({ text:`Submitted for approval by ${who}`, by: who, at: Date.now() });
    site.updatedBy = who; site.updatedAt = Date.now();
    await saveBoard(); render(); closeSheet();
  });
  const resubmitBtn = document.getElementById('resubmitScoutBtn');
  if(resubmitBtn) resubmitBtn.onclick = withClickLoading(resubmitBtn, 'Working…', async ()=>{
    const who = getWho();
    site.status = 'pending_approval';
    site.rejectionRemarks = '';
    site.log = site.log || []; site.log.push({ text:`Revised and resubmitted by ${who}`, by: who, at: Date.now() });
    site.updatedBy = who; site.updatedAt = Date.now();
    await saveBoard(); render(); closeSheet();
  });

  const approveBtn = document.getElementById('approveScoutBtn');
  if(approveBtn) approveBtn.onclick = withClickLoading(approveBtn, 'Working…', async ()=>{
    if(!window.confirm(`Approve "${site.label}" as Ready for NSO?`)) return;
    try{
      const res = await approveScoutingSiteFn({ siteId: site.id, approve: true });
      if(res && res.data){ site.status = res.data.status; site.log = res.data.log; }
      render(); closeSheet();
    }catch(e){ window.alert(e.message || 'Could not approve — try again.'); }
  });
  const rejectBtn = document.getElementById('rejectScoutBtn');
  if(rejectBtn) rejectBtn.onclick = withClickLoading(rejectBtn, 'Working…', async ()=>{
    const remarks = window.prompt(`Reason for rejecting "${site.label}"?`) || '';
    try{
      const res = await approveScoutingSiteFn({ siteId: site.id, approve: false, remarks });
      if(res && res.data){ site.status = res.data.status; site.log = res.data.log; }
      render(); closeSheet();
    }catch(e){ window.alert(e.message || 'Could not reject — try again.'); }
  });

  const startNsoBtn = document.getElementById('startNsoFromScoutBtn');
  if(startNsoBtn) startNsoBtn.onclick = ()=>{
    closeSheet();
    currentView = 'templates'; render();
    // Pre-fills the NSO template's "new project" form from this scouting record — a
    // convenience jump, not an automatic project creation, so BD still reviews and
    // confirms details before anything is actually created in the tracker.
    setTimeout(()=>{
      const tmpl = board.templates.find(t=>t.id==='tmpl_nso');
      if(!tmpl) return;
      const nameInput = document.getElementById(`newProjName_${tmpl.id}`);
      const citySelect = document.getElementById(`newProjCity_${tmpl.id}`);
      if(nameInput) nameInput.value = `${site.locationName} — ${site.label}`;
      if(citySelect) citySelect.value = site.city;
      if(nameInput) nameInput.scrollIntoView({block:'center'});
    }, 50);
  };

  const uploadGeoiqBtn = document.getElementById('uploadGeoiqBtn') || document.getElementById('retryGeoiqBtn');
  if(uploadGeoiqBtn) uploadGeoiqBtn.onclick = withClickLoading(uploadGeoiqBtn, 'Working…', async ()=>{
    const statusEl = document.getElementById('geoiqUploadStatus');
    const isRetry = uploadGeoiqBtn.id === 'retryGeoiqBtn';
    let filePath = site.geoiqReport && site.geoiqReport.filePath;
    if(!isRetry){
      const fileInput = document.getElementById('geoiqFile');
      const file = fileInput && fileInput.files[0];
      if(!file){ if(statusEl) statusEl.textContent = 'Choose a PDF first.'; return; }
      if(statusEl) statusEl.textContent = 'Uploading…';
      try{
        const path = `scouting/${site.id}/geoiq_${Date.now()}_${file.name}`;
        const ref = storage.ref(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        filePath = path;
        site.geoiqReport = { fileUrl: url, filePath: path, fileName: file.name, uploadedBy: getWho(), uploadedAt: Date.now(), status: 'analyzing', parsedData: null, error: null };
      }catch(e){
        if(statusEl) statusEl.textContent = 'Upload failed: ' + (e.message || e.code);
        return;
      }
    } else {
      site.geoiqReport.status = 'analyzing';
      site.geoiqReport.error = null;
    }
    await saveBoard(); render(); openScoutingSiteSheet(site.id);
    try{
      const res = await analyzeGeoiqReportFn({ siteId: site.id, filePath });
      if(res && res.data){

  });

  if(savePrelimFinBtn) savePrelimFinBtn.onclick = withClickLoading(savePrelimFinBtn, 'Working…', async ()=>{

    };
    await saveBoard(); render(); openScoutingSiteSheet(site.id);
  });

  const generatePptBtn = document.getElementById('generateSitePptBtn');
  if(generatePptBtn) generatePptBtn.onclick = withClickLoading(generatePptBtn, 'Building…', async ()=>{

}

function renderFilesView(){
  const el = document.getElementById('filesView');
  let html = `<div class="admin-section"><h3>Files</h3><div class="sub">Every file uploaded, organized by site and stage, newest first.</div></div>`;

  const sites = visibleSites();
  if(sites.length === 0){
    html += `<div class="empty-note">No sites yet.</div>`;
  }

  sites.forEach(site=>{
    const s = board.siteData[site.id];
    if(!s) return;
    const stagesWithFiles = STAGES.filter(st => s.stageData[st.id] && (s.stageData[st.id].attachments||[]).length);
    const totalFiles = stagesWithFiles.reduce((sum,st)=>sum + s.stageData[st.id].attachments.length, 0);
    if(totalFiles === 0) return;

    html += `<details class="collapse-group">
      <summary>${escapeHtml(site.name)} (${totalFiles})</summary>`;
    stagesWithFiles.forEach(st=>{
      const files = s.stageData[st.id].attachments.slice().sort((a,b)=>b.uploadedAt - a.uploadedAt);
      html += `<details class="collapse-group" style="margin-top:8px;">
        <summary style="background:var(--cream);color:var(--ink);">${st.num} · ${escapeHtml(st.title)} (${files.length})</summary>`;
      files.forEach(a=>{
        const canDelete = a.uploadedBy === getWho() || isAdmin();
        const thumb = isImageFile(a.name)
          ? `<img src="${a.url}" class="attach-thumb" data-file-preview data-url="${a.url}" data-name="${escapeHtml(a.name)}" alt="">`
          : `<div class="attach-file-icon" data-file-preview data-url="${a.url}" data-name="${escapeHtml(a.name)}">📄</div>`;
        html += `<div class="approver attachment-row" style="margin:0 14px 8px;">
          ${thumb}
          <div class="approver-name" data-file-preview data-url="${a.url}" data-name="${escapeHtml(a.name)}" style="cursor:pointer;">${escapeHtml(a.name)}
            <div class="approver-stamp">${escapeHtml(a.uploadedBy)} · ${timeAgo(a.uploadedAt)}</div></div>
          ${canDelete ? `<button class="remove-x" data-files-del="${site.id}|${st.id}|${a.path||''}|${a.uploadedAt}">✕</button>` : ''}
        </div>`;
      });
      html += `</details>`;
    });
    html += `</details>`;
  });

  el.innerHTML = html;

  el.querySelectorAll('[data-file-preview]').forEach(node=>{
    node.onclick = ()=> openFilePreview(node.dataset.url, node.dataset.name);
  });
  el.querySelectorAll('[data-files-del]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      const [siteId, stageIdStr, path, uploadedAtStr] = btn.dataset.filesDel.split('|');
      const stageId = parseInt(stageIdStr);
      const uploadedAt = parseFloat(uploadedAtStr);
      const d = board.siteData[siteId].stageData[stageId];
      const idx = d.attachments.findIndex(a => a.uploadedAt === uploadedAt && (a.path||'') === path);
      if(idx === -1) return;
      const att = d.attachments[idx];
      if(!(att.uploadedBy === getWho() || isAdmin())) return;
      if(!window.confirm(`Delete "${att.name}"? This can't be undone.`)) return;
      try{ if(att.path) await storage.ref(att.path).delete(); }catch(e){ console.error('storage delete failed', e); }
      d.attachments.splice(idx, 1);
      await saveBoard(); render();
    });
  });
}

  });
}

// Visibility rule: Admin sees everything. Drafts are creator-only. Live/closed projects
// are visible to their creator plus anyone assigned to any stage or Post-LOI task in them.
function canSeeSite(site){
  if(isAdmin()) return true;
  if(!currentUser) return false;
  if(site.status === 'draft') return site.ownerId === currentUser.email;
  if(site.ownerId === currentUser.email) return true;
  const me = findMyStakeholder();
  if(!me) return false;
  // A configured approver (stage-level or Drop Request) needs visibility too — this was
  // missing entirely before, since the approver system was built well after this
  // function: someone who's ONLY an approver and never directly assigned to a task
  // would see nothing at all, unable to do the one thing they were added for.
  if((board.dropApprovers||[]).includes(me.id)) return true;
  if(board.stageApprovers){
    for(const stageId in board.stageApprovers){
      if((board.stageApprovers[stageId]||[]).includes(me.id)) return true;
    }
  }
  const s = board.siteData[site.id];
  if(!s) return false;
  return STAGES.some(st=>{
    const d = s.stageData[st.id];
    if(!d) return false;
    if((d.assignedTo||[]).includes(me.id)) return true;
    if(st.id===11 && d.tasks){
      return Object.values(d.tasks).some(t=>(t.assignedTo||[]).includes(me.id));
    }
    return false;
  });
}
function visibleSites(){ return board.sites.filter(site => !site.deletedAt && canSeeSite(site)); }

// ---------- Scouting visibility ----------
// A site is visible to: Admin, whoever created it, anyone assigned to it, and — once
// it's actually been submitted — anyone on the Scouting Approvers list (an approver
// shouldn't see a BD's early-stage draft before it's ready for them, but does need to
// see anything they've been asked to act on, and keep seeing it after they've acted).
function canSeeScoutingSite(site){
  if(isAdmin()) return true;
  if(!currentUser) return false;
  const me = findMyStakeholder();
  const myId = me ? me.id : null;
  if(site.createdBy === myId) return true;
  if(myId && (site.assignedTo||[]).includes(myId)) return true;
  if(myId && site.status !== 'scouting' && (board.scoutingApprovers||[]).includes(myId)) return true;
  return false;
}
function canSeeScoutingLocation(loc){
  if(isAdmin()) return true;
  const me = findMyStakeholder();
  if(me && loc.createdBy === me.id) return true;
  return Object.values(board.scoutingSiteData||{}).some(s=>s.locationId===loc.id && canSeeScoutingSite(s));
}
function visibleScoutingLocations(){
  return (board.scoutingLocations||[]).filter(l=>!l.archivedAt && canSeeScoutingLocation(l));
}
function scoutingSitesForLocation(locId){
  return Object.values(board.scoutingSiteData||{}).filter(s=>s.locationId===locId && canSeeScoutingSite(s))
    .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}

      if(!window.confirm(`Remove "${st.title}" from the pipeline? Any project's existing data for this stage stays saved, it just won't show anymore.`)) return;
      const idx = STAGES.findIndex(x=>x.id===id);

  const addStageBtn = document.getElementById('addStageBtn');

    const type = document.getElementById('newStageType').value;
    const page = document.getElementById('newStagePage').value;
    const tatMinDays = parseInt(document.getElementById('newStageTatMin').value) || 0;
    const tatMaxDays = parseInt(document.getElementById('newStageTatMax').value) || 7;
    // Guaranteed unique, not just "highest current ID + 1" — that alone can collide if
    // two adds happen close together against a stale STAGES snapshot (exactly what
    // happened on one live board: two different stages ended up sharing an id, and
    // clicking either one opened whichever came first in the array). This explicitly
    // verifies the candidate is actually free before using it.
    let newId = STAGES.length ? Math.max(...STAGES.map(x=>x.id)) + 1 : 1;
    while(STAGES.some(x=>x.id === newId)) newId++;
    // Sensible starting defaults based on type — same mapping used when migrating
    // existing stages — admin can still flip either checkbox right after creating it.
    let requiresAssignment = true, requiresApproval = false;
    if(type === 'approval'){ requiresAssignment = false; requiresApproval = true; }
    else if(type === 'commercial-terms' || type === 'checklist'){ requiresAssignment = false; requiresApproval = false; }
    STAGES.push({ id: newId, num: '00', title, type, page, owner: '', duration: `${tatMinDays}-${tatMaxDays}d`, tatMinDays, tatMaxDays, desc: '', requiresAssignment, requiresApproval });

  // ---- SLA spreadsheet round-trip (export → edit in Excel → import) ----
  // One shared column list so export, sample, and import can never disagree about
  // what the file looks like.
  const SLA_COLUMNS = ['Stage Name','Type','Page','Owner','TAT Min','TAT Max','CK Days','1.0 Days','2.0 Days','Applies To Formats','Parallel Group','Bangalore Only','Requires Assignment','Requires Approval','Description'];
  const SLA_TYPES = ['task','approval','gate','checklist','commercial-terms'];
  const SLA_FORMAT_KEYS = { 'CK':'CK', 'F10':'F10', 'F20':'F20', '1.0':'F10', '2.0':'F20', '1.0 FORMAT':'F10', '2.0 FORMAT':'F20', 'CK & KIOSKS':'CK', 'KIOSK':'CK' };
  const stageToSlaRow = (st)=>[
    st.title || '',
    st.type || 'task',

    st.tatMaxDays !== undefined ? st.tatMaxDays : '',
    (st.tatByFormat && st.tatByFormat.CK) ? st.tatByFormat.CK.max : '',
    (st.tatByFormat && st.tatByFormat.F10) ? st.tatByFormat.F10.max : '',
    (st.tatByFormat && st.tatByFormat.F20) ? st.tatByFormat.F20.max : '',
    st.formats ? st.formats.join(', ') : '',
    st.parallelGroup || '',
    st.bangaloreOnly ? 'yes' : 'no',

    st.desc || '',
  ];

  if(exportSlaBtn) exportSlaBtn.onclick = ()=>{
    downloadSampleCsv(SLA_COLUMNS, STAGES.map(stageToSlaRow), 'nso-sla-current.csv');

  if(downloadSampleSla) downloadSampleSla.onclick = ()=>{

      ['Site Visit + Sign-Off','approval','project-flow','Cross-functional panel','0','10','','','','','','no','no','yes','All panel members sign off — no partial approvals.'],
      ['Electrical Load Confirmation','gate','project-flow','Landlord + Ayush','0','14','','','','','g1','yes','yes','no','Landlord confirms load in writing before LOI.'],
      ['Crew Hiring Drive Starts','task','execution','HR','19','19','10','19','26','','postloi','no','yes','no','Days counted from Design Start.'],
      ['Kitchen Equipment','task','execution','Sourcing','31','31','','31','46','F10, F20','postloi','no','yes','no','Not applicable to CK & Kiosks.'],

  if(slaBulkBtn) slaBulkBtn.onclick = withClickLoading(slaBulkBtn, 'Importing…', async ()=>{
    const file = document.getElementById('slaBulkFile').files[0];
    const statusEl = document.getElementById('slaBulkStatus');
    if(!file){ statusEl.textContent = 'Choose a file first.'; return; }
    try{
      const data = await file.arrayBuffer();
      const wb = XLSX.read(data, {type:'array'});
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:''});
      if(!rows.length){ statusEl.textContent = 'That file has no rows.'; return; }

      // Match on name so a re-upload keeps each stage's existing ID — that's what stops
      // every project's recorded progress from being orphaned on a routine SLA edit.
      const byTitle = {};
      STAGES.forEach(st=>{ byTitle[(st.title||'').trim().toLowerCase()] = st; });
      let nextId = STAGES.length ? Math.max(...STAGES.map(x=>x.id)) + 1 : 1;
      const usedIds = new Set();
      const allocId = ()=>{ while(usedIds.has(nextId) || STAGES.some(x=>x.id===nextId)) nextId++; usedIds.add(nextId); return nextId++; };

      const num = v => { const n = parseInt(String(v).trim()); return isNaN(n) ? null : n; };
      const yes = v => /^(y|true|1)/i.test(String(v).trim());
      const has = v => String(v == null ? '' : v).trim() !== '';

      const newStages = [];
      const problems = [];
      let kept = 0, added = 0;

      rows.forEach((row, idx)=>{
        const title = String(row['Stage Name']||'').trim();
        if(!title) return; // silently skip blank spacer rows
        const rowNo = idx + 2; // +1 for header, +1 for 1-based

        let type = String(row['Type']||'task').trim().toLowerCase();
        if(!SLA_TYPES.includes(type)){ problems.push(`Row ${rowNo} ("${title}"): unknown Type "${type}" — treated as task.`); type = 'task'; }

        let page = String(row['Page']||'project-flow').trim().toLowerCase();
        if(page !== 'execution') page = 'project-flow';

        const existing = byTitle[title.toLowerCase()];
        if(existing) kept++; else added++;

        const tatMinDays = num(row['TAT Min']) !== null ? num(row['TAT Min']) : 0;
        const tatMaxDays = num(row['TAT Max']) !== null ? num(row['TAT Max']) : 0;

        // Per-format days — each becomes that stage's own {min,max} for that format.
        const fmtDays = { CK: num(row['CK Days']), F10: num(row['1.0 Days']), F20: num(row['2.0 Days']) };
        let tatByFormat = null;
        Object.keys(fmtDays).forEach(k=>{
          if(fmtDays[k] !== null){ tatByFormat = tatByFormat || {}; tatByFormat[k] = { min: fmtDays[k], max: fmtDays[k] }; }
        });

        let formats = null;
        if(has(row['Applies To Formats'])){
          const parsed = String(row['Applies To Formats']).split(',').map(x=>{
            const key = x.trim().toUpperCase();
            return SLA_FORMAT_KEYS[key] || null;
          }).filter(Boolean);
          const uniq = [...new Set(parsed)];
          if(uniq.length && uniq.length < 3) formats = uniq;
          else if(!uniq.length) problems.push(`Row ${rowNo} ("${title}"): couldn't read "Applies To Formats" — treated as all formats.`);
        }

        // Blank flag columns fall back to the same type-based defaults used everywhere
        // else, so a lightly-filled spreadsheet still produces sane stages.
        let requiresAssignment = has(row['Requires Assignment']) ? yes(row['Requires Assignment']) : (type === 'approval' ? false : true);
        let requiresApproval  = has(row['Requires Approval'])  ? yes(row['Requires Approval'])  : (type === 'approval');
        if(type === 'commercial-terms' || type === 'checklist'){ requiresAssignment = false; requiresApproval = false; }

        const st = {
          id: existing ? existing.id : allocId(),
          num: '00',
          title,
          type,
          page,
          owner: String(row['Owner']||'').trim(),
          tatMinDays, tatMaxDays,
          desc: String(row['Description']||'').trim(),
          requiresAssignment, requiresApproval,
        };
        if(tatByFormat) st.tatByFormat = tatByFormat;
        if(formats) st.formats = formats;
        if(has(row['Parallel Group'])) st.parallelGroup = String(row['Parallel Group']).trim();
        if(yes(row['Bangalore Only'])) st.bangaloreOnly = true;
        // Carry over anything the spreadsheet doesn't model — a stage's warning text and
        // its rework target only exist in code, and losing them on a routine SLA edit
        // would quietly drop a hard gate's warning or break its send-back behaviour.
        if(existing){
          if(existing.warning) st.warning = existing.warning;
          if(existing.reworkTo !== undefined) st.reworkTo = existing.reworkTo;
          if(existing.duration) st.duration = existing.duration;
        }
        newStages.push(st);
      });

      if(!newStages.length){ statusEl.textContent = 'No usable rows found — every row needs a Stage Name.'; return; }

      const removed = STAGES.filter(st=>!newStages.some(n=>n.id===st.id));
      const summary = `Replace the pipeline with ${newStages.length} stage(s) from this file?\n\n`
        + `• ${kept} matched an existing stage and keep their ID (progress preserved)\n`
        + `• ${added} are new\n`
        + `• ${removed.length} currently in the pipeline aren't in the file and will stop showing`
        + (removed.length ? `:\n   ${removed.map(r=>r.title).join('\n   ')}` : '')
        + `\n\nTheir saved data is never erased — it just stops being displayed.`;
      if(!window.confirm(summary)) { statusEl.textContent = 'Import cancelled — nothing changed.'; return; }

      STAGES = newStages;
      board.nsoStages = newStages;
      STAGES.forEach((st,i)=>{ st.num = String(i+2).padStart(2,'0'); });
      try{
        await saveStagePipelineFn({ stages: STAGES });
      }catch(e){ statusEl.textContent = 'Could not save: ' + (e.message || e); return; }

      statusEl.textContent = `Imported ${newStages.length} stage(s) — ${kept} kept their ID, ${added} new, ${removed.length} no longer shown.`
        + (problems.length ? ` ${problems.length} note(s): ` + problems.join(' ') : '');
      render();

function renderTabs(){
  const el = document.getElementById('storeTabs');
  const sites = visibleSites();
  if(sites.length === 0){ el.innerHTML=''; return; }
  el.innerHTML = sites.map(site=>{
    const st = storeState(site.id);
    const pStatus = getProjectStatus(site, st);
    const pipColor = site.id===activeStore ? '#fff' : pStatus.ink;
    return `<button class="store-tab ${site.id===activeStore?'active':''}" data-s="${site.id}">
      <span class="pip" style="background:${pipColor}"></span>${escapeHtml(site.name.replace(' — ',' · '))}
    </button>`;
  }).join('');
  el.querySelectorAll('.store-tab').forEach(b=>{
    b.onclick = ()=>{ activeStore = b.dataset.s; render(); };
  });
}

// One place builds the tracker matrix, and both the on-screen grid and the Excel export
// read from it — so what you download is provably the same thing you were looking at,
// not a second calculation that can drift.
function buildTrackerMatrix(){
  const sites = board.sites
    .filter(s => !s.deletedAt && s.status !== 'draft' && canSeeSite(s));
  // Due dates are recomputed live from real progress, never read from a stale snapshot —
  // this is what keeps the grid self-maintaining instead of something anyone re-keys.
  sites.forEach(site => recalculateDueDates(site.id));

  const stages = STAGES.filter(st => dashboardPageFilter === 'all' || (st.page||'project-flow') === dashboardPageFilter);

  const rows = sites.map(site=>{
    const s = storeState(site.id);
    const status = s.projectClosed
      ? { label:'Closed', bg:'var(--done-bg)', ink:'var(--done)' }
      : getProjectStatus(site, s);

    let done = 0, applicable = 0;
    const cells = stages.map(st=>{
      const d = s.stageData[st.id];
      if(!d) return { state:'none', plan:null, actual:null };
      if(d.status === 'skip') return { state:'skip', plan:null, actual:null };
      applicable++;
      const plan = d.dueDate || null;
      const actual = (d.status === 'done') ? (d.updatedAt || null) : null;
      let state;
      if(d.status === 'done'){
        done++;
        // "Late" is judged against the plan date the tracker itself projected, so a
        // stage that finished after a slipped predecessor isn't unfairly marked late.
        // Stages ahead of P&L never get a projected date at all (the projection starts
        // there), so those are just "done" — calling them on-time would be claiming
        // they beat a deadline that never existed.
        state = plan ? ((actual && actual > plan) ? 'late' : 'ontime') : 'done';
      } else {
        const t = stageTiming(st, d, site.id);
        const overdue = (t && t.isOverdue) || (!t && plan && Date.now() > plan);
        state = overdue ? 'overdue' : ((d.status === 'active' || d.status === 'awaiting_approval') ? 'active' : 'pending');
      }
      return { state, plan, actual, status: d.status };
    });

    return { site, s, status, cells, pct: applicable ? Math.round(done/applicable*100) : 0 };
  });

  return { stages, rows };
}

function trackerDate(ts){
  if(!ts) return '';
  return new Date(ts).toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
}

// Real .xlsx, built from the same matrix the grid just rendered — merged milestone
// headers and a Plan/Actual pair under each, matching the sheet layout people already
// work in, so it drops straight into an existing review deck.
function downloadTrackerWorkbook(){
  const { stages, rows } = buildTrackerMatrix();
  const lead = ['Project','City','Format','Status','Done %'];
  const fmtCell = ts => ts ? new Date(ts).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}) : '';

  const r1 = [...lead.map(()=> '')];
  const r2 = [...lead];
  const r3 = [...lead.map(()=> '')];
  stages.forEach(st=>{
    r1.push(st.owner || '', '');
    r2.push(`${st.num} · ${st.title}`, '');
    r3.push('Plan','Actual');
  });
  // Row 1 carries the owner/department band, row 2 the milestone, row 3 Plan/Actual —
  // the lead columns are merged down all three so the left edge stays readable.
  const aoa = [r1, r2, r3];
  rows.forEach(r=>{
    const line = [
      r.site.name,
      (board.cities.find(c=>c.code===r.site.city)||{}).name || r.site.city,
      FORMATS[r.site.format] ? FORMATS[r.site.format].label : (r.site.format||''),
      r.status.label,
      r.pct + '%',
    ];
    r.cells.forEach(c=>{
      if(c.state === 'skip'){ line.push('n/a','n/a'); return; }
      line.push(fmtCell(c.plan), c.actual ? fmtCell(c.actual) : (c.state === 'overdue' ? 'OVERDUE' : ''));
    });
    aoa.push(line);
  });

  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const merges = [];
  lead.forEach((_,i)=> merges.push({ s:{r:0,c:i}, e:{r:2,c:i} }));
  stages.forEach((_,i)=>{
    const c = lead.length + i*2;
    merges.push({ s:{r:0,c}, e:{r:0,c:c+1} });
    merges.push({ s:{r:1,c}, e:{r:1,c:c+1} });
  });
  ws['!merges'] = merges;
  ws['!cols'] = [{wch:26},{wch:12},{wch:14},{wch:12},{wch:8}, ...stages.flatMap(()=>[{wch:12},{wch:12}])];
  ws['!freeze'] = { xSplit:5, ySplit:3 };

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'NSO Tracker');
  const stamp = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `NSO_Tracker_${stamp}.xlsx`);
}

        if(res && res.data){ site.status = res.data.status; s.dropRequest = res.data.dropRequest; }

    const anchorEl = document.getElementById('dropProjectRow') || document.getElementById('closeProjectRow') || el;
    anchorEl.insertAdjacentHTML('afterend', `<div id="deleteProjectRow" style="padding:0 14px 14px;">

function renderFlow(){
