      <div style="flex:1 1 100%;">
        <div class="admin-row-main">${escapeHtml(site.name)} ${draftTag}</div>
        <div class="admin-row-sub">${escapeHtml(FORMATS[site.format] ? FORMATS[site.format].label : '')} · ${escapeHtml((board.cities.find(c=>c.code===site.city)||{}).name || site.city)}</div>
      </div>
      <div class="stage-pill" style="background:${pillBg};color:${pillInk};margin-top:6px;">${escapeHtml(label)}</div>
    </div>`;
  });

  el.innerHTML = html;
  el.querySelectorAll('[data-open-project]').forEach(row=>{
    row.onclick = ()=>{
      activeStore = row.dataset.openProject;
      trackerSubView = 'detail';
      render();
    };
  });
}

function renderSummary(){
  if(!activeStore || !getSite(activeStore)){ document.getElementById('storeSummary').innerHTML=''; return; }
  const s = storeState(activeStore);
  const site = getSite(activeStore);
  const curStage = STAGES.find(x=>x.id===s.current);
  const doneFinal = s.stageData[11].status === 'done';
  const el = document.getElementById('storeSummary');
  let pillBg = 'var(--task-bg)', pillInk = 'var(--task-ink)', label = curStage ? `Stage ${curStage.num} — ${curStage.title}` : '';
  if(s.projectClosed){ pillBg='var(--done-bg)'; pillInk='var(--done)'; label='Project Closed'; }
  else if(doneFinal){ pillBg='var(--done-bg)'; pillInk='var(--done)'; label='Store opened'; }
  else if(curStage && curStage.type==='approval'){ pillBg='var(--appr-bg)'; pillInk='var(--appr-ink)'; }
  else if(curStage && curStage.type==='gate'){ pillBg='var(--gate-bg)'; pillInk='var(--gate-ink)'; }
  // Flexible mode: work on a later stage can complete while an earlier one is still open —
  // make that visible instead of hiding it behind a single "current stage" label.
  let doneAheadNote = '';
  if(!doneFinal && curStage){
    const doneAhead = STAGES.filter(st=>st.id > s.current && s.stageData[st.id] && s.stageData[st.id].status === 'done');
    if(doneAhead.length){
      label = `Blocked on ${curStage.num} — ${curStage.title}`;
      doneAheadNote = `${doneAhead.length} stage${doneAhead.length>1?'s':''} ahead already done (${doneAhead.map(x=>x.num).join(', ')})`;
    }
  }
  const opening = computeTargetOpening(s);
  const targetText = opening ? `${opening.label} ${fmtDate(opening.value)}` : 'target TBD — pending construction start';
  const commentCount = (s.comments || []).length;
  const showCloseBtn = isAdmin() && doneFinal && !s.projectClosed;
  const showDeleteBtn = isAdmin() || (site.ownerId && currentUser && site.ownerId === currentUser.email);
  el.innerHTML = `
    <div>
      <div class="name">${escapeHtml(site.name)}</div>
      <div class="city">${escapeHtml(FORMATS[site.format].label)} · ${escapeHtml((board.cities.find(c=>c.code===site.city)||{}).name || site.city)} · ${targetText}</div>
      ${doneAheadNote ? `<div class="city" style="color:var(--done);">${doneAheadNote}</div>` : ''}
      ${s.projectClosed ? `<div class="city" style="color:var(--done);">Closed by ${escapeHtml(s.closedBy)} · ${fmtDate(s.closedAt)}</div>` : ''}
      ${s.projectClosed && s.closureOverride ? `<div class="city" style="color:var(--gate-ink);">⚠ Closed with pending CapEx — override by ${escapeHtml(s.closureOverride.by)}: "${escapeHtml(s.closureOverride.reason)}"</div>` : ''}
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="switch-link" id="viewCommentsBtn" style="font-size:11px;">💬 ${commentCount}</button>
      <div class="stage-pill" style="background:${pillBg};color:${pillInk};">${label}</div>
    </div>
  `;
  document.getElementById('viewCommentsBtn').onclick = openCommentsPanel;

  const oldRow = document.getElementById('closeProjectRow');
  if(oldRow) oldRow.remove();
  if(showCloseBtn){
    const capexOk = capexActualsComplete(s);
    el.insertAdjacentHTML('afterend', `<div id="closeProjectRow" style="padding:0 14px 12px;">
      ${!capexOk ? `<div class="warn" style="margin-bottom:8px;">⚠ Not all CapEx actual costs are recorded yet.</div>` : ''}
      <button class="btn primary" id="closeProjectBtn" style="width:100%;">Close Project</button>
    </div>`);
    document.getElementById('closeProjectBtn').onclick = async ()=>{
      if(capexOk){
        if(!window.confirm(`Close ${site.name}? All snags are signed off and every stage is complete. This marks the project as formally closed.`)) return;
      } else {
        const reason = window.prompt(`Not all CapEx actual costs are recorded for ${site.name}. Enter a reason to close anyway — this will be logged:`);
        if(!reason) return;
        s.closureOverride = { by: getWho(), at: Date.now(), reason };
      }
      s.projectClosed = true;
      s.closedBy = getWho();
      s.closedAt = Date.now();
      await saveBoard();
      render();
    };
  }

  const oldDeleteRow = document.getElementById('deleteProjectRow');
  if(oldDeleteRow) oldDeleteRow.remove();
  if(showDeleteBtn){
    const anchorEl = document.getElementById('closeProjectRow') || el;
    anchorEl.insertAdjacentHTML('afterend', `<div id="deleteProjectRow" style="padding:0 14px 14px;">
      <button class="btn ghost" id="deleteProjectBtn" style="width:100%;color:#8A2E2E;border-color:#8A2E2E;">Delete Project</button>
    </div>`);
    document.getElementById('deleteProjectBtn').onclick = async ()=>{
      const typed = window.prompt(`This removes "${site.name}" from view for everyone. Nothing is permanently erased — an Admin can restore it later from Admin \u2192 Recently Deleted.\n\nType the project name exactly to confirm:`);
      if(typed === null) return;
      if(typed !== site.name){ window.alert("That didn't match — nothing was deleted."); return; }
      site.deletedAt = Date.now();
      site.deletedBy = getWho();
      await saveBoard();
      const vs = visibleSites();
      activeStore = vs.length ? vs[0].id : null;
      currentView = 'tracker';
      trackerSubView = 'list';
      render();
    };
  }
}

function openCommentsPanel(){
  const s = storeState(activeStore);
  const site = getSite(activeStore);
  const comments = (s.comments || []).slice().sort((a,b)=>b.at-a.at);
  const body = document.getElementById('sheetBody');
  body.innerHTML = `
    <h2>Comments — ${escapeHtml(site.name)}</h2>
    <div class="meta">Replies to this site's email thread show up here automatically.</div>
    ${comments.length ? `<div class="log" style="max-height:none;">` + comments.map(c=>
      `<div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);">
        <div style="font-size:12.5px;color:var(--ink);white-space:pre-wrap;">${escapeAndLinkify(c.body)}</div>
        <div style="font-size:11px;color:var(--sub);margin-top:4px;">${escapeHtml(c.from)} · ${timeAgo(c.at)}${c.source==='email'?' · via email':''}</div>
      </div>`
    ).join('') + `</div>` : `<div class="progress-line">No comments yet.</div>`}
    <div class="btn-row"><button class="btn primary" id="closeBtn">Close</button></div>
  `;
  document.getElementById('sheetBackdrop').classList.add('open');
  document.getElementById('closeBtn').onclick = closeSheet;
}

function renderFlow(){
  const el = document.getElementById('flow');
  if(!activeStore || board.sites.length === 0){
    el.className = '';
    el.innerHTML = `<div class="empty-note">No sites yet. Go to <b>Admin</b> to add the first site — its tracker starts the moment you add it.</div>`;
    return;
  }
  recompute(activeStore);
  const s = storeState(activeStore);
  const site = getSite(activeStore);
  el.className = '';
  let html = '';

  const overdueStages = STAGES.filter(st=>{
    const d = s.stageData[st.id];
    const t = stageTiming(st, d, activeStore);
    return t && t.isOverdue;
  });
  if(overdueStages.length){
    html += `<div class="delay-banner">` + overdueStages.map(st=>{
      const d = s.stageData[st.id];
      const t = stageTiming(st, d, activeStore);
      const reasonBit = d.delayReason
        ? `Reason logged: "${escapeAndLinkify(d.delayReason)}" — ${escapeHtml(d.delayLoggedBy)}`
        : `No reason logged yet — tap the stage to log one.`;
      return `<div>⚠ Stage ${st.num} (${escapeHtml(st.title)}) is ${t.overdueDays}d past its ${t.sla}d SLA. ${reasonBit}</div>`;
    }).join('') + `</div>`;
  }

  html += `<div style="display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px;font-size:12px;">
    <button type="button" id="viewModeVertical" class="switch-link" style="text-decoration:none;${stageViewMode==='vertical'?'font-weight:800;text-decoration:underline;':''}">☰ List</button>
    <span style="color:var(--sub);">·</span>
    <button type="button" id="viewModeHorizontal" class="switch-link" style="text-decoration:none;${stageViewMode==='horizontal'?'font-weight:800;text-decoration:underline;':''}">⬌ Timeline</button>
  </div>`;

  const stageMeta = STAGES.map(st=>{
    const d = s.stageData[st.id];
    if(d.status === 'skip') return { st, d, skip:true };
    const t = stageTiming(st, d, activeStore);
    let dotCls = d.status;
    if(t && t.isOverdue) dotCls = 'overdue';
    let dotContent = d.status==='done' ? '✓' : (d.status==='declined' ? '↩' : (t && t.isOverdue ? '!' : st.num));
    let statusLabel = {pending:'Pending', active:'In progress', done:'Complete', declined:'Sent back'}[d.status];
    let slaBit = `SLA ${effectiveSla(activeStore, 'stage_'+st.id, st.slaDays)}d`;
    if(t) slaBit = t.isOverdue ? `Day ${t.elapsedDays} — ${t.overdueDays}d over SLA` : `Day ${t.elapsedDays} of ${t.sla}d SLA`;
    let ownerText = st.owner;
    if(st.id === 2) ownerText = st.owner + ` · target ${FORMATS[site.format].sizeText}`;
    const assignedNames = (d.assignedTo||[]).map(id=>{
      const p = board.stakeholders.find(x=>x.id===id);
      return p ? p.name : null;
    }).filter(Boolean);
    if(assignedNames.length) ownerText = `Assigned: ${assignedNames.join(', ')}`;
    return { st, d, t, dotCls, dotContent, statusLabel, slaBit, ownerText, skip:false };
  });

  const stageCardHtml = (m) => `<div class="stage-row" data-stage="${m.st.id}">
      <div class="stage-dot ${m.dotCls}">${m.dotContent}</div>
      <div class="stage-card ${m.d.status} ${m.t&&m.t.isOverdue?'overdue-card':''}">
        <div class="stage-top">
          <div>
            <span class="stage-badge ${m.st.type}">${m.st.type}</span>
            <div class="stage-title">${m.st.num} · ${escapeHtml(m.st.title)}</div>
          </div>
          <div class="stage-dur ${m.t&&m.t.isOverdue?'overdue-dur':''}">${m.slaBit}</div>
        </div>
        <div class="stage-owner">${escapeHtml(m.ownerText)}</div>
        <div class="stage-status ${m.t&&m.t.isOverdue?'overdue':m.d.status}">${m.statusLabel}${m.d.updatedBy ? ' · '+escapeHtml(m.d.updatedBy)+' · '+timeAgo(m.d.updatedAt) : ''}</div>
      </div>
    </div>`;

  if(stageViewMode === 'horizontal'){
    html += `<div style="display:flex;overflow-x:auto;gap:4px;padding:8px 2px 14px;-webkit-overflow-scrolling:touch;">`;
    stageMeta.forEach(m=>{
      if(m.skip){
        html += `<div style="flex:none;text-align:center;width:52px;">
          <div class="stage-dot" style="margin:0 auto;">–</div>
          <div style="font-size:9px;color:var(--sub);margin-top:4px;">${m.st.num}</div>
        </div>`;
        return;
      }
      html += `<div data-stage-h="${m.st.id}" style="flex:none;text-align:center;width:52px;cursor:pointer;">
        <div class="stage-dot ${m.dotCls}" style="margin:0 auto;">${m.dotContent}</div>
        <div style="font-size:9px;color:var(--sub);margin-top:4px;">${m.st.num}</div>
      </div>`;
    });
    html += `</div>`;
    const currentMeta = stageMeta.find(m=>!m.skip && m.st.id === s.current) || stageMeta.find(m=>!m.skip);
    if(currentMeta){
      html += `<div class="progress-line" style="margin-bottom:6px;">Showing the current stage — tap any dot above to view a different one.</div>`;
      html += stageCardHtml(currentMeta);
    }
  } else {
    html += '<div class="rail-line"></div>';
    stageMeta.forEach(m=>{
      if(m.skip){
        html += `<div class="stage-row"><div class="stage-dot">–</div>
          <div class="stage-card skip"><div class="stage-title">${m.st.num} · ${escapeHtml(m.st.title)}</div>
          <div class="stage-owner">Not applicable — Chennai</div></div></div>`;
        return;
      }
      html += stageCardHtml(m);
      if(m.d.status === 'declined' && m.st.reworkTo){
        html += `<div class="restart-note">↩ restarted to Stage ${STAGES.find(x=>x.id===m.st.reworkTo).num} — ${escapeHtml(STAGES.find(x=>x.id===m.st.reworkTo).title)}</div>`;
      }
    });
  }

  el.innerHTML = html;
  el.querySelectorAll('.stage-row[data-stage]').forEach(row=>{
    row.onclick = ()=> openSheet(parseInt(row.dataset.stage));
  });
  el.querySelectorAll('[data-stage-h]').forEach(row=>{
    row.onclick = ()=> openSheet(parseInt(row.dataset.stageH));
  });
  const vBtn = document.getElementById('viewModeVertical');
  const hBtn = document.getElementById('viewModeHorizontal');
  if(vBtn) vBtn.onclick = ()=>{ stageViewMode='vertical'; try{localStorage.setItem('nsoStageViewMode','vertical');}catch(e){} render(); };
  if(hBtn) hBtn.onclick = ()=>{ stageViewMode='horizontal'; try{localStorage.setItem('nsoStageViewMode','horizontal');}catch(e){} render(); };
}

function openSheet(stageId){
  const st = STAGES.find(x=>x.id===stageId);
  const s = storeState(activeStore);
  const site = getSite(activeStore);
  const d = s.stageData[stageId];
  const backdrop = document.getElementById('sheetBackdrop');
  const body = document.getElementById('sheetBody');

  let inner = `
    <span class="stage-badge ${st.type} sheet-badge">${st.type}</span>
    <h2>${st.num} · ${escapeHtml(st.title)}</h2>
    <div class="meta">${escapeHtml(st.owner)} · ${st.duration}</div>
    <div class="desc">${escapeHtml(st.desc)}${st.id===2 ? ` Preferred size for this site: <b>${FORMATS[site.format].sizeText}</b> (${FORMATS[site.format].label}).` : ''}</div>
  `;
  const myStakeholder = findMyStakeholder();
  const myId = myStakeholder ? myStakeholder.id : null;
  const assignedIds = d.assignedTo || [];
  const assignedList = assignedIds.map(id=>board.stakeholders.find(p=>p.id===id)).filter(Boolean);

  inner += `<details class="collapse-group" open><summary>Assigned to <span style="font-weight:400;color:var(--sub);font-size:11px;">${assignedList.length ? assignedList.length+' people' : 'nobody yet'}</span></summary>`;
  inner += `<div class="field">`;
  if(assignedList.length){
    inner += `<div class="approver-list">` + assignedList.map(p=>`
      <div class="approver">
        <div class="approver-name">${escapeHtml(stakeholderLabel(p))}</div>
        ${isAdmin() ? `<button class="remove-x" data-remove-assignee="${p.id}">✕</button>` : ''}
      </div>`).join('') + `</div>`;
  } else {
    inner += `<div class="progress-line">Nobody assigned yet.</div>`;
  }
  if(isAdmin()){
    inner += `<select id="stageAssignAdd"><option value="">+ add someone</option>
      ${board.stakeholders.filter(p=>!assignedIds.includes(p.id)).map(p=>`<option value="${p.id}">${escapeHtml(stakeholderLabel(p))}</option>`).join('')}
    </select>`;
  }
  inner += `</div>`;
  if(myId && assignedIds.includes(myId)){
    inner += `<div class="field"><label>Transfer my part to</label>
      <select id="stageTransferTo"><option value="">— select someone —</option>
        ${board.stakeholders.filter(p=>p.id!==myId).map(p=>`<option value="${p.id}">${escapeHtml(stakeholderLabel(p))}</option>`).join('')}
      </select></div>
      <div class="btn-row"><button class="btn decline" id="stageTransferBtn">Transfer my part</button></div>`;
  }
  inner += `</details>`;
  if(st.warning) inner += `<div class="warn">⚠ ${escapeHtml(st.warning)}</div>`;

  const t = stageTiming(st, d, activeStore);
  if(t){
    inner += `<div class="meta" style="margin-top:-6px;">Day ${t.elapsedDays} of ${t.sla}d SLA${t.isOverdue ? ` — <span style="color:#C13E3E;font-weight:700;">${t.overdueDays}d over</span>` : ''}</div>`;
  }
  if(t && t.isOverdue){
    inner += `<div class="warn">⚠ This stage is ${t.overdueDays} day(s) past its SLA.
      ${d.delayReason ? `Reason logged: "${escapeAndLinkify(d.delayReason)}" — ${escapeHtml(d.delayLoggedBy)}, ${timeAgo(d.delayLoggedAt)}` : ''}
    </div>`;
    inner += `<div class="field"><label>${d.delayReason?'Update delay reason':'Log reason for delay'}</label>
      <textarea id="delayReasonField" placeholder="e.g. landlord unresponsive, awaiting legal docs...">${escapeHtml(d.delayReason||'')}</textarea></div>
      <div class="btn-row"><button class="btn decline" id="logDelayBtn">Log delay</button></div>`;
  }

  d.attachments = d.attachments || [];
  inner += `<details class="collapse-group"><summary>Attachments <span style="font-weight:400;color:var(--sub);font-size:11px;">${d.attachments.length ? d.attachments.length+' files' : 'none yet'}</span></summary>`;
  if(d.attachments.length){
    inner += `<div class="approver-list">` + d.attachments.map((a,i)=>{
      const canDelete = a.uploadedBy === getWho() || isAdmin();
      const thumb = isImageFile(a.name)
        ? `<img src="${a.url}" class="attach-thumb" data-preview="${i}" alt="">`
        : `<div class="attach-file-icon" data-preview="${i}">📄</div>`;
      return `<div class="approver attachment-row">
        ${thumb}
        <div class="approver-name" data-preview="${i}" style="cursor:pointer;">${escapeHtml(a.name)}
          <div class="approver-stamp">${escapeHtml(a.uploadedBy)} · ${timeAgo(a.uploadedAt)}</div></div>
        ${canDelete ? `<button class="remove-x" data-del-attachment="${i}">✕</button>` : ''}
      </div>`;
    }).join('') + `</div>`;
  } else {
    inner += `<div class="progress-line">No files yet.</div>`;
  }
  inner += `<div class="field"><input id="attachmentFile" type="file" multiple></div>
    <div class="progress-line" style="margin-top:0;">Select multiple files at once if you want — each uploads and gets its own entry. Files over 25MB will still upload here, but won't be attached to the email trail — the update email will just link back to the project instead.</div>
    <div class="btn-row"><button class="btn ghost" id="uploadAttachmentBtn">Upload</button></div>
    <div id="uploadStatus" class="progress-line"></div>`;
  inner += `</details>`;

  d.blockerFlags = d.blockerFlags || [];
  inner += `<details class="collapse-group"><summary>Flag a blocker <span style="font-weight:400;color:var(--sub);font-size:11px;">${d.blockerFlags.length ? d.blockerFlags.length+' flagged' : 'none flagged'}</span></summary>
    <div class="progress-line" style="margin-top:0;">Stuck because of someone else's work? Name them and it'll notify them and their manager.</div>
    <div class="field"><label>Who is blocking you?</label>
      <select id="blockerPerson">
        <option value="">— select —</option>
        ${board.stakeholders.map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Notes</label><textarea id="blockerNote" placeholder="e.g. waiting on sign-off, they're on leave this week"></textarea></div>
    <div class="btn-row"><button class="btn decline" id="flagBlockerBtn">Flag blocker</button></div>`;
  if(d.blockerFlags.length){
    inner += `<div class="log">` + d.blockerFlags.slice(-5).reverse().map(b=>{
      const person = board.stakeholders.find(p=>p.id===b.personId);
      return `Blocked by ${person ? escapeHtml(person.name) : 'someone'}: "${escapeAndLinkify(b.note)}" — flagged by ${escapeHtml(b.by)}, ${timeAgo(b.at)}`;
    }).join('<br>') + `</div>`;
  }
  inner += `</details>`;

  if(st.type === 'approval'){
    d.approvals = d.approvals || {};
    const panel = board.approvalPanel.map(id=>board.stakeholders.find(x=>x.id===id)).filter(Boolean);
    const approvedCount = panel.filter(p=>d.approvals[p.id]).length;
    if(panel.length < 5){
      inner += `<div class="warn">⚠ Only ${panel.length}/5 seats filled on the approval panel. Assign all 5 in Admin.</div>`;
    }
    inner += `<div class="approver-list">` + panel.map(p=>{
      const rec = d.approvals[p.id];
      return `<div class="approver">
        <div class="approver-name">${escapeHtml(p.name)} <span class="level-badge">${levelLabel(p.level)}</span>
          ${rec ? `<div class="approver-stamp">✓ confirmed by ${escapeHtml(rec.by)} · ${timeAgo(rec.at)}</div>` : ''}</div>
        <div class="check ${rec?'on':''}" data-approver="${p.id}">${rec?'✓':''}</div>
      </div>`;
    }).join('') + `</div>
    <div class="progress-line">${approvedCount} / ${panel.length} signed off${d.status==='done' ? ' — all approved' : ''}</div>`;
    if(d.status !== 'done'){
      inner += `<div class="btn-row">
        <button class="btn decline" id="declineBtn">Decline — send back</button>
        <button class="btn primary" id="closeBtn">Close</button>
      </div>`;
    }else{
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  } else if(st.id === 3){
    d.financials = d.financials || { capex:'', m1Revenue:'', monthlyGrowthByMonth:{}, y2GrowthPct:'', y3GrowthPct:'', cogsPct:'', fixedOpex:'' };
    const f = d.financials;
    // Migrate old single "one growth % for all of M2-M12" into per-month values, so
    // existing projects keep their exact same projection instead of resetting blank.
    if(f.monthlyGrowthPct !== undefined && !f.monthlyGrowthByMonth){
      f.monthlyGrowthByMonth = {};
      for(let m=2; m<=12; m++) f.monthlyGrowthByMonth[m] = f.monthlyGrowthPct;
      delete f.monthlyGrowthPct;
    }
    f.monthlyGrowthByMonth = f.monthlyGrowthByMonth || {};
    inner += `<div class="info-box">${s.capex && s.capex.finalized ? '✓ Tentative CapEx Finalized — see the CapEx tab for full detail (cost-list only).' : 'Tentative CapEx not yet finalized — see the CapEx tab.'}</div>`;
    inner += `
      <div class="field"><label>CAPEX — one-time investment (₹)</label><input id="fx_capex" type="number" value="${f.capex}" placeholder="e.g. 6000000"></div>
      <div class="field"><label>Month 1 revenue (₹)</label><input id="fx_m1" type="number" value="${f.m1Revenue}" placeholder="e.g. 800000"></div>
      <div class="field">
        <label>Monthly growth, each month vs. the one before it (%)</label>
        <div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;">
          ${Array.from({length:11}, (_,i)=>i+2).map(m=>`
            <div style="flex:none;width:52px;text-align:center;">
              <div style="font-size:9px;color:var(--sub);margin-bottom:3px;">M${m}</div>
              <input id="fx_mg_${m}" type="number" value="${f.monthlyGrowthByMonth[m] !== undefined ? f.monthlyGrowthByMonth[m] : ''}" placeholder="%" style="width:100%;font-size:11px;padding:6px 3px;text-align:center;">
            </div>`).join('')}
        </div>
      </div>
      <div class="field"><label>Year 2 step-up (%)</label><input id="fx_y2" type="number" value="${f.y2GrowthPct}" placeholder="e.g. 15"></div>
      <div class="field"><label>Year 3 step-up (%)</label><input id="fx_y3" type="number" value="${f.y3GrowthPct}" placeholder="e.g. 12"></div>
      <div class="field"><label>COGS (% of revenue)</label><input id="fx_cogs" type="number" value="${f.cogsPct}" placeholder="e.g. 32"></div>
      <div class="field"><label>Fixed monthly opex — rent, staff, utilities (₹)</label><input id="fx_opex" type="number" value="${f.fixedOpex}" placeholder="e.g. 450000"></div>
      <div class="btn-row"><button class="btn ghost" id="calcBtn">Calculate</button></div>
      <div id="fxResults"></div>
      <div class="field"><label>Notes</label><textarea id="notesField" placeholder="Status / next step...">${escapeHtml(d.notes||'')}</textarea></div>
    `;
    if(d.status !== 'done'){
      inner += `<div class="btn-row">
        <button class="btn ghost" id="saveNotesBtn">Save only</button>
        <button class="btn primary" id="completeBtn">Save &amp; mark complete</button>
      </div>`;
    }else{
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  } else if(st.type === 'gate'){
    inner += `<div class="progress-line">${d.status==='done' ? 'Confirmed by landlord' : 'Awaiting written confirmation'}</div>`;
    if(d.status !== 'done'){
      inner += `<div class="btn-row">
        <button class="btn decline" id="declineBtn">Not confirmed — send back</button>
        <button class="btn primary" id="confirmBtn">Confirm load received</button>
      </div>`;
    }else{
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  } else if(st.type === 'checklist'){
    d.tasks = d.tasks || {}; d.design = d.design || {}; d.delivery = d.delivery || {}; d.finalStage = d.finalStage || {};
    const doneCount = STAGE11_TASKS.filter(item=>d.tasks[item.key] && d.tasks[item.key].done).length;
    const missingDateCount = STAGE11_TASKS.filter(item=>d.tasks[item.key] && d.tasks[item.key].done && !d.tasks[item.key].actualDate).length;
    const overPlanCount = STAGE11_TASKS.filter(item=>{
      const rec = d.tasks[item.key];
      if(!rec || !rec.tentativeStart || !rec.tentativeEnd) return false;
      const sla = effectiveSla(activeStore, 'task_'+item.key, item.slaDays);
      const plannedDays = Math.round((new Date(rec.tentativeEnd) - new Date(rec.tentativeStart)) / 86400000);
      return plannedDays > sla;
    }).length;

    inner += `<div class="progress-line" style="font-weight:700;color:var(--ink);">${doneCount} / ${STAGE11_TASKS.length} execution tasks complete</div>`;
    if(missingDateCount > 0){
      inner += `<div class="warn">⚠ ${missingDateCount} completed task${missingDateCount>1?'s':''} missing an actual completion date — project team should record the real date, not just tick the box.</div>`;
    }
    if(overPlanCount > 0){
      inner += `<div class="warn">⚠ ${overPlanCount} task${overPlanCount>1?'s have':' has'} a planned duration (tentative start to end) longer than its admin-set SLA.</div>`;
    }

    inner += `<details class="collapse-group" open>
      <summary>Execution Tasks (${STAGE11_TASKS.length})</summary>`;
    STAGE11_TASKS.forEach(item=>{
      const rec = d.tasks[item.key] || { done:false, actualDate:'', tentativeStart:'', tentativeEnd:'', assignedTo:[], by:'', at:0 };
      const sla = effectiveSla(activeStore, 'task_'+item.key, item.slaDays);
      const it = itemTiming(d.startedAt, item.slaDays, item.key, activeStore);
      const slaLabel = it ? (it.isOverdue ? `${it.overdueDays}d over ${sla}d SLA` : `Day ${it.elapsedDays} of ${sla}d SLA`) : `${sla}d SLA`;
      const missingDate = rec.done && !rec.actualDate;
      let plannedDays = null;
      if(rec.tentativeStart && rec.tentativeEnd){
        plannedDays = Math.round((new Date(rec.tentativeEnd) - new Date(rec.tentativeStart)) / 86400000);
      }
      const overPlan = plannedDays !== null && plannedDays > sla;
      inner += `<div class="mini-task-card ${rec.done?'done':''} ${(it&&it.isOverdue&&!rec.done)||overPlan?'overdue-card':''}">
        <div class="mini-task-top">
          <div class="mini-task-label">${escapeHtml(item.label)}</div>
          <div class="mini-task-sla ${it&&it.isOverdue?'overdue-dur':''}">${slaLabel}</div>
        </div>
        <div class="field" style="margin-top:8px;"><label>Assigned to</label>
          ${(()=>{
            const myId2 = (findMyStakeholder()||{}).id;
            const ids = rec.assignedTo || [];
            const list = ids.map(id=>board.stakeholders.find(p=>p.id===id)).filter(Boolean);
            let html = list.length ? list.map(p=>`
              <div class="approver" style="padding:5px 0;">
                <div class="approver-name" style="font-size:12px;">${escapeHtml(p.name)}</div>
                ${isAdmin() ? `<button class="remove-x" data-task-remove-assignee="${item.key}|${p.id}">✕</button>` : ''}
              </div>`).join('') : `<div class="progress-line" style="margin:4px 0;">Nobody assigned yet.</div>`;
            if(isAdmin()){
              html += `<select data-task-assign-add="${item.key}"><option value="">+ add someone</option>
                ${board.stakeholders.filter(p=>!ids.includes(p.id)).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
              </select>`;
            }
            if(myId2 && ids.includes(myId2)){
              html += `<select data-task-transfer-to="${item.key}" style="margin-top:6px;"><option value="">— transfer my part to —</option>
                ${board.stakeholders.filter(p=>p.id!==myId2).map(p=>`<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}
              </select>
              <button type="button" class="btn ghost" data-task-transfer-btn="${item.key}" style="margin-top:4px;width:100%;">Transfer</button>`;
            }
            return html;
          })()}
        </div>
        <div class="mini-task-row">
          <div style="flex:1;min-width:130px;">
            <label style="display:block;font-size:10px;color:var(--sub);margin-bottom:3px;">Tentative start</label>
            ${dateFieldWithClear(`task_tstart_${item.key}`, rec.tentativeStart)}
          </div>
          <div style="flex:1;min-width:130px;">
            <label style="display:block;font-size:10px;color:var(--sub);margin-bottom:3px;">Tentative end</label>
            ${dateFieldWithClear(`task_tend_${item.key}`, rec.tentativeEnd)}
          </div>
        </div>
        ${overPlan ? `<div class="mini-task-flag">⚠ Planned ${plannedDays}d — exceeds ${sla}d SLA by ${plannedDays-sla}d</div>` : ''}
        <div class="mini-task-row">
          <label class="mini-task-check"><input type="checkbox" data-task-done="${item.key}" ${rec.done?'checked':''}> Complete</label>
          <div style="flex:1;">${dateFieldWithClear(`task_actual_${item.key}`, rec.actualDate)}</div>
        </div>
        ${missingDate ? `<div class="mini-task-flag">⚠ No date recorded</div>` : ''}
        ${rec.done ? `<div class="approver-stamp">${escapeHtml(rec.by)} · ${timeAgo(rec.at)}</div>` : ''}
      </div>`;
    });
    inner += `</details>`;

    inner += `<details class="collapse-group">
      <summary>Design Details (${STAGE11_DESIGN.length})</summary>
      <div class="progress-line" style="margin-top:0;">One-time specs — no SLA</div>`;
    STAGE11_DESIGN.forEach(f=>{
      if(f.dateTriplet){
        inner += renderDateTriplet('dsn', f.key, f.label, d.design[f.key]);
      } else {
        inner += `<div class="field"><label>${escapeHtml(f.label)}</label><input id="dsn_${f.key}" type="${f.type||'text'}" value="${escapeHtml(d.design[f.key]||'')}"></div>`;
      }
    });
    inner += `</details>`;

    inner += `<details class="collapse-group">
      <summary>Equipment Delivery Schedule (${STAGE11_DELIVERY.length})</summary>
      <div class="progress-line" style="margin-top:0;">No SLA — tracked as tentative start / delivery date / actual date</div>`;
    STAGE11_DELIVERY.forEach(f=>{
      inner += renderDateTriplet('dlv', f.key, f.label, d.delivery[f.key]);
    });
    inner += `</details>`;

    inner += `<details class="collapse-group">
      <summary>Final Stage (${STAGE11_FINAL.length})</summary>`;
    STAGE11_FINAL.forEach(f=>{
      if(f.dateTriplet){
        inner += renderDateTriplet('fin', f.key, f.label, d.finalStage[f.key]);
      } else {
        inner += `<div class="field"><label>${escapeHtml(f.label)}</label><input id="fin_${f.key}" type="${f.type||'text'}" value="${escapeHtml(d.finalStage[f.key]||'')}"></div>`;
      }
    });
    inner += `</details>`;

    inner += `<div class="btn-row"><button class="btn primary" id="saveChecklistBtn">Save details</button></div>`;
    if(d.status === 'done'){
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  } else {
    inner += `<div class="field"><label>Notes</label><textarea id="notesField" placeholder="Status / next step...">${escapeHtml(d.notes||'')}</textarea></div>`;
    if(d.status !== 'done'){
      inner += `<div class="btn-row">
        <button class="btn ghost" id="saveNotesBtn">Save notes</button>
        <button class="btn primary" id="completeBtn">Mark complete</button>
      </div>`;
    }else{
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  }

  if(s.log.filter(l=>l.stageId===stageId).length){
    inner += `<div class="log">` + s.log.filter(l=>l.stageId===stageId).slice(-5).reverse().map(l=>`${escapeHtml(l.text)} — ${timeAgo(l.at)}`).join('<br>') + `</div>`;
  }

  body.innerHTML = inner;
  backdrop.classList.add('open');
  wireSheetActions(st, s, d);
  if(st.id === 3) renderFxResults(d.financials);
}

function readFxInputs(){
  const monthlyGrowthByMonth = {};
  for(let m=2; m<=12; m++){
    const el = document.getElementById(`fx_mg_${m}`);
    if(el) monthlyGrowthByMonth[m] = el.value;
  }
  return {
    capex: document.getElementById('fx_capex').value,
    m1Revenue: document.getElementById('fx_m1').value,
    monthlyGrowthByMonth,
    y2GrowthPct: document.getElementById('fx_y2').value,
    y3GrowthPct: document.getElementById('fx_y3').value,
    cogsPct: document.getElementById('fx_cogs').value,
    fixedOpex: document.getElementById('fx_opex').value,
  };
}
function renderFxResults(f){
  const el = document.getElementById('fxResults');
  if(!el) return;
  if(!(f.capex && f.m1Revenue)){
    el.innerHTML = `<div class="progress-line">Fill in CAPEX and Month 1 revenue, then Calculate.</div>`;
    return;
  }
  const r = calcProjection(f);
  el.innerHTML = `
    <div class="progress-line" style="font-size:13px;font-weight:700;color:var(--ink);margin-top:14px;">
      Payback: ${r.paybackMonth ? r.paybackMonth+' months' : 'beyond 36 months'} · 3-Yr ROI: ${r.roi3yr.toFixed(0)}%
    </div>
    <table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;">
      <tr style="color:var(--sub);text-align:left;"><th style="padding:4px 0;">Year</th><th>Revenue</th><th>EBITDA</th></tr>
      ${r.y.map((yy,i)=>`<tr style="border-top:1px solid var(--line);">
        <td style="padding:5px 0;font-weight:600;">Y${i+1}</td><td>${fmtINR(yy.rev)}</td><td>${fmtINR(yy.ebitda)}</td>
      </tr>`).join('')}
      <tr style="border-top:1px solid var(--line);font-weight:700;">
        <td style="padding:5px 0;">Total</td><td>${fmtINR(r.y[0].rev+r.y[1].rev+r.y[2].rev)}</td><td>${fmtINR(r.totalEBITDA)}</td>
      </tr>
    </table>
  `;
}

function wireSheetActions(st, s, d){
  const closeBtn = document.getElementById('closeBtn');
  if(closeBtn) closeBtn.onclick = closeSheet;

  const addSel = document.getElementById('stageAssignAdd');
  if(addSel) addSel.onchange = async ()=>{
    if(!addSel.value) return;
    d.assignedTo = d.assignedTo || [];
    if(!d.assignedTo.includes(addSel.value)) d.assignedTo.push(addSel.value);
    d.updatedBy = getWho(); d.updatedAt = Date.now();
    await saveBoard(); render(); openSheet(st.id);
  };
  document.querySelectorAll('[data-remove-assignee]').forEach(btn=>{
    btn.onclick = async ()=>{
      d.assignedTo = (d.assignedTo||[]).filter(x=>x!==btn.dataset.removeAssignee);
      d.updatedBy = getWho(); d.updatedAt = Date.now();
      await saveBoard(); render(); openSheet(st.id);
    };
  });
  const transferBtn = document.getElementById('stageTransferBtn');
  if(transferBtn) transferBtn.onclick = async ()=>{
    const newId = document.getElementById('stageTransferTo').value;
    if(!newId) return;
    const myId = (findMyStakeholder()||{}).id;
    const oldPerson = board.stakeholders.find(p=>p.id===myId);
    const newPerson = board.stakeholders.find(p=>p.id===newId);
    d.assignedTo = (d.assignedTo||[]).filter(x=>x!==myId);
    if(!d.assignedTo.includes(newId)) d.assignedTo.push(newId);
    d.updatedBy = getWho(); d.updatedAt = Date.now();
    s.log.push({stageId:st.id, text:`${oldPerson?oldPerson.name:getWho()} transferred their part to ${newPerson?newPerson.name:'someone'}`, at: Date.now()});
    await saveBoard(); render(); openSheet(st.id);
  };

  const flagBlockerBtn = document.getElementById('flagBlockerBtn');
  if(flagBlockerBtn) flagBlockerBtn.onclick = async ()=>{
    const personId = document.getElementById('blockerPerson').value;
    const note = document.getElementById('blockerNote').value.trim();
    if(!personId || !note){
      if(!personId) document.getElementById('blockerPerson').focus();
      else document.getElementById('blockerNote').focus();
      return;
    }
    const who = getWho();
    d.blockerFlags = d.blockerFlags || [];
    d.blockerFlags.push({ personId, note, by: who, at: Date.now() });
    const person = board.stakeholders.find(p=>p.id===personId);
    s.log.push({stageId:st.id, text:`Blocker flagged by ${who} — waiting on ${person?person.name:'someone'}`, at: Date.now()});
    await saveBoard(); render(); openSheet(st.id);
  };

  const uploadBtn = document.getElementById('uploadAttachmentBtn');
  const fileInputEl = document.getElementById('attachmentFile');
  if(fileInputEl) fileInputEl.onchange = ()=>{
    const files = Array.from(fileInputEl.files);
    const statusEl = document.getElementById('uploadStatus');
    const oversized = files.filter(f => f.size > 25*1024*1024);
    if(oversized.length){
      const names = oversized.map(f => `"${f.name}" (${(f.size/1024/1024).toFixed(1)}MB)`).join(', ');
      statusEl.textContent = `⚠ Over the 25MB email limit: ${names}. They'll still upload here, but the update email will only link to them, not attach them.`;
    } else if(statusEl){
      statusEl.textContent = files.length > 1 ? `${files.length} files selected.` : '';
    }
  };
  if(uploadBtn) uploadBtn.onclick = async ()=>{
    const fileInput = document.getElementById('attachmentFile');
    const files = Array.from(fileInput.files);
    const statusEl = document.getElementById('uploadStatus');
    if(!files.length){ statusEl.textContent = 'Choose at least one file first.'; return; }
    d.attachments = d.attachments || [];
    let uploaded = 0;
    for(const file of files){
      const oversized = file.size > 25*1024*1024;
      statusEl.textContent = `Uploading ${uploaded+1} of ${files.length}${oversized ? ' (over 25MB — won\'t be attached to the email, just linked)' : ''}...`;
      try{
        const path = `sites/${activeStore}/stage${st.id}/${Date.now()}_${file.name}`;
        const ref = storage.ref(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        d.attachments.push({ name: file.name, url, path, uploadedBy: getWho(), uploadedAt: Date.now(), sizeBytes: file.size, oversized });
        uploaded++;
      }catch(e){
        statusEl.textContent = `Upload failed on "${file.name}": ` + (e.message || e.code);
        if(uploaded > 0) await saveBoard();
        return;
      }
    }
    await saveBoard();
    render(); openSheet(st.id);
  };
  document.querySelectorAll('[data-preview]').forEach(el=>{
    el.onclick = ()=>{
      const att = d.attachments[parseInt(el.dataset.preview)];
      if(att) openFilePreview(att.url, att.name);
    };
  });
  document.querySelectorAll('[data-del-attachment]').forEach(btn=>{
    btn.onclick = async ()=>{
      const i = parseInt(btn.dataset.delAttachment);
      const att = d.attachments[i];
      if(!att) return;
      // only the uploader or an admin ever sees this button, but double-check before deleting
      if(!(att.uploadedBy === getWho() || isAdmin())) return;
      if(!window.confirm(`Delete "${att.name}"? This can't be undone.`)) return;
      try{ if(att.path) await storage.ref(att.path).delete(); }catch(e){ console.error('storage delete failed', e); }
      d.attachments.splice(i, 1);
      await saveBoard(); render(); openSheet(st.id);
    };
  });


  const calcBtn = document.getElementById('calcBtn');
  if(calcBtn) calcBtn.onclick = ()=> renderFxResults(readFxInputs());

  document.querySelectorAll('[data-task-done]').forEach(chk=>{
    chk.onchange = async ()=>{
      const who = getWho();
      const key = chk.dataset.taskDone;
      d.tasks = d.tasks || {};
      const existing = d.tasks[key] || { actualDate:'', tentativeStart:'', tentativeEnd:'', assignedTo:[] };
      const dateInput = document.getElementById(`task_actual_${key}`);
      d.tasks[key] = {
        ...existing,
        done: chk.checked,
        actualDate: dateInput ? dateInput.value : existing.actualDate,
        by: who, at: Date.now(),
      };
      const allDone = STAGE11_TASKS.every(item=>d.tasks[item.key] && d.tasks[item.key].done);
      if(allDone && d.status !== 'done'){
        d.status = 'done'; d.updatedBy = who; d.updatedAt = Date.now();
        s.log.push({stageId:st.id, text:`All execution tasks complete, confirmed by ${who}`, at: Date.now()});
      } else if(!allDone && d.status === 'done'){
        d.status = 'active'; // a task got un-checked after completion
      }
      await saveBoard(); render(); openSheet(st.id);
    };
  });
  STAGE11_TASKS.forEach(item=>{
    const actualInp = document.getElementById(`task_actual_${item.key}`);
    if(actualInp) actualInp.onchange = async ()=>{
      d.tasks = d.tasks || {};
      if(!d.tasks[item.key]) d.tasks[item.key] = { done:false, actualDate:'', tentativeStart:'', tentativeEnd:'', assignedTo:[], by:'', at:0 };
      d.tasks[item.key].actualDate = actualInp.value;
      await saveBoard(); render(); openSheet(st.id);
    };
    const tstartInp = document.getElementById(`task_tstart_${item.key}`);
    if(tstartInp) tstartInp.onchange = async ()=>{
      d.tasks = d.tasks || {};
      if(!d.tasks[item.key]) d.tasks[item.key] = { done:false, actualDate:'', tentativeStart:'', tentativeEnd:'', assignedTo:[], by:'', at:0 };
      d.tasks[item.key].tentativeStart = tstartInp.value;
      await saveBoard(); render(); openSheet(st.id);
    };
    const tendInp = document.getElementById(`task_tend_${item.key}`);
    if(tendInp) tendInp.onchange = async ()=>{
      d.tasks = d.tasks || {};
      if(!d.tasks[item.key]) d.tasks[item.key] = { done:false, actualDate:'', tentativeStart:'', tentativeEnd:'', assignedTo:[], by:'', at:0 };
      d.tasks[item.key].tentativeEnd = tendInp.value;
      await saveBoard(); render(); openSheet(st.id);
    };
  });
  document.querySelectorAll('[data-task-assign-add]').forEach(sel=>{
    sel.onchange = async ()=>{
      if(!sel.value) return;
      const key = sel.dataset.taskAssignAdd;
      d.tasks = d.tasks || {};
      if(!d.tasks[key]) d.tasks[key] = { done:false, actualDate:'', tentativeStart:'', tentativeEnd:'', assignedTo:[], by:'', at:0 };
      if(!d.tasks[key].assignedTo.includes(sel.value)) d.tasks[key].assignedTo.push(sel.value);
      await saveBoard(); render(); openSheet(st.id);
    };
  });
  document.querySelectorAll('[data-task-remove-assignee]').forEach(btn=>{
    btn.onclick = async ()=>{
      const [key, pid] = btn.dataset.taskRemoveAssignee.split('|');
      if(d.tasks[key]) d.tasks[key].assignedTo = (d.tasks[key].assignedTo||[]).filter(x=>x!==pid);
      await saveBoard(); render(); openSheet(st.id);
    };
  });
  document.querySelectorAll('[data-task-transfer-btn]').forEach(btn=>{
    btn.onclick = async ()=>{
      const key = btn.dataset.taskTransferBtn;
      const sel = document.querySelector(`[data-task-transfer-to="${key}"]`);
      const newId = sel ? sel.value : '';
      if(!newId) return;
      const myId2 = (findMyStakeholder()||{}).id;
      const oldP = board.stakeholders.find(p=>p.id===myId2);
      const newP = board.stakeholders.find(p=>p.id===newId);
      d.tasks[key].assignedTo = (d.tasks[key].assignedTo||[]).filter(x=>x!==myId2);
      if(!d.tasks[key].assignedTo.includes(newId)) d.tasks[key].assignedTo.push(newId);
      s.log.push({stageId:11, text:`${oldP?oldP.name:getWho()} transferred "${key}" to ${newP?newP.name:'someone'}`, at: Date.now()});
      await saveBoard(); render(); openSheet(st.id);
    };
  });

  const saveChecklistBtn = document.getElementById('saveChecklistBtn');
  if(saveChecklistBtn) saveChecklistBtn.onclick = async ()=>{
    const who = getWho();
    function readTriplet(prefix, key){
      const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      return {
        tentativeStart: g(`${prefix}_${key}_tstart`),
        deliveryDate: g(`${prefix}_${key}_delivery`),
        actualDate: g(`${prefix}_${key}_actual`),
      };
    }
    STAGE11_DESIGN.forEach(f=>{
      d.design[f.key] = f.dateTriplet ? readTriplet('dsn', f.key) : document.getElementById('dsn_'+f.key).value.trim();
    });
    STAGE11_DELIVERY.forEach(f=>{
      d.delivery[f.key] = readTriplet('dlv', f.key);
    });
    STAGE11_FINAL.forEach(f=>{
      d.finalStage[f.key] = f.dateTriplet ? readTriplet('fin', f.key) : document.getElementById('fin_'+f.key).value.trim();
    });
    d.updatedBy = who; d.updatedAt = Date.now();
    await saveBoard(); render(); openSheet(st.id);
  };

  document.querySelectorAll('[data-clear-target]').forEach(btn=>{
    btn.onclick = ()=>{
      const input = document.getElementById(btn.dataset.clearTarget);
      if(input){ input.value = ''; input.dispatchEvent(new Event('change', {bubbles:true})); }
    };
  });

  const logDelayBtn = document.getElementById('logDelayBtn');
  if(logDelayBtn) logDelayBtn.onclick = async ()=>{
    const who = getWho();
    d.delayReason = document.getElementById('delayReasonField').value.trim();
    d.delayLoggedBy = who; d.delayLoggedAt = Date.now();
    s.log.push({stageId:st.id, text:`Delay logged by ${who}: "${d.delayReason}"`, at: Date.now()});
    await saveBoard(); render(); openSheet(st.id);
  };

  document.querySelectorAll('[data-approver]').forEach(chip=>{
    chip.onclick = async ()=>{
      const who = getWho();
      const pid = chip.dataset.approver;
      d.approvals = d.approvals || {};
      if(d.approvals[pid]) delete d.approvals[pid];
      else d.approvals[pid] = { by: who, at: Date.now() };
      const panel = board.approvalPanel;
      const allApproved = panel.length===5 && panel.every(pid2=>d.approvals[pid2]);
      if(allApproved){
        d.status = 'done'; d.updatedBy = who; d.updatedAt = Date.now();
        s.log.push({stageId:st.id, text:`All 5 signed off, confirmed by ${who}`, at: Date.now()});
      }
      await saveBoard(); render(); openSheet(st.id);
    };
  });

  const declineBtn = document.getElementById('declineBtn');
  if(declineBtn) declineBtn.onclick = async ()=>{
    const who = getWho();
    d.status = 'declined'; d.approvals = {}; d.updatedBy = who; d.updatedAt = Date.now();
    d.delayReason=''; d.delayLoggedBy=''; d.delayLoggedAt=0;
    const target = STAGES.find(x=>x.id===st.reworkTo);
    if(target){
      s.stageData[target.id].status = 'active';
      s.stageData[target.id].startedAt = Date.now();
      s.stageData[target.id].delayReason=''; s.stageData[target.id].delayLoggedBy=''; s.stageData[target.id].delayLoggedAt=0;
      for(const later of STAGES){
        if(later.id > target.id && later.id < st.id){
          s.stageData[later.id].status = 'pending';
          s.stageData[later.id].startedAt = null;
        }
      }
      s.stageData[st.id].status = 'declined';
    }
    s.log.push({stageId:st.id, text:`Declined by ${who}, restarted to Stage ${target?target.num:''}`, at: Date.now()});
    await saveBoard(); render(); closeSheet();
  };

  const confirmBtn = document.getElementById('confirmBtn');
  if(confirmBtn) confirmBtn.onclick = async ()=>{
    const who = getWho();
    d.status = 'done'; d.updatedBy = who; d.updatedAt = Date.now();
    s.log.push({stageId:st.id, text:`Load confirmed, logged by ${who}`, at: Date.now()});
    await saveBoard(); render(); closeSheet();
  };

  const completeBtn = document.getElementById('completeBtn');
  if(completeBtn) completeBtn.onclick = async ()=>{
    const who = getWho();
    const notes = document.getElementById('notesField');
    if(notes) d.notes = notes.value.trim();
    if(st.id === 3) d.financials = readFxInputs();
    d.status = 'done'; d.updatedBy = who; d.updatedAt = Date.now();
    if(st.id === 7) s.signingDate = Date.now();
    s.log.push({stageId:st.id, text:`Marked complete by ${who}`, at: Date.now()});
    await saveBoard(); render(); closeSheet();
  };

  const saveNotesBtn = document.getElementById('saveNotesBtn');
  if(saveNotesBtn) saveNotesBtn.onclick = async ()=>{
    const who = getWho();
    d.notes = document.getElementById('notesField').value.trim();
    if(st.id === 3) d.financials = readFxInputs();
    d.updatedBy = who; d.updatedAt = Date.now();
    await saveBoard(); render(); closeSheet();
  };
}
function closeSheet(){ document.getElementById('sheetBackdrop').classList.remove('open'); }
document.getElementById('sheetBackdrop').onclick = (e)=>{ if(e.target.id==='sheetBackdrop') closeSheet(); };

document.getElementById('filePreviewClose').onclick = ()=>{
  document.getElementById('filePreviewOverlay').classList.remove('open');
  document.getElementById('filePreviewContent').innerHTML = '';
};
document.getElementById('filePreviewOverlay').onclick = (e)=>{
  if(e.target.id === 'filePreviewOverlay'){
    e.currentTarget.classList.remove('open');
    document.getElementById('filePreviewContent').innerHTML = '';
  }
};

        const name = String(row['Name']||'').trim();
        if(!name) return;
        const email = String(row['Email']||'').trim().toLowerCase();
        const department = String(row['Department']||'').trim();
        const level = String(row['Level']||'').trim();
        const isApprover = /^y/i.test(String(row['Approver']||''));
        const reportsToName = String(row['Reports To']||'').trim();
        const newP = { id: uid('sh'), name, email, department, level, reportsTo:null, isApprover };
        board.stakeholders.push(newP);
        added++;
        if(reportsToName){
          const match = board.stakeholders.find(p=>p.name.toLowerCase()===reportsToName.toLowerCase() && p.id!==newP.id);
          if(match) newP.reportsTo = match.id;
          else newlyUnresolved.push({ personId: newP.id, name: reportsToName });
        }
      });
      pendingReportsToResolve = pendingReportsToResolve.concat(newlyUnresolved);
      await saveBoard();
      statusEl.textContent = `Imported ${added} stakeholder(s).` + (newlyUnresolved.length ? ` ${newlyUnresolved.length} "Reports To" need manual matching below.` : '');
      render();
    }catch(e){
      statusEl.textContent = 'Import failed: ' + e.message;
    }
  };

  el.querySelectorAll('[data-resolve-reports]').forEach(sel=>{
    sel.onchange = async ()=>{
      if(!sel.value) return;
      const person = board.stakeholders.find(p=>p.id===sel.dataset.resolveReports);
      if(person) person.reportsTo = sel.value;
      pendingReportsToResolve = pendingReportsToResolve.filter(u=>u.personId!==sel.dataset.resolveReports);
      await saveBoard(); render();
    };
  });

  el.querySelectorAll('[data-del-sh]').forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.delSh;
      board.stakeholders = board.stakeholders.filter(p=>p.id!==id);
      board.approvalPanel = board.approvalPanel.map(pid=>pid===id?'':pid);
      // clear anyone who reported to the removed person, so no dangling reference
      board.stakeholders.forEach(p=>{ if(p.reportsTo===id) p.reportsTo=null; });
      await saveBoard(); render();
    };
  });
  el.querySelectorAll('[data-level-edit]').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = board.stakeholders.find(x=>x.id===inp.dataset.levelEdit);
      if(p) p.level = inp.value.trim();
      await saveBoard(); render();
    };
  });
  el.querySelectorAll('[data-reportsto-edit]').forEach(sel=>{
    sel.onchange = async ()=>{
      const p = board.stakeholders.find(x=>x.id===sel.dataset.reportstoEdit);
      if(p) p.reportsTo = sel.value || null;
      await saveBoard(); render();
    };
  });
  el.querySelectorAll('[data-email-edit]').forEach(inp=>{
    inp.onchange = async ()=>{
      const p = board.stakeholders.find(x=>x.id===inp.dataset.emailEdit);
      const val = inp.value.trim().toLowerCase();
      if(val && !isValidEmail(val)){
        inp.style.borderColor = '#C13E3E';
        return;
      }
      if(p) p.email = val;
      await saveBoard(); render();
    };
  });
  el.querySelectorAll('[data-approver-edit]').forEach(chk=>{
    chk.onchange = async ()=>{
      const p = board.stakeholders.find(x=>x.id===chk.dataset.approverEdit);
      if(p) p.isApprover = chk.checked;
      if(!chk.checked) board.approvalPanel = board.approvalPanel.map(pid=>pid===p.id?'':pid);
      await saveBoard(); render();
    };
  });

  el.querySelectorAll('[data-slot]').forEach(sel=>{
    sel.onchange = async ()=>{
      const i = parseInt(sel.dataset.slot);
      board.approvalPanel[i] = sel.value;
      await saveBoard(); render();
    };
  });
}

// ---------- Log in / Sign up / Forgot password (Cloud Functions) + Firestore sync ----------
// Log in = plain email + password, no OTP. Sign up and Forgot password share the same
// three-step shape (email -> verify code -> set password) — authFlowMode tracks which
// one is in progress so the same steps can serve both without duplicating markup.
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
let authFlowMode = 'signup'; // 'signup' | 'reset'

function showMsg(elId, msg, color){
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.color = color || '#C13E3E';
  el.style.display = 'block';
}
// A message with one clickable action inside it — e.g. "...— use Log in instead."
function showMsgWithLink(elId, before, linkText, after, onClick){
  const el = document.getElementById(elId);
  el.innerHTML = `${before}<a href="#" style="color:#C13E3E;font-weight:700;text-decoration:underline;" id="${elId}Link">${linkText}</a>${after}`;
  el.style.color = '#C13E3E';
  el.style.display = 'block';
  document.getElementById(`${elId}Link`).onclick = (ev)=>{ ev.preventDefault(); onClick(); };
}
function hideMsg(elId){ document.getElementById(elId).style.display = 'none'; }
// Genuinely unexpected server errors show as raw codes like "INTERNAL" — never show
// that verbatim, always fall back to something a person can actually act on.
function friendlyError(e, fallback){
  if(!e || !e.message || e.message === 'INTERNAL' || e.message.toLowerCase() === 'internal'){
    return "Something went wrong on our end. Please try again.";
  }
  return e.message || fallback;
}

function showAuthStep(step){
  document.getElementById('loginForm').style.display = step === 'login' ? 'block' : 'none';
  document.getElementById('signupStep1').style.display = step === 'signupStep1' ? 'block' : 'none';
  document.getElementById('signupStep2').style.display = step === 'signupStep2' ? 'block' : 'none';
  document.getElementById('signupStep3').style.display = step === 'signupStep3' ? 'block' : 'none';
  document.getElementById('loginNameField').style.display = step === 'enterName' ? 'block' : 'none';
  document.getElementById('authTabLogin').classList.toggle('active', step === 'login' || step === 'enterName');
  document.getElementById('authTabSignup').classList.toggle('active', step.indexOf('signup') === 0 && authFlowMode === 'signup');

  if(step === 'signupStep1'){
    document.getElementById('step1Intro').textContent = authFlowMode === 'reset'
      ? "Enter your email and we'll send you a code to reset your password."
      : '';
    document.getElementById('step1EmailLabel').textContent = authFlowMode === 'reset' ? 'Email' : 'Work email';
    document.getElementById('sendOtpBtn').textContent = authFlowMode === 'reset' ? 'Send reset code' : 'Send verification code';
  }
  if(step === 'signupStep3'){
    document.getElementById('step3Intro').textContent = authFlowMode === 'reset'
      ? 'Set a new password for your account'
      : 'Create a password for your account';
    document.getElementById('step3PasswordLabel').textContent = authFlowMode === 'reset' ? 'New password (min 8 characters)' : 'Password (min 8 characters)';
    document.getElementById('createAccountBtn').textContent = authFlowMode === 'reset' ? 'Reset password' : 'Create account';
  }
}

document.getElementById('authTabLogin').onclick = ()=>{ hideMsg('loginMsg'); showAuthStep('login'); };
document.getElementById('authTabSignup').onclick = ()=>{ authFlowMode = 'signup'; hideMsg('signupStep1Msg'); showAuthStep('signupStep1'); };
document.getElementById('forgotPasswordBtn').onclick = ()=>{
  authFlowMode = 'reset';
  hideMsg('signupStep1Msg');
  const prefill = document.getElementById('loginEmail').value.trim();
  document.getElementById('signupEmail').value = prefill;
  showAuthStep('signupStep1');
};

// ---- Log in ----
document.getElementById('loginBtn').onclick = async ()=>{
  hideMsg('loginMsg');
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  if(!isValidEmail(email)){ showMsg('loginMsg', 'Enter a valid email address.'); return; }
  if(!password){ showMsg('loginMsg', 'Enter your password.'); return; }
  try{
    document.getElementById('loginBtn').disabled = true;
    const res = await loginFn({ email, password });
    await auth.signInWithCustomToken(res.data.token);
    // onAuthStateChanged below picks it up from here
  }catch(e){
    showMsg('loginMsg', friendlyError(e, 'Sign-in failed. Please try again.'));
  }finally{
    document.getElementById('loginBtn').disabled = false;
  }
};

// ---- Step 1: send the code (used by both Sign up and Forgot password) ----
let signupEmail = null;
document.getElementById('sendOtpBtn').onclick = async ()=>{
  hideMsg('signupStep1Msg');
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  if(!isValidEmail(email)){ showMsg('signupStep1Msg', 'Enter a valid email address.'); return; }
  try{
    document.getElementById('sendOtpBtn').disabled = true;
    const res = await sendOtpCodeFn({ email });
    if(authFlowMode === 'signup' && res.data.hasPassword){
      showMsgWithLink('signupStep1Msg', 'An account already exists for this email — ', 'click to log in', ' instead.', ()=>{
        document.getElementById('loginEmail').value = email;
        hideMsg('signupStep1Msg');
        showAuthStep('login');
      });
      return;
    }
    if(authFlowMode === 'reset' && !res.data.hasPassword){
      showMsgWithLink('signupStep1Msg', 'No account found for this email — ', 'click to sign up', ' instead.', ()=>{
        authFlowMode = 'signup';
        document.getElementById('signupEmail').value = email;
        hideMsg('signupStep1Msg');
        showAuthStep('signupStep1');
      });
      return;
    }
    signupEmail = email;
    document.getElementById('signupEmailConfirm').textContent = email;
    document.getElementById('otpInput').value = '';
    showAuthStep('signupStep2');
  }catch(e){
    showMsg('signupStep1Msg', friendlyError(e, 'Could not send the code. Please try again.'));
  }finally{
    document.getElementById('sendOtpBtn').disabled = false;
  }
};

// ---- Step 2: verify the code ----
document.getElementById('verifyOtpBtn').onclick = async ()=>{
  hideMsg('signupStep2Msg');
  const code = document.getElementById('otpInput').value.trim();
  if(!code){ showMsg('signupStep2Msg', 'Enter the 6-digit code.'); return; }
  try{
    document.getElementById('verifyOtpBtn').disabled = true;
    await verifyOtpCodeFn({ email: signupEmail, code });
    document.getElementById('newPassword').value = '';
    document.getElementById('newPasswordConfirm').value = '';
    showAuthStep('signupStep3');
  }catch(e){
    showMsg('signupStep2Msg', friendlyError(e, 'That code is incorrect.'));
  }finally{
    document.getElementById('verifyOtpBtn').disabled = false;
  }
};
document.getElementById('resendOtpBtn').onclick = async ()=>{
  hideMsg('signupStep2Msg');
  try{
    await sendOtpCodeFn({ email: signupEmail });
    showMsg('signupStep2Msg', 'Sent a new code.', '#2F7A4F');
  }catch(e){
    showMsg('signupStep2Msg', friendlyError(e, 'Could not resend the code.'));
  }
};

// ---- Step 3: create the account, or reset the password ----
document.getElementById('createAccountBtn').onclick = async ()=>{
  hideMsg('signupStep3Msg');
  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('newPasswordConfirm').value;
  if(password.length < 8){ showMsg('signupStep3Msg', 'Password must be at least 8 characters.'); return; }
  if(password !== confirm){ showMsg('signupStep3Msg', 'Passwords do not match.'); return; }
  try{
    document.getElementById('createAccountBtn').disabled = true;
    const fn = authFlowMode === 'reset' ? resetPasswordFn : createAccountFn;
    const res = await fn({ email: signupEmail, password });
    await auth.signInWithCustomToken(res.data.token);
    // onAuthStateChanged below picks it up from here
  }catch(e){
    showMsg('signupStep3Msg', friendlyError(e, 'Could not complete this. Please try again.'));
  }finally{
    document.getElementById('createAccountBtn').disabled = false;
  }
};

// ---- First-ever sign-in only: save a name once ----
document.getElementById('saveNameBtn').onclick = async ()=>{
  const name = document.getElementById('loginName').value.trim();
  if(!name) return;
  board.users.push({ email: pendingNewUserEmail, name, firstLoginAt: Date.now(), tutorialsSeen: [] });
  await saveBoard();
  currentUser = { email: pendingNewUserEmail, name };
  pendingNewUserEmail = null;
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('whoDisplay').textContent = `Signed in as ${currentUser.name}`;
  handleLanding();
};

document.getElementById('switchUserBtn').onclick = async ()=>{
  await auth.signOut();
  if(unsubscribeBoard){ unsubscribeBoard(); unsubscribeBoard = null; }
  currentUser = null;
  pendingNewUserEmail = null;
  signupEmail = null;
  authFlowMode = 'signup';
  board = null;
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('signupEmail').value = '';
  document.getElementById('otpInput').value = '';
  document.getElementById('newPassword').value = '';
  document.getElementById('newPasswordConfirm').value = '';
  document.getElementById('loginName').value = '';
  hideMsg('loginMsg');
  showAuthStep('login');
  document.getElementById('loginGate').style.display = 'flex';
};

let pendingScopedLanding = null; // { siteId, stageId } — set once a scoped assignment link redeems successfully
let scopedLinkChecked = false;   // becomes true once the attempt (if any) finishes, success or fail

async function tryRedeemScopedLink(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if(!token){ scopedLinkChecked = true; return; }
  try{
    const res = await redeemScopedLinkFn({ token });
    pendingScopedLanding = { siteId: res.data.siteId, stageId: res.data.stageId };
    window.history.replaceState({}, document.title, window.location.pathname);
    await auth.signInWithCustomToken(res.data.token);
  }catch(e){
    showMsg('loginMsg', friendlyError(e, 'That link is no longer valid. Please sign in normally.'));
    window.history.replaceState({}, document.title, window.location.pathname);
  }finally{
    scopedLinkChecked = true;
  }
}

auth.onAuthStateChanged(async (user)=>{
  if(user){
    const email = (user.email || '').toLowerCase();
    subscribeToBoard();
    // wait for the first Firestore snapshot to populate `board`
    while(!board){ await new Promise(r=>setTimeout(r, 80)); }
    const existing = board.users.find(u=>u.email===email);
    if(existing){
      currentUser = { email, name: existing.name };
      if(!activeStore || !getSite(activeStore) || !canSeeSite(getSite(activeStore))){ const vs = visibleSites(); activeStore = vs.length ? vs[0].id : null; }
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('whoDisplay').textContent = `Signed in as ${currentUser.name}`;
      handleLanding();
    } else {
      pendingNewUserEmail = email;
      showAuthStep('enterName');
      document.getElementById('loginGate').style.display = 'flex';
    }
  } else {
    if(!scopedLinkChecked){
      return; // still trying a scoped link — don't flash the login gate while that's in flight
    }
    showAuthStep('login');
    document.getElementById('loginGate').style.display = 'flex';
  }
});
tryRedeemScopedLink();

function handleLanding(){
  if(pendingScopedLanding && board.siteData[pendingScopedLanding.siteId]){
    activeStore = pendingScopedLanding.siteId;
    currentView = 'tracker';
    trackerSubView = 'detail';
    render();
    openSheet(pendingScopedLanding.stageId);
    pendingScopedLanding = null;
    return; // arrived via a scoped assignment link — don't interrupt with a tutorial either
  }
  const urlParams = new URLSearchParams(window.location.search);
  const linkSite = urlParams.get('site');
  const linkStage = urlParams.get('stage');
  if(linkSite && linkStage && board.siteData[linkSite]){
    activeStore = linkSite;
    currentView = 'tracker';
    trackerSubView = 'detail';
    render();
    openSheet(parseInt(linkStage));
    return; // arriving via a direct task link — don't interrupt with a tutorial
  }
  const mine = findMyOpenAssignments();
  if(mine.length === 1){
    goToAssignment(mine[0]);
  } else if(mine.length > 1){
    currentView = 'myTasks';
    render();
    maybeStartTutorials();
  } else {
    currentView = 'tracker';
    trackerSubView = 'list';
    render();
    maybeStartTutorials();
  }
}
</script>
