    el.className = '';
    el.innerHTML = `<div class="empty-note">No sites yet. Go to <b>Admin</b> to add the first site — its tracker starts the moment you add it.</div>`;
    return;
  }
  recompute(activeStore);
  recalculateDueDates(activeStore);
  const s = storeState(activeStore);
  const site = getSite(activeStore);
  el.className = '';
  let html = '';

  const overdueStages = STAGES.filter(st=>{
    const d = s.stageData[st.id];
    const t = stageTiming(st, d, activeStore);
    if(t && t.isOverdue) return true;
    return !t && d.dueDate && Date.now() > d.dueDate && d.status !== 'done' && d.status !== 'skip';
  });
  if(overdueStages.length){
    html += `<div class="delay-banner">` + overdueStages.map(st=>{
      const d = s.stageData[st.id];
      const t = stageTiming(st, d, activeStore);
      const reasonBit = d.delayReason
        ? `Reason logged: "${escapeAndLinkify(d.delayReason)}" — ${escapeHtml(d.delayLoggedBy)}`
        : `No reason logged yet — tap the stage to log one.`;
      if(t) return `<div>⚠ Stage ${st.num} (${escapeHtml(st.title)}) is ${t.overdueDays}d past its ${fmtTatRange(t.tatMin, t.tatMax)} TAT. ${reasonBit}</div>`;
      const dueDays = Math.floor((Date.now()-d.dueDate)/86400000);
      return `<div>⚠ Stage ${st.num} (${escapeHtml(st.title)}) hasn't started yet and is already ${dueDays}d past its projected due date. ${reasonBit}</div>`;
    }).join('') + `</div>`;
  }

  html += `<div style="display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px;font-size:12px;">
    <button type="button" id="viewModeVertical" class="switch-link" style="text-decoration:none;${stageViewMode==='vertical'?'font-weight:800;text-decoration:underline;':''}">☰ List</button>
    <span style="color:var(--sub);">·</span>
    <button type="button" id="viewModeHorizontal" class="switch-link" style="text-decoration:none;${stageViewMode==='horizontal'?'font-weight:800;text-decoration:underline;':''}">⬌ Timeline</button>
  </div>`;

  // Section sub-tabs — a page with 40+ stages is unwieldy to scroll through in one go,
  // so any stage carrying a `section` label gets grouped into a tappable sub-tab here.
  // Purely a display filter, same principle as the page split above: recompute/TAT/due-
  // dates already ran against the full STAGES array, this only narrows what's shown.
  const pageStages = STAGES.filter(st=>(st.page||'project-flow')===activePage);
  const sectionsInOrder = [...new Set(pageStages.map(st=>st.section).filter(Boolean))];
  if(sectionsInOrder.length){
    if(!activeSection || !sectionsInOrder.includes(activeSection)) activeSection = sectionsInOrder[0];
    html += `<div class="store-tabs" style="padding-bottom:10px;">` + sectionsInOrder.map(sec=>{
      const secStages = pageStages.filter(st=>st.section===sec);
      const doneCount = secStages.filter(st=>{ const d=s.stageData[st.id]; return d && (d.status==='done'||d.status==='skip'); }).length;
      return `<button class="store-tab ${sec===activeSection?'active':''}" data-section="${escapeHtml(sec)}">${escapeHtml(sec)} <span style="opacity:.7;">${doneCount}/${secStages.length}</span></button>`;
    }).join('') + `</div>`;
  } else {
    activeSection = null; // this page has no sections defined — show everything, same as before
  }

  // Filtered to whichever tab (and, if this page uses them, section) is active —
  // Project Flow and Execution are one continuous sequence underneath (recompute/TAT/
  // due-dates above already ran against the FULL STAGES array, unfiltered), this only
  // decides which subset of that sequence actually renders as cards right now.
  const stageMeta = pageStages.filter(st=>!activeSection || st.section===activeSection).map(st=>{
    const d = s.stageData[st.id];
    if(d.status === 'skip') return { st, d, skip:true };
    const t = stageTiming(st, d, activeStore);
    let dotCls = d.status;
    const notStartedButPastDue = !t && d.dueDate && Date.now() > d.dueDate && d.status !== 'done' && d.status !== 'skip';
    if((t && t.isOverdue) || notStartedButPastDue) dotCls = 'overdue';
    let dotContent = d.status==='done' ? '✓' : (d.status==='declined' ? '↩' : ((t && t.isOverdue) || notStartedButPastDue ? '!' : st.num));
    let statusLabel = {pending:'Pending', active:'In progress', done:'Complete', declined:'Sent back', awaiting_approval:'Awaiting approval'}[d.status];
    const defaultTat = effectiveTat(activeStore, 'stage_'+st.id, st.tatMinDays, st.tatMaxDays, st.tatByFormat);
    let slaBit = `TAT ${fmtTatRange(defaultTat.min, defaultTat.max)}`;
    if(t) slaBit = t.isOverdue ? `Day ${t.elapsedDays} — ${t.overdueDays}d over TAT` : `Day ${t.elapsedDays} of ${fmtTatRange(t.tatMin, t.tatMax)} TAT`;
    else if(notStartedButPastDue) slaBit = `${Math.floor((Date.now()-d.dueDate)/86400000)}d overdue — not started yet`;
    else if(d.dueDate) slaBit = `Projected due ${new Date(d.dueDate).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}`;
    let ownerText = st.owner;
    if(st.id === 2) ownerText = st.owner + ` · target ${FORMATS[site.format].sizeText}`;
    const assignedNames = (d.assignedTo||[]).map(id=>{
      const p = board.stakeholders.find(x=>x.id===id);
      return p ? p.name : null;
    }).filter(Boolean);
    if(assignedNames.length) ownerText = `Assigned: ${assignedNames.join(', ')}`;
    return { st, d, t, dotCls, dotContent, statusLabel, slaBit, ownerText, skip:false };
  });

  const stageCardHtml = (m) => `<div class="stage-row" data-stage="${m.st.id}">
      <div class="stage-dot ${m.dotCls}">${m.dotContent}</div>
      <div class="stage-card ${m.d.status} ${m.t&&m.t.isOverdue?'overdue-card':''}">
        <div class="stage-top">
          <div>
            <span class="stage-badge ${m.st.type}">${m.st.type}</span>
            <div class="stage-title">${m.st.num} · ${escapeHtml(m.st.title)}</div>
          </div>
          <div class="stage-dur ${m.t&&m.t.isOverdue?'overdue-dur':''}">${m.slaBit}</div>
        </div>
        <div class="stage-owner">${escapeHtml(m.ownerText)}</div>
        <div class="stage-status ${m.t&&m.t.isOverdue?'overdue':m.d.status}">${m.statusLabel}${m.d.updatedBy ? ' · '+escapeHtml(m.d.updatedBy)+' · '+timeAgo(m.d.updatedAt) : ''}</div>
      </div>
    </div>`;

  if(stageMeta.length === 0){
    html += `<div class="empty-note">No ${activePage==='execution'?'Execution':'Project Flow'} stages yet — add some in Templates → Stage Editor (set a stage's Page to ${activePage==='execution'?'Execution':'Project Flow'}).</div>`;
  } else if(stageViewMode === 'horizontal'){
    html += `<div style="display:flex;overflow-x:auto;gap:4px;padding:8px 2px 14px;-webkit-overflow-scrolling:touch;">`;
    stageMeta.forEach(m=>{
      if(m.skip){
        html += `<div style="flex:none;text-align:center;width:52px;">
          <div class="stage-dot" style="margin:0 auto;">–</div>
          <div style="font-size:9px;color:var(--sub);margin-top:4px;">${m.st.num}</div>
        </div>`;
        return;
      }
      html += `<div data-stage-h="${m.st.id}" style="flex:none;text-align:center;width:52px;cursor:pointer;">
        <div class="stage-dot ${m.dotCls}" style="margin:0 auto;">${m.dotContent}</div>
        <div style="font-size:9px;color:var(--sub);margin-top:4px;">${m.st.num}</div>
      </div>`;
    });
    html += `</div>`;
    const currentMeta = stageMeta.find(m=>!m.skip && m.st.id === s.current) || stageMeta.find(m=>!m.skip);
    if(currentMeta){
      html += `<div class="progress-line" style="margin-bottom:6px;">Showing the current stage — tap any dot above to view a different one.</div>`;
      html += stageCardHtml(currentMeta);
    }
  } else {
    html += '<div class="rail-line"></div>';
    // Consecutive stages sharing the same parallelGroup render side-by-side in one row
    // instead of one after another, since they represent work genuinely happening at
    // the same time — not a strict sequence. A group only actually renders as parallel
    // if 2+ of its members are non-skipped for this site (e.g. Chennai skips the
    // Bangalore-only Electrical Load stage, so its "parallel partner" just renders alone).
    let i = 0;
    while(i < stageMeta.length){
      const m = stageMeta[i];
      if(!m.skip && m.st.parallelGroup){
        const group = [m];
        let j = i+1;
        while(j < stageMeta.length && !stageMeta[j].skip && stageMeta[j].st.parallelGroup === m.st.parallelGroup){
          group.push(stageMeta[j]); j++;
        }
        if(group.length > 1){
          html += `<div class="stage-row">
            <div class="stage-dot" style="background:var(--gold);color:#fff;">∥</div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:10.5px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;">Running in parallel</div>
              <div style="display:flex;gap:8px;">
                ${group.map(gm => `<div class="stage-card ${gm.d.status} ${gm.t&&gm.t.isOverdue?'overdue-card':''}" data-stage="${gm.st.id}" style="flex:1;min-width:0;padding:10px;cursor:pointer;">
                  <span class="stage-badge ${gm.st.type}" style="font-size:9px;">${gm.st.type}</span>
                  <div class="stage-title" style="font-size:12px;margin-top:4px;">${gm.st.num} · ${escapeHtml(gm.st.title)}</div>
                  <div class="stage-dur ${gm.t&&gm.t.isOverdue?'overdue-dur':''}" style="font-size:9.5px;margin-top:4px;">${gm.slaBit}</div>
                  <div class="stage-status ${gm.t&&gm.t.isOverdue?'overdue':gm.d.status}" style="font-size:9.5px;">${gm.statusLabel}</div>
                </div>`).join('')}
              </div>
            </div>
          </div>`;
          i = j;
          continue;
        }
      }
      if(m.skip){
        html += `<div class="stage-row"><div class="stage-dot">–</div>
          <div class="stage-card skip"><div class="stage-title">${m.st.num} · ${escapeHtml(m.st.title)}</div>
          <div class="stage-owner">Not applicable — Chennai</div></div></div>`;
        i++;
        continue;
      }
      html += stageCardHtml(m);
      if(m.d.status === 'declined' && m.st.reworkTo){
        html += `<div class="restart-note">↩ restarted to Stage ${STAGES.find(x=>x.id===m.st.reworkTo).num} — ${escapeHtml(STAGES.find(x=>x.id===m.st.reworkTo).title)}</div>`;
      }
      i++;
    }
  }

  el.innerHTML = html;
  el.querySelectorAll('[data-section]').forEach(btn=>{
    btn.onclick = ()=>{ activeSection = btn.dataset.section; render(); };
  });
  el.querySelectorAll('.stage-row[data-stage], .stage-card[data-stage]').forEach(row=>{
    row.onclick = ()=> openSheet(parseInt(row.dataset.stage));
  });
  el.querySelectorAll('[data-stage-h]').forEach(row=>{
    row.onclick = ()=> openSheet(parseInt(row.dataset.stageH));
  });
  const vBtn = document.getElementById('viewModeVertical');
  const hBtn = document.getElementById('viewModeHorizontal');
  if(vBtn) vBtn.onclick = ()=>{ stageViewMode='vertical'; try{localStorage.setItem('nsoStageViewMode','vertical');}catch(e){} render(); };
  if(hBtn) hBtn.onclick = ()=>{ stageViewMode='horizontal'; try{localStorage.setItem('nsoStageViewMode','horizontal');}catch(e){} render(); };
}

// Shared approval-panel rendering — used by any generic requiresApproval stage AND by
// P&L (stage 3), which needs its own specialized financial form to keep rendering even
// when approval is turned on for it, rather than being replaced by this panel outright.
// Kept as one function so the actual security-relevant markup (who can toggle a seat,
// the ground-work gate) only exists in one place, not duplicated and risking drift.
// Notes, everywhere in the app — a running, attributed log instead of one shared box
// that whoever saves last silently overwrites. Every entry keeps who wrote it and when,
// so if Ayush and Kapil both update the same stage, both notes survive, lined up in
// order, rather than one replacing the other with no trace.
function renderNotesSection(d){
  d.notesLog = d.notesLog || [];
  let html = `<details class="collapse-group"><summary>Notes <span style="font-weight:400;color:var(--sub);font-size:11px;">${d.notesLog.length}</span></summary>`;
  if(d.notesLog.length){
    html += `<div class="log">` + d.notesLog.slice().reverse().map(n=>`
      <div class="log-entry">
        <div>${escapeHtml(n.text)}</div>
        <div class="approver-stamp">${escapeHtml(n.by)} · ${timeAgo(n.at)}</div>
      </div>`).join('') + `</div>`;
  }
  html += `<div class="field" style="margin-top:8px;"><textarea id="notesField" placeholder="Add a note..."></textarea></div>
    <div class="btn-row"><button class="btn ghost" id="addNoteBtn">Add note</button></div>
  </details>`;
  return html;
}

function renderApprovalPanelHtml(st, d, myId){
  let html = '';
  const needsGroundWorkFirst = st.requiresAssignment && !d.groundWorkCompleted;
  if(needsGroundWorkFirst){
    const assignedNames = (d.assignedTo||[]).map(id=>{ const p = board.stakeholders.find(x=>x.id===id); return p?p.name:null; }).filter(Boolean);
    const iAmAssigned = myId && (d.assignedTo||[]).includes(myId);
    html += `<div class="warn" style="background:var(--task-bg);border-color:var(--line);color:var(--ink);">
      This stage needs the ground work marked complete before it goes to approval.<br>
      ${assignedNames.length ? `Assigned: ${escapeHtml(assignedNames.join(', '))}` : 'Nobody assigned yet.'}
    </div>`;
    if(iAmAssigned){
      html += `<div class="btn-row"><button class="btn primary" id="markGroundWorkBtn">Mark ground work complete</button></div>`;
    }
    html += renderNotesSection(d);
    return html;
  }
  if(st.requiresAssignment && d.groundWorkCompleted){
    html += `<div class="progress-line" style="margin-bottom:8px;">Ground work completed by ${escapeHtml(d.groundWorkCompletedBy||'someone')} · ${timeAgo(d.groundWorkCompletedAt)}</div>`;
  }
  d.approvals = d.approvals || {};
  const panel = ((board.stageApprovers && board.stageApprovers[st.id]) || []).map(id=>board.stakeholders.find(x=>x.id===id)).filter(Boolean);
  const approvedCount = panel.filter(p=>d.approvals[p.id]).length;
  if(panel.length === 0){
    html += `<div class="warn">⚠ No approvers configured for this stage yet. Add them in Admin → Approvers.</div>`;
  }
  html += `<div class="approver-list">` + panel.map(p=>{
    const rec = d.approvals[p.id];
    const canToggle = p.id === myId; // only the actual seat-holder — no Admin override, by design
    return `<div class="approver">
      <div class="approver-name">${escapeHtml(p.name)} <span class="level-badge">${levelLabel(p.level)}</span>
        ${rec ? `<div class="approver-stamp">✓ confirmed by ${escapeHtml(rec.by)} · ${timeAgo(rec.at)}</div>` : ''}</div>
      <div class="check ${rec?'on':''}" ${canToggle ? `data-approver="${p.id}"` : ''} style="${canToggle?'':'cursor:default;opacity:0.7;'}" title="${canToggle?'':'Only '+escapeHtml(p.name)+' can sign off this seat'}">${rec?'✓':''}</div>
    </div>`;
  }).join('') + `</div>
  <div class="progress-line">${approvedCount} / ${panel.length} signed off${d.status==='done' ? ' — all approved' : ''}</div>`;
  html += renderNotesSection(d);
  if(d.status !== 'done'){
    html += `<div class="btn-row">
      <button class="btn decline" id="declineBtn">Decline — send back</button>
      <button class="btn primary" id="closeBtn">Close</button>
    </div>`;
  }else{
    html += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
  }
  return html;
}

function openSheet(stageId){
  const st = STAGES.find(x=>x.id===stageId);
  const s = storeState(activeStore);
  const site = getSite(activeStore);
  const d = s.stageData[stageId];
  const backdrop = document.getElementById('sheetBackdrop');
  const body = document.getElementById('sheetBody');

  let inner = `
    <button id="stickyCloseBtn" class="sticky-close-x" aria-label="Close">✕</button>
    <span class="stage-badge ${st.type} sheet-badge">${st.type}</span>
    <h2>${st.num} · ${escapeHtml(st.title)}</h2>
    <div class="meta">${escapeHtml(st.owner)} · ${fmtTatRange(effectiveTat(activeStore, 'stage_'+st.id, st.tatMinDays, st.tatMaxDays, st.tatByFormat).min, effectiveTat(activeStore, 'stage_'+st.id, st.tatMinDays, st.tatMaxDays, st.tatByFormat).max)} TAT</div>
    <div class="desc">${escapeHtml(st.desc)}${st.id===2 ? ` Preferred size for this site: <b>${FORMATS[site.format].sizeText}</b> (${FORMATS[site.format].label}).` : ''}</div>
  `;
  const myStakeholder = findMyStakeholder();
  const myId = myStakeholder ? myStakeholder.id : null;
  const assignedIds = d.assignedTo || [];
  const assignedList = assignedIds.map(id=>board.stakeholders.find(p=>p.id===id)).filter(Boolean);

  inner += `<details class="collapse-group" open><summary>Assigned to <span style="font-weight:400;color:var(--sub);font-size:11px;">${assignedList.length ? assignedList.length+' people' : 'nobody yet'}</span></summary>`;
  inner += `<div class="field">`;
  if(assignedList.length){
    inner += `<div class="approver-list">` + assignedList.map(p=>`
      <div class="approver">
        <div class="approver-name">${escapeHtml(stakeholderLabel(p))}</div>
        ${isAdmin() ? `<button class="remove-x" data-remove-assignee="${p.id}">✕</button>` : ''}
      </div>`).join('') + `</div>`;
  } else {
    inner += `<div class="progress-line">Nobody assigned yet.</div>`;
  }
  if(isAdmin()){
    inner += personPickerHtml('stageAssignAdd', board.stakeholders.filter(p=>!assignedIds.includes(p.id)), '+ search and add someone');
  }
  inner += `</div>`;
  if(myId && assignedIds.includes(myId)){
    inner += `<div class="field"><label>Transfer my part to</label>
      ${personPickerHtml('stageTransferTo', board.stakeholders.filter(p=>p.id!==myId), 'Search and select someone')}</div>
      <div class="btn-row"><button class="btn decline" id="stageTransferBtn">Transfer my part</button></div>`;
  }
  inner += `</details>`;
  if(st.warning) inner += `<div class="warn">⚠ ${escapeHtml(st.warning)}</div>`;

  const t = stageTiming(st, d, activeStore);
  if(t){
    inner += `<div class="meta" style="margin-top:8px;">Day ${t.elapsedDays} of ${fmtTatRange(t.tatMin, t.tatMax)} TAT${t.isOverdue ? ` — <span style="color:#C13E3E;font-weight:700;">${t.overdueDays}d over</span>` : ''}</div>`;
  }
  if(t && t.isOverdue){
    inner += `<div class="warn">⚠ This stage is ${t.overdueDays} day(s) past its TAT.
      ${d.delayReason ? `Reason logged: "${escapeAndLinkify(d.delayReason)}" — ${escapeHtml(d.delayLoggedBy)}, ${timeAgo(d.delayLoggedAt)}` : ''}
    </div>`;
    inner += `<div class="field"><label>${d.delayReason?'Update delay reason':'Log reason for delay'}</label>
      <textarea id="delayReasonField" placeholder="e.g. landlord unresponsive, awaiting legal docs...">${escapeHtml(d.delayReason||'')}</textarea></div>
      <div class="btn-row"><button class="btn decline" id="logDelayBtn">Log delay</button></div>`;
  }

  d.attachments = d.attachments || [];
  inner += `<details class="collapse-group"><summary>Attachments <span style="font-weight:400;color:var(--sub);font-size:11px;">${d.attachments.length ? d.attachments.length+' files' : 'none yet'}</span></summary>`;
  if(d.attachments.length){
    inner += `<div class="approver-list">` + d.attachments.map((a,i)=>{
      const canDelete = a.uploadedBy === getWho() || isAdmin();
      const thumb = isImageFile(a.name)
        ? `<img src="${a.url}" class="attach-thumb" data-preview="${i}" alt="">`
        : `<div class="attach-file-icon" data-preview="${i}">📄</div>`;
      return `<div class="approver attachment-row">
        ${thumb}
        <div class="approver-name" data-preview="${i}" style="cursor:pointer;">${escapeHtml(a.name)}
          <div class="approver-stamp">${escapeHtml(a.uploadedBy)} · ${timeAgo(a.uploadedAt)}</div></div>
        ${canDelete ? `<button class="remove-x" data-del-attachment="${i}">✕</button>` : ''}
      </div>`;
    }).join('') + `</div>`;
  } else {
    inner += `<div class="progress-line">No files yet.</div>`;
  }
  inner += `<div class="field"><input id="attachmentFile" type="file" multiple></div>
    <div class="progress-line" style="margin-top:0;">Select multiple files at once if you want — each uploads and gets its own entry. Files over 25MB will still upload here, but won't be attached to the email trail — the update email will just link back to the project instead.</div>
    <div class="btn-row"><button class="btn ghost" id="uploadAttachmentBtn">Upload</button></div>
    <div id="uploadStatus" class="progress-line"></div>`;
  inner += `</details>`;

  d.blockerFlags = d.blockerFlags || [];
  inner += `<details class="collapse-group"><summary>Flag a blocker <span style="font-weight:400;color:var(--sub);font-size:11px;">${d.blockerFlags.length ? d.blockerFlags.length+' flagged' : 'none flagged'}</span></summary>
    <div class="progress-line" style="margin-top:0;">Stuck because of someone else's work? Name them and it'll notify them and their manager.</div>
    <div class="field"><label>Who is blocking you?</label>
      ${personPickerHtml('blockerPerson', board.stakeholders, 'Search and select...')}
    </div>
    <div class="field"><label>Notes</label><textarea id="blockerNote" placeholder="e.g. waiting on sign-off, they're on leave this week"></textarea></div>
    <div class="btn-row"><button class="btn decline" id="flagBlockerBtn">Flag blocker</button></div>`;
  if(d.blockerFlags.length){
    inner += `<div class="log">` + d.blockerFlags.slice(-5).reverse().map(b=>{
      const person = board.stakeholders.find(p=>p.id===b.personId);
      return `Blocked by ${person ? escapeHtml(person.name) : 'someone'}: "${escapeAndLinkify(b.note)}" — flagged by ${escapeHtml(b.by)}, ${timeAgo(b.at)}`;
    }).join('<br>') + `</div>`;
  }
  inner += `</details>`;

  if(st.id === 3){
    d.financials = d.financials || { capex:'', dineInSteady:'', deliverySteady:'', dineInRamp:{}, deliveryRamp:{}, y2GrowthPct:'', y3GrowthPct:'', cogsPct:'', fixedOpex:'', costLines:{} };
    const f = d.financials;
    // Migrate the single-stream model (Month 1 revenue + one index curve) into the new
    // two-channel shape — the old blended curve becomes the Dine-in channel unchanged
    // (M1 was always the 100% reference point there), Delivery starts blank so the
    // total revenue this produces is identical to before until it's split out for real.
    if(f.monthlyIndexByMonth && !f.dineInRamp){
      f.dineInSteady = f.m1Revenue || '';
      f.dineInRamp = Object.assign({1: 100}, f.monthlyIndexByMonth);
      f.deliverySteady = '';
      f.deliveryRamp = {};
      delete f.monthlyIndexByMonth;
      delete f.m1Revenue;
    }
    f.dineInRamp = f.dineInRamp || {};
    f.deliveryRamp = f.deliveryRamp || {};
    const rampRow = (idPrefix, rampObj) => `
      <div style="display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;">
        ${Array.from({length:12}, (_,i)=>i+1).map(m=>`
          <div style="flex:none;width:48px;text-align:center;">
            <div style="font-size:9px;color:var(--sub);margin-bottom:3px;">M${m}</div>
            <input id="${idPrefix}_${m}" type="number" value="${rampObj[m] !== undefined ? rampObj[m] : ''}" placeholder="%" style="width:100%;font-size:11px;padding:6px 3px;text-align:center;">
          </div>`).join('')}
      </div>`;
    inner += `<div class="info-box">${s.capex && s.capex.finalized ? '✓ Tentative CapEx Finalized — see the CapEx tab for full detail (cost-list only).' : 'Tentative CapEx not yet finalized — see the CapEx tab.'}</div>`;
    inner += `
      <div class="field"><label>CAPEX — one-time investment (₹)</label><input id="fx_capex" type="number" value="${f.capex}" placeholder="e.g. 6000000"></div>

      <div class="field"><label>Dine-in — steady-state monthly revenue (₹)</label><input id="fx_dinein_steady" type="number" value="${f.dineInSteady}" placeholder="e.g. 2800000"></div>
      <div class="field">
        <label>Dine-in ramp — % of steady-state each month. Leave later months blank to hold flat at the last value entered.</label>
        ${rampRow('fx_dinein_ramp', f.dineInRamp)}
      </div>

      <div class="field"><label>Delivery — steady-state monthly revenue (₹)</label><input id="fx_delivery_steady" type="number" value="${f.deliverySteady}" placeholder="e.g. 1200000"></div>
      <div class="field">
        <label>Delivery ramp — % of steady-state each month. Leave later months blank to hold flat at the last value entered.</label>
        ${rampRow('fx_delivery_ramp', f.deliveryRamp)}
      </div>

      <div class="field"><label>Year 2 step-up (%)</label><input id="fx_y2" type="number" value="${f.y2GrowthPct}" placeholder="e.g. 15"></div>
      <div class="field"><label>Year 3 step-up (%)</label><input id="fx_y3" type="number" value="${f.y3GrowthPct}" placeholder="e.g. 12"></div>
      <div class="field"><label>COGS (% of revenue)</label><input id="fx_cogs" type="number" value="${f.cogsPct}" placeholder="e.g. 32"></div>
      <div class="field">
        <label>Restaurant costs — monthly (₹)</label>
        ${(board.restaurantCostHeaders||[]).map(h=>`
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;">
            <span style="flex:1.3;font-size:12.5px;color:var(--ink);">${escapeHtml(h.label)}</span>
            <input data-cost-line="${h.id}" type="number" value="${(f.costLines&&f.costLines[h.id]!==undefined)?f.costLines[h.id]:''}" placeholder="Amount" style="flex:1;">
          </div>`).join('')}
        ${(myId && (d.assignedTo||[]).includes(myId)) || isAdmin() ? `<button class="btn ghost" id="addCostLineBtn" style="width:auto;font-size:12px;padding:7px 12px;margin-top:2px;"><span style="margin-right:4px;">+</span>Add cost line</button>` : ''}
      </div>
      <div class="btn-row"><button class="btn ghost" id="calcBtn">Calculate</button></div>
      <div id="fxResults"></div>
      ${renderNotesSection(d)}
    `;
    if(!st.requiresApproval){
      // Unchanged from before approval existed as an option here — exactly the same
      // behavior for every project that hasn't turned this on.
      if(d.status !== 'done'){
        inner += `<div class="btn-row">
          <button class="btn ghost" id="saveFinancialsOnlyBtn">Save only</button>
          <button class="btn primary" id="completeBtn">Save &amp; mark complete</button>
        </div>`;
      }else{
        inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
      }
    } else {
      // Approval turned on for P&L — the numbers still save the same way, but "complete"
      // now means "submit for approval" instead of finishing outright, and the approval
      // panel (shared with every other approval-capable stage) renders below the form.
      const needsGroundWorkFirst = st.requiresAssignment && !d.groundWorkCompleted;
      if(needsGroundWorkFirst){
        inner += `<div class="btn-row">
          <button class="btn ghost" id="saveFinancialsOnlyBtn">Save only</button>
          <button class="btn primary" id="submitForApprovalBtn">Save &amp; submit for approval</button>
        </div>`;
      } else if(d.status !== 'done'){
        inner += `<div class="btn-row"><button class="btn ghost" id="saveFinancialsOnlyBtn">Save only</button></div>`;
      }
      inner += renderApprovalPanelHtml(st, d, myId);
    }
  } else if(st.requiresApproval && st.type !== 'commercial-terms' && st.type !== 'checklist'){
    // Commercial Terms and the Post-LOI checklist have their own dedicated rendering
    // and their own approval mechanisms (per-line for Commercial Terms; none for the
    // checklist) — they must never be caught by the generic approval-panel branch here,
    // regardless of what the Requires Approval checkbox says in Stage Editor. Those two
    // checkboxes are meaningless for these two types and shouldn't have been toggleable
    // on them in the first place (fixed separately below).
    inner += renderApprovalPanelHtml(st, d, myId);
  } else if(st.type === 'gate'){
    inner += `<div class="progress-line">${d.status==='done' ? 'Confirmed by landlord' : 'Awaiting written confirmation'}</div>`;
    if(d.status !== 'done'){
      inner += `<div class="btn-row">
        <button class="btn decline" id="declineBtn">Not confirmed — send back</button>
        <button class="btn primary" id="confirmBtn">Confirm load received</button>
      </div>`;
    }else{
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  } else if(st.type === 'checklist'){
    d.tasks = d.tasks || {}; d.design = d.design || {}; d.delivery = d.delivery || {}; d.finalStage = d.finalStage || {};
    const doneCount = board.postLoiTasks.filter(item=>d.tasks[item.key] && d.tasks[item.key].actualDate).length;
    const overPlanCount = board.postLoiTasks.filter(item=>{
      const rec = d.tasks[item.key];
      if(!rec || !rec.tentativeCompletion || !d.startedAt) return false;
      const tat = effectiveTat(activeStore, 'task_'+item.key, item.tatMinDays, item.tatMaxDays);
      const plannedDays = Math.round((new Date(rec.tentativeCompletion) - d.startedAt) / 86400000);
      return plannedDays > tat.max;
    }).length;

    inner += `<div class="progress-line" style="font-weight:700;color:var(--ink);">${doneCount} / ${board.postLoiTasks.length} execution tasks complete</div>`;
    if(overPlanCount > 0){
      inner += `<div class="warn">⚠ ${overPlanCount} task${overPlanCount>1?'s have':' has'} a tentative completion date beyond its admin-set TAT.</div>`;
    }

    inner += `<details class="collapse-group" open>
      <summary>Execution Tasks (${board.postLoiTasks.length})</summary>`;
    board.postLoiTasks.forEach(item=>{
      const rec = d.tasks[item.key] || { actualDate:'', tentativeCompletion:'', assignedTo:[], by:'', at:0 };
      const done = !!rec.actualDate;
      const tat = effectiveTat(activeStore, 'task_'+item.key, item.tatMinDays, item.tatMaxDays);
      const it = itemTiming(d.startedAt, item.tatMinDays, item.tatMaxDays, item.key, activeStore);
      const slaLabel = it ? (it.isOverdue ? `${it.overdueDays}d over ${fmtTatRange(tat.min, tat.max)}` : `Day ${it.elapsedDays} of ${fmtTatRange(tat.min, tat.max)}`) : fmtTatRange(tat.min, tat.max);
      let plannedDays = null;
      if(rec.tentativeCompletion && d.startedAt){
        plannedDays = Math.round((new Date(rec.tentativeCompletion) - d.startedAt) / 86400000);
      }
      const overPlan = plannedDays !== null && plannedDays > tat.max;
      inner += `<div class="mini-task-card ${done?'done':''} ${(it&&it.isOverdue&&!done)||overPlan?'overdue-card':''}">
        <div class="mini-task-top">
          <div class="mini-task-label">${escapeHtml(item.label)}</div>
          <div class="mini-task-tat ${it&&it.isOverdue?'overdue-dur':''}">${slaLabel}</div>
        </div>
        <div class="field" style="margin-top:8px;"><label>Assigned to</label>
          ${(()=>{
            const myId2 = (findMyStakeholder()||{}).id;
            const ids = rec.assignedTo || [];
            const list = ids.map(id=>board.stakeholders.find(p=>p.id===id)).filter(Boolean);
            let html = list.length ? list.map(p=>`
              <div class="approver" style="padding:5px 0;">
                <div class="approver-name" style="font-size:12px;">${escapeHtml(p.name)}</div>
                ${isAdmin() ? `<button class="remove-x" data-task-remove-assignee="${item.key}|${p.id}">✕</button>` : ''}
              </div>`).join('') : `<div class="progress-line" style="margin:4px 0;">Nobody assigned yet.</div>`;
            if(isAdmin()){
              html += personPickerHtml(`taskAssign_${item.key}`, board.stakeholders.filter(p=>!ids.includes(p.id)), '+ search and add someone');
            }
            if(myId2 && ids.includes(myId2)){
              html += `<div style="margin-top:6px;">` + personPickerHtml(`taskTransfer_${item.key}`, board.stakeholders.filter(p=>p.id!==myId2), 'Search — transfer my part to...') + `</div>
              <button type="button" class="btn ghost" data-task-transfer-btn="${item.key}" style="margin-top:4px;width:100%;">Transfer</button>`;
            }
            return html;
          })()}
        </div>
        <div class="mini-task-row">
          <div style="flex:1;min-width:130px;">
            <label style="display:block;font-size:10px;color:var(--sub);margin-bottom:3px;">Tentative completion</label>
            ${dateFieldWithClear(`task_tcomplete_${item.key}`, rec.tentativeCompletion)}
          </div>
          <div style="flex:1;min-width:130px;">
            <label style="display:block;font-size:10px;color:var(--sub);margin-bottom:3px;">Actual completion</label>
            ${dateFieldWithClear(`task_actual_${item.key}`, rec.actualDate)}
          </div>
        </div>
        ${overPlan ? `<div class="mini-task-flag">⚠ Tentative completion is ${plannedDays}d out — exceeds ${tat.max}d TAT by ${plannedDays-tat.max}d</div>` : ''}
        ${done ? `<div class="approver-stamp">${escapeHtml(rec.by)} · ${timeAgo(rec.at)}</div>` : ''}
      </div>`;
    });
    inner += `</details>`;

    inner += `<details class="collapse-group">
      <summary>Design Details (${STAGE11_DESIGN.length})</summary>
      <div class="progress-line" style="margin-top:0;">One-time specs — no TAT</div>`;
    STAGE11_DESIGN.forEach(f=>{
      if(f.dateTriplet){
        inner += renderDateTriplet('dsn', f.key, f.label, d.design[f.key]);
      } else {
        inner += `<div class="field"><label>${escapeHtml(f.label)}</label><input id="dsn_${f.key}" type="${f.type||'text'}" value="${escapeHtml(d.design[f.key]||'')}"></div>`;
      }
    });
    inner += `</details>`;

    inner += `<details class="collapse-group">
      <summary>Equipment Delivery Schedule (${board.postLoiDelivery.length})</summary>
      <div class="progress-line" style="margin-top:0;">No TAT — tentative delivery date and actual delivery date</div>`;
    board.postLoiDelivery.forEach(f=>{
      inner += renderDatePair('dlv', f.key, f.label, d.delivery[f.key], 'Tentative delivery date', 'Actual delivery date');
    });
    inner += `</details>`;

    inner += `<details class="collapse-group">
      <summary>Final Stage (${STAGE11_FINAL.length})</summary>`;
    STAGE11_FINAL.forEach(f=>{
      if(f.dateTriplet){
        inner += renderDateTriplet('fin', f.key, f.label, d.finalStage[f.key]);
      } else {
        inner += `<div class="field"><label>${escapeHtml(f.label)}</label><input id="fin_${f.key}" type="${f.type||'text'}" value="${escapeHtml(d.finalStage[f.key]||'')}"></div>`;
      }
    });
    inner += `</details>`;

    inner += renderNotesSection(d);
    inner += `<div class="btn-row"><button class="btn primary" id="saveChecklistBtn">Save details</button></div>`;
    if(d.status === 'done'){
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  } else if(st.type === 'commercial-terms'){
    d.commercialTerms = d.commercialTerms || {};
    d.commercialTermsApprovals = d.commercialTermsApprovals || {};
    const fields = board.commercialTermsFields || [];
    const requiredFields = fields.filter(f=>f.approvalRequired !== false);
    const ctApprovers = (board.stageApprovers && board.stageApprovers[st.id]) || [];
    const iAmCtApprover = myId && ctApprovers.includes(myId);
    const approvedCount = requiredFields.filter(f=>d.commercialTermsApprovals[f.id]).length;
    if(ctApprovers.length === 0 && requiredFields.length){
      inner += `<div class="warn">⚠ No approvers configured for this stage yet. Add them in Admin → Approvers.</div>`;
    }
    inner += `<details class="collapse-group" open><summary>Commercial Terms (${fields.length} fields) <span style="font-weight:400;color:var(--sub);font-size:11px;">${approvedCount}/${requiredFields.length} approved</span></summary>`;
    fields.forEach(f=>{
      const val = d.commercialTerms[f.id] || '';
      const needsApproval = f.approvalRequired !== false;
      const rec = needsApproval ? d.commercialTermsApprovals[f.id] : null;
      const canToggle = needsApproval && iAmCtApprover && (!rec || rec.byId === myId); // any approver can approve; only that same approver can undo it
      inner += `<div class="field" style="border:1px solid ${rec?'var(--green,#2F7A4F)':'var(--line)'};border-radius:8px;padding:10px;margin-bottom:8px;">
        <label>${escapeHtml(f.label)}</label>`;
      if(f.type === 'textarea'){
        inner += `<textarea data-ct-field="${f.id}">${escapeHtml(val)}</textarea>`;
      } else {
        inner += `<input data-ct-field="${f.id}" type="${f.type==='number'?'number':'text'}" value="${escapeHtml(val)}">`;
      }
      if(needsApproval){
        inner += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
          <span style="font-size:11px;color:var(--sub);">${rec ? `✓ Approved by ${escapeHtml(rec.by)} · ${timeAgo(rec.at)}` : 'Not yet approved'}</span>
          ${canToggle ? `<button class="btn ghost" data-ct-approve="${f.id}" style="width:auto;font-size:11px;padding:5px 10px;">${rec?'Undo':'Approve'}</button>` : ''}
        </div>`;
      }
      inner += `</div>`;
    });
    inner += `</details>`;
    inner += `<div class="btn-row"><button class="btn ghost" id="saveCommercialTermsBtn">Save terms</button></div>`;
    inner += renderNotesSection(d);
    if(d.status === 'done'){
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  } else {
    inner += renderNotesSection(d);
    if(d.status !== 'done'){
      inner += `<div class="btn-row">
        <button class="btn primary" id="completeBtn">Mark complete</button>
      </div>`;
    }else{
      inner += `<div class="btn-row"><button class="btn ghost" id="closeBtn">Close</button></div>`;
    }
  }

  if(s.log.filter(l=>l.stageId===stageId).length){
    inner += `<div class="log">` + s.log.filter(l=>l.stageId===stageId).slice(-5).reverse().map(l=>`${escapeHtml(l.text)} — ${timeAgo(l.at)}`).join('<br>') + `</div>`;
  }

  body.innerHTML = inner;
  backdrop.classList.add('open');
  document.getElementById('stickyCloseBtn').onclick = closeSheet;
  wireSheetActions(st, s, d);
  if(st.id === 3) renderFxResults(d.financials);
}

function readFxInputs(){
  const dineInRamp = {};
  const deliveryRamp = {};
  for(let m=1; m<=12; m++){
    const dEl = document.getElementById(`fx_dinein_ramp_${m}`);
    if(dEl) dineInRamp[m] = dEl.value;
    const yEl = document.getElementById(`fx_delivery_ramp_${m}`);
    if(yEl) deliveryRamp[m] = yEl.value;
  }
  const costLines = {};
  document.querySelectorAll('[data-cost-line]').forEach(inp=>{
    costLines[inp.dataset.costLine] = inp.value;
  });
  return {
    capex: document.getElementById('fx_capex').value,
    dineInSteady: document.getElementById('fx_dinein_steady').value,
    deliverySteady: document.getElementById('fx_delivery_steady').value,
    dineInRamp,
    deliveryRamp,
    y2GrowthPct: document.getElementById('fx_y2').value,
    y3GrowthPct: document.getElementById('fx_y3').value,
    cogsPct: document.getElementById('fx_cogs').value,
    costLines,
  };
}
function renderFxResults(f){
  const el = document.getElementById('fxResults');
  if(!el) return;
  if(!(f.capex && (f.dineInSteady || f.deliverySteady))){
    el.innerHTML = `<div class="progress-line">Fill in CAPEX and at least one channel's steady-state revenue, then Calculate.</div>`;
    return;
  }
  const r = calcProjection(f);
  el.innerHTML = `
    <div class="progress-line" style="font-size:13px;font-weight:700;color:var(--ink);margin-top:14px;">
      Payback: ${r.paybackMonth ? r.paybackMonth+' months' : 'beyond 36 months'} · 3-Yr ROI: ${r.roi3yr.toFixed(0)}%
    </div>
    <table style="width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;">
      <tr style="color:var(--sub);text-align:left;"><th style="padding:4px 0;">Year</th><th>Revenue</th><th>EBITDA</th><th>EBITDA %</th></tr>
      ${r.y.map((yy,i)=>`<tr style="border-top:1px solid var(--line);">
        <td style="padding:5px 0;font-weight:600;">Y${i+1}</td><td>${fmtINR(yy.rev)}</td><td>${fmtINR(yy.ebitda)}</td><td>${yy.ebitdaPct.toFixed(1)}%</td>
      </tr>`).join('')}
      <tr style="border-top:1px solid var(--line);font-weight:700;">
        <td style="padding:5px 0;">Total</td><td>${fmtINR(r.y[0].rev+r.y[1].rev+r.y[2].rev)}</td><td>${fmtINR(r.totalEBITDA)}</td><td>${r.totalEbitdaPct.toFixed(1)}%</td>
      </tr>
    </table>
  `;
  // Persisted so the P&L approval email can show the real calculated margin without
  // the backend needing to replicate this whole ramp-curve calculation independently —
  // one source of truth (this function), read wherever the number is needed.
  f.calcResults = {
    paybackMonth: r.paybackMonth, roi3yr: r.roi3yr, totalEbitdaPct: r.totalEbitdaPct,
    yearlyEbitdaPct: r.y.map(yy=>yy.ebitdaPct), calculatedAt: Date.now(),
  };
}

function wireSheetActions(st, s, d){
  const closeBtn = document.getElementById('closeBtn');
  if(closeBtn) closeBtn.onclick = closeSheet;

  const addSel = document.getElementById('stageAssignAdd');
  if(addSel) addSel.onchange = async ()=>{
    const selectedId = personPickerSelectedId('stageAssignAdd', board.stakeholders.filter(p=>!(d.assignedTo||[]).includes(p.id)));
    if(!selectedId) return;
    d.assignedTo = d.assignedTo || [];
    if(!d.assignedTo.includes(selectedId)) d.assignedTo.push(selectedId);
    d.updatedBy = getWho(); d.updatedAt = Date.now();
    await saveBoard(); render(); openSheet(st.id);
  };
  document.querySelectorAll('[data-remove-assignee]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      d.assignedTo = (d.assignedTo||[]).filter(x=>x!==btn.dataset.removeAssignee);
      d.updatedBy = getWho(); d.updatedAt = Date.now();
      await saveBoard(); render(); openSheet(st.id);
    });
  });
  const transferBtn = document.getElementById('stageTransferBtn');
  if(transferBtn) transferBtn.onclick = withClickLoading(transferBtn, 'Working…', async ()=>{
    const myId = (findMyStakeholder()||{}).id;
    const newId = personPickerSelectedId('stageTransferTo', board.stakeholders.filter(p=>p.id!==myId));
    if(!newId) return;
    const oldPerson = board.stakeholders.find(p=>p.id===myId);
    const newPerson = board.stakeholders.find(p=>p.id===newId);
    d.assignedTo = (d.assignedTo||[]).filter(x=>x!==myId);
    if(!d.assignedTo.includes(newId)) d.assignedTo.push(newId);
    d.updatedBy = getWho(); d.updatedAt = Date.now();
    s.log.push({stageId:st.id, text:`${oldPerson?oldPerson.name:getWho()} transferred their part to ${newPerson?newPerson.name:'someone'}`, at: Date.now()});
    await saveBoard(); render(); openSheet(st.id);
  });

  const flagBlockerBtn = document.getElementById('flagBlockerBtn');
  if(flagBlockerBtn) flagBlockerBtn.onclick = withClickLoading(flagBlockerBtn, 'Working…', async ()=>{
    const personId = personPickerSelectedId('blockerPerson', board.stakeholders);
    const note = document.getElementById('blockerNote').value.trim();
    if(!personId || !note){
      if(!personId) document.getElementById('blockerPerson').focus();
      else document.getElementById('blockerNote').focus();
      return;
    }
    const who = getWho();
    d.blockerFlags = d.blockerFlags || [];
    d.blockerFlags.push({ personId, note, by: who, at: Date.now() });
    const person = board.stakeholders.find(p=>p.id===personId);
    s.log.push({stageId:st.id, text:`Blocker flagged by ${who} — waiting on ${person?person.name:'someone'}`, at: Date.now()});
    await saveBoard(); render(); openSheet(st.id);
  });

  const uploadBtn = document.getElementById('uploadAttachmentBtn');
  const fileInputEl = document.getElementById('attachmentFile');
  if(fileInputEl) fileInputEl.onchange = ()=>{
    const files = Array.from(fileInputEl.files);
    const statusEl = document.getElementById('uploadStatus');
    const oversized = files.filter(f => f.size > 25*1024*1024);
    if(oversized.length){
      const names = oversized.map(f => `"${f.name}" (${(f.size/1024/1024).toFixed(1)}MB)`).join(', ');
      statusEl.textContent = `⚠ Over the 25MB email limit: ${names}. They'll still upload here, but the update email will only link to them, not attach them.`;
    } else if(statusEl){
      statusEl.textContent = files.length > 1 ? `${files.length} files selected.` : '';
    }
  };
  if(uploadBtn) uploadBtn.onclick = withClickLoading(uploadBtn, 'Working…', async ()=>{
    const fileInput = document.getElementById('attachmentFile');
    const files = Array.from(fileInput.files);
    const statusEl = document.getElementById('uploadStatus');
    if(!files.length){ statusEl.textContent = 'Choose at least one file first.'; return; }
    d.attachments = d.attachments || [];
    let uploaded = 0;
    for(const file of files){
      const oversized = file.size > 25*1024*1024;
      statusEl.textContent = `Uploading ${uploaded+1} of ${files.length}${oversized ? ' (over 25MB — won\'t be attached to the email, just linked)' : ''}...`;
      try{
        const path = `sites/${activeStore}/stage${st.id}/${Date.now()}_${file.name}`;
        const ref = storage.ref(path);
        await ref.put(file);
        const url = await ref.getDownloadURL();
        d.attachments.push({ name: file.name, url, path, uploadedBy: getWho(), uploadedAt: Date.now(), sizeBytes: file.size, oversized });
        uploaded++;
      }catch(e){
        statusEl.textContent = `Upload failed on "${file.name}": ` + (e.message || e.code);
        if(uploaded > 0) await saveBoard();
        return;
      }
    }
    await saveBoard();
    render(); openSheet(st.id);
  });
  document.querySelectorAll('[data-preview]').forEach(el=>{
    el.onclick = ()=>{
      const att = d.attachments[parseInt(el.dataset.preview)];
      if(att) openFilePreview(att.url, att.name);
    };
  });
  document.querySelectorAll('[data-del-attachment]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      const i = parseInt(btn.dataset.delAttachment);
      const att = d.attachments[i];
      if(!att) return;
      // only the uploader or an admin ever sees this button, but double-check before deleting
      if(!(att.uploadedBy === getWho() || isAdmin())) return;
      if(!window.confirm(`Delete "${att.name}"? This can't be undone.`)) return;
      try{ if(att.path) await storage.ref(att.path).delete(); }catch(e){ console.error('storage delete failed', e); }
      d.attachments.splice(i, 1);
      await saveBoard(); render(); openSheet(st.id);
    });
  });


  const calcBtn = document.getElementById('calcBtn');
  if(calcBtn) calcBtn.onclick = withClickLoading(calcBtn, 'Calculating…', async ()=>{
    const inputs = readFxInputs();
    renderFxResults(inputs);
    // Persist just the calculated summary (not the full re-read inputs — those only
    // save via the explicit Save buttons) so the P&L approval email can show the real
    // margin without the backend re-deriving it independently.
    if(inputs.calcResults){
      d.financials = d.financials || {};
      d.financials.calcResults = inputs.calcResults;
      await saveBoard();
    }
  });

  const addCostLineBtn = document.getElementById('addCostLineBtn');
  if(addCostLineBtn) addCostLineBtn.onclick = withClickLoading(addCostLineBtn, 'Working…', async ()=>{
    const label = window.prompt('New cost line — e.g. Marketing, Insurance, Equipment lease');
    if(!label || !label.trim()) return;
    // Save whatever's already been typed into the other cost lines first, so adding a
    // new one doesn't wipe out numbers the person just entered.
    d.financials = readFxInputs();
    board.restaurantCostHeaders = board.restaurantCostHeaders || [];
    const newHeader = { id: uid('cost'), label: label.trim() };
    board.restaurantCostHeaders.push(newHeader);
    d.financials.costLines = d.financials.costLines || {};
    d.financials.costLines[newHeader.id] = '';
    await saveBoard();
    render(); openSheet(st.id);
  });

  board.postLoiTasks.forEach(item=>{
    const actualInp = document.getElementById(`task_actual_${item.key}`);
    if(actualInp) actualInp.onchange = async ()=>{
      const who = getWho();
      d.tasks = d.tasks || {};
      if(!d.tasks[item.key]) d.tasks[item.key] = { actualDate:'', tentativeCompletion:'', assignedTo:[], by:'', at:0 };
      d.tasks[item.key].actualDate = actualInp.value;
      d.tasks[item.key].by = who; d.tasks[item.key].at = Date.now();
      // Completion is now purely "does this task have an actual date" — no separate
      // checkbox to keep in sync, so this can't drift out of step with the date itself.
      const allDone = board.postLoiTasks.every(t=>d.tasks[t.key] && d.tasks[t.key].actualDate);
      if(allDone && d.status !== 'done'){
        d.status = 'done'; d.updatedBy = who; d.updatedAt = Date.now();
        s.log.push({stageId:st.id, text:`All execution tasks complete, confirmed by ${who}`, at: Date.now()});
      } else if(!allDone && d.status === 'done'){
        d.status = 'active'; // a task's actual date got cleared after completion
      }
      await saveBoard(); render(); openSheet(st.id);
    };
    const tcompleteInp = document.getElementById(`task_tcomplete_${item.key}`);
    if(tcompleteInp) tcompleteInp.onchange = async ()=>{
      d.tasks = d.tasks || {};
      if(!d.tasks[item.key]) d.tasks[item.key] = { actualDate:'', tentativeCompletion:'', assignedTo:[], by:'', at:0 };
      d.tasks[item.key].tentativeCompletion = tcompleteInp.value;
      await saveBoard(); render(); openSheet(st.id);
    };
  });
  board.postLoiTasks.forEach(item=>{
    const key = item.key;
    const assignInput = document.getElementById(`taskAssign_${key}`);
    if(assignInput) assignInput.onchange = async ()=>{
      const ids = (d.tasks && d.tasks[key] && d.tasks[key].assignedTo) || [];
      const selectedId = personPickerSelectedId(`taskAssign_${key}`, board.stakeholders.filter(p=>!ids.includes(p.id)));
      if(!selectedId) return;
      d.tasks = d.tasks || {};
      if(!d.tasks[key]) d.tasks[key] = { done:false, actualDate:'', tentativeStart:'', tentativeEnd:'', assignedTo:[], by:'', at:0 };
      if(!d.tasks[key].assignedTo.includes(selectedId)) d.tasks[key].assignedTo.push(selectedId);
      await saveBoard(); render(); openSheet(st.id);
    };
  });
  document.querySelectorAll('[data-task-remove-assignee]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      const [key, pid] = btn.dataset.taskRemoveAssignee.split('|');
      if(d.tasks[key]) d.tasks[key].assignedTo = (d.tasks[key].assignedTo||[]).filter(x=>x!==pid);
      await saveBoard(); render(); openSheet(st.id);
    });
  });
  document.querySelectorAll('[data-task-transfer-btn]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      const key = btn.dataset.taskTransferBtn;
      const myId2 = (findMyStakeholder()||{}).id;
      const newId = personPickerSelectedId(`taskTransfer_${key}`, board.stakeholders.filter(p=>p.id!==myId2));
      if(!newId) return;
      const oldP = board.stakeholders.find(p=>p.id===myId2);
      const newP = board.stakeholders.find(p=>p.id===newId);
      d.tasks[key].assignedTo = (d.tasks[key].assignedTo||[]).filter(x=>x!==myId2);
      if(!d.tasks[key].assignedTo.includes(newId)) d.tasks[key].assignedTo.push(newId);
      s.log.push({stageId:11, text:`${oldP?oldP.name:getWho()} transferred "${key}" to ${newP?newP.name:'someone'}`, at: Date.now()});
      await saveBoard(); render(); openSheet(st.id);
    });
  });

  const saveChecklistBtn = document.getElementById('saveChecklistBtn');
  if(saveChecklistBtn) saveChecklistBtn.onclick = withClickLoading(saveChecklistBtn, 'Working…', async ()=>{
    const who = getWho();
    function readTriplet(prefix, key){
      const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      return {
        tentativeStart: g(`${prefix}_${key}_tstart`),
        deliveryDate: g(`${prefix}_${key}_delivery`),
        actualDate: g(`${prefix}_${key}_actual`),
      };
    }
    function readPair(prefix, key){
      const g = id => { const el = document.getElementById(id); return el ? el.value : ''; };
      return {
        tentativeDate: g(`${prefix}_${key}_tent`),
        actualDate: g(`${prefix}_${key}_actual`),
      };
    }
    STAGE11_DESIGN.forEach(f=>{
      d.design[f.key] = f.dateTriplet ? readTriplet('dsn', f.key) : document.getElementById('dsn_'+f.key).value.trim();
    });
    board.postLoiDelivery.forEach(f=>{
      d.delivery[f.key] = readPair('dlv', f.key);
    });
    STAGE11_FINAL.forEach(f=>{
      d.finalStage[f.key] = f.dateTriplet ? readTriplet('fin', f.key) : document.getElementById('fin_'+f.key).value.trim();
    });
    d.updatedBy = who; d.updatedAt = Date.now();
    await saveBoard(); render(); openSheet(st.id);
  });

  const saveCommercialTermsBtn = document.getElementById('saveCommercialTermsBtn');
  if(saveCommercialTermsBtn) saveCommercialTermsBtn.onclick = withClickLoading(saveCommercialTermsBtn, 'Working…', async ()=>{
    d.commercialTerms = d.commercialTerms || {};
    document.querySelectorAll('[data-ct-field]').forEach(el=>{
      d.commercialTerms[el.dataset.ctField] = el.value.trim();
    });
    d.updatedBy = getWho(); d.updatedAt = Date.now();
    await saveBoard(); render(); openSheet(st.id);
  });

  document.querySelectorAll('[data-ct-approve]').forEach(btn=>{
    btn.onclick = withClickLoading(btn, 'Working…', async ()=>{
      try{
        const res = await approveCommercialTermsLineFn({ siteId: activeStore, stageId: st.id, fieldId: btn.dataset.ctApprove });
        if(res && res.data){ d.commercialTermsApprovals = res.data.commercialTermsApprovals; d.status = res.data.status; }
        render(); openSheet(st.id);
      }catch(e){ window.alert(e.message || 'Could not update that approval — try again.'); }
    });
  });

  document.querySelectorAll('[data-clear-target]').forEach(btn=>{
    btn.onclick = ()=>{
      const input = document.getElementById(btn.dataset.clearTarget);
      if(input){ input.value = ''; input.dispatchEvent(new Event('change', {bubbles:true})); }
    };
  });

  const logDelayBtn = document.getElementById('logDelayBtn');
  if(logDelayBtn) logDelayBtn.onclick = withClickLoading(logDelayBtn, 'Working…', async ()=>{
    const who = getWho();
    d.delayReason = document.getElementById('delayReasonField').value.trim();
    d.delayLoggedBy = who; d.delayLoggedAt = Date.now();
    s.log.push({stageId:st.id, text:`Delay logged by ${who}: "${d.delayReason}"`, at: Date.now()});
    await saveBoard(); render(); openSheet(st.id);
  });

  document.querySelectorAll('[data-approver]').forEach(chip=>{
    chip.onclick = withClickLoading(chip, 'Working…', async ()=>{
      const pid = chip.dataset.approver;
      const myId = (findMyStakeholder()||{}).id;
      // Defense in depth — only that seat's own person can toggle it, no Admin
      // override. The chip shouldn't even be clickable otherwise, but this guards
      // against any stale DOM state or direct manipulation. The REAL enforcement now
      // lives server-side in toggleApproval — this local check is just a fast, friendly
      // no-op for a UI element that shouldn't be clickable at all in that case.
      if(pid !== myId) return;
      try{
        const res = await toggleApprovalFn({ siteId: activeStore, stageId: st.id });
        // Apply the server's result to the local view immediately — otherwise the UI
        // would sit stale until the Firestore listener's round-trip catches up.
        if(res && res.data){
          d.approvals = res.data.approvals;
          d.status = res.data.status;
        }
        render(); openSheet(st.id);
      }catch(e){
        window.alert(e.message || 'Could not update your approval — try again.');
      }
    });
  });

  const markGroundWorkBtn = document.getElementById('markGroundWorkBtn');
  if(markGroundWorkBtn) markGroundWorkBtn.onclick = withClickLoading(markGroundWorkBtn, 'Working…', async ()=>{
    try{
      const res = await markGroundWorkCompleteFn({ siteId: activeStore, stageId: st.id });
      if(res && res.data){
        d.groundWorkCompleted = true;
        d.groundWorkCompletedBy = res.data.groundWorkCompletedBy;
        d.groundWorkCompletedAt = res.data.groundWorkCompletedAt;
        d.status = res.data.status;
      }
      render(); openSheet(st.id);
    }catch(e){
      window.alert(e.message || 'Could not mark this complete — try again.');
    }
  });

  const declineBtn = document.getElementById('declineBtn');
  if(declineBtn) declineBtn.onclick = withClickLoading(declineBtn, 'Working…', async ()=>{
    const who = getWho();
    d.status = 'declined'; d.approvals = {}; d.updatedBy = who; d.updatedAt = Date.now();
    d.delayReason=''; d.delayLoggedBy=''; d.delayLoggedAt=0;
    const target = STAGES.find(x=>x.id===st.reworkTo);
    if(target){
      s.stageData[target.id].status = 'active';
      s.stageData[target.id].startedAt = Date.now();
      s.stageData[target.id].delayReason=''; s.stageData[target.id].delayLoggedBy=''; s.stageData[target.id].delayLoggedAt=0;
      for(const later of STAGES){
        if(later.id > target.id && later.id < st.id){
          s.stageData[later.id].status = 'pending';
          s.stageData[later.id].startedAt = null;
        }
      }
      s.stageData[st.id].status = 'declined';
    }
    s.log.push({stageId:st.id, text:`Declined by ${who}, restarted to Stage ${target?target.num:''}`, at: Date.now()});
    await saveBoard(); render(); closeSheet();
  });

  const confirmBtn = document.getElementById('confirmBtn');
  if(confirmBtn) confirmBtn.onclick = withClickLoading(confirmBtn, 'Working…', async ()=>{
    const who = getWho();
    d.status = 'done'; d.updatedBy = who; d.updatedAt = Date.now();
    s.log.push({stageId:st.id, text:`Load confirmed, logged by ${who}`, at: Date.now()});
    await saveBoard(); render(); closeSheet();
  });

  const completeBtn = document.getElementById('completeBtn');
  if(completeBtn) completeBtn.onclick = withClickLoading(completeBtn, 'Working…', async ()=>{
    const who = getWho();
    if(st.id === 3) d.financials = readFxInputs();
    d.status = 'done'; d.updatedBy = who; d.updatedAt = Date.now();
    if(st.id === 7) s.signingDate = Date.now();
    s.log.push({stageId:st.id, text:`Marked complete by ${who}`, at: Date.now()});
    await saveBoard(); render(); closeSheet();
  });

  const submitForApprovalBtn = document.getElementById('submitForApprovalBtn');
  if(submitForApprovalBtn) submitForApprovalBtn.onclick = withClickLoading(submitForApprovalBtn, 'Working…', async ()=>{
    // Same save-first behavior as "Save & mark complete" above, but this stage now
    // requires approval — so instead of a direct client-side status set, it goes through
    // the same secured ground-work-complete path every other Type 4 stage uses. Save the
    // numbers via the normal client write (financials themselves aren't approval-gated,
    // only the stage's completion is), then hand off completion to the server.
    if(st.id === 3) d.financials = readFxInputs();
    await saveBoard();
    try{
      const res = await markGroundWorkCompleteFn({ siteId: activeStore, stageId: st.id });
      if(res && res.data){
        d.groundWorkCompleted = true;
        d.groundWorkCompletedBy = res.data.groundWorkCompletedBy;
        d.groundWorkCompletedAt = res.data.groundWorkCompletedAt;
        d.status = res.data.status;
      }
      render(); openSheet(st.id);
    }catch(e){
      window.alert(e.message || 'Could not submit this for approval — try again.');
    }
  });

  const saveFinancialsOnlyBtn = document.getElementById('saveFinancialsOnlyBtn');
  if(saveFinancialsOnlyBtn) saveFinancialsOnlyBtn.onclick = withClickLoading(saveFinancialsOnlyBtn, 'Working…', async ()=>{
    const who = getWho();
    if(st.id === 3) d.financials = readFxInputs();
    d.updatedBy = who; d.updatedAt = Date.now();
    await saveBoard(); render(); closeSheet();
  });

  const addNoteBtn = document.getElementById('addNoteBtn');
  if(addNoteBtn) addNoteBtn.onclick = withClickLoading(addNoteBtn, 'Working…', async ()=>{
    const field = document.getElementById('notesField');
    const text = field ? field.value.trim() : '';
    if(!text) return;
    const who = getWho();
    d.notesLog = d.notesLog || [];
    d.notesLog.push({ text, by: who, byId: (findMyStakeholder()||{}).id || null, at: Date.now() });
    await saveBoard(); render(); openSheet(st.id);
  });
}
function closeSheet(){ document.getElementById('sheetBackdrop').classList.remove('open'); }
document.getElementById('sheetBackdrop').onclick = (e)=>{ if(e.target.id==='sheetBackdrop') closeSheet(); };

document.getElementById('filePreviewClose').onclick = ()=>{
  document.getElementById('filePreviewOverlay').classList.remove('open');
  document.getElementById('filePreviewContent').innerHTML = '';
};
document.getElementById('filePreviewOverlay').onclick = (e)=>{
  if(e.target.id === 'filePreviewOverlay'){
    e.currentTarget.classList.remove('open');
    document.getElementById('filePreviewContent').innerHTML = '';
  }
};

// ---------- Log in / Sign up / Forgot password (Cloud Functions) + Firestore sync ----------
// Log in = plain email + password, no OTP. Sign up and Forgot password share the same
// three-step shape (email -> verify code -> set password) — authFlowMode tracks which
// one is in progress so the same steps can serve both without duplicating markup.
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
let authFlowMode = 'signup'; // 'signup' | 'reset'

function showMsg(elId, msg, color){
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.style.color = color || '#C13E3E';
  el.style.display = 'block';
}
// A message with one clickable action inside it — e.g. "...— use Log in instead."
function showMsgWithLink(elId, before, linkText, after, onClick){
  const el = document.getElementById(elId);
  el.innerHTML = `${before}<a href="#" style="color:#C13E3E;font-weight:700;text-decoration:underline;" id="${elId}Link">${linkText}</a>${after}`;
  el.style.color = '#C13E3E';
  el.style.display = 'block';
  document.getElementById(`${elId}Link`).onclick = (ev)=>{ ev.preventDefault(); onClick(); };
}
function hideMsg(elId){ document.getElementById(elId).style.display = 'none'; }
// Genuinely unexpected server errors show as raw codes like "INTERNAL" — never show
// that verbatim, always fall back to something a person can actually act on.
function friendlyError(e, fallback){
  if(!e || !e.message || e.message === 'INTERNAL' || e.message.toLowerCase() === 'internal'){
    return "Something went wrong on our end. Please try again.";
  }
  return e.message || fallback;
}

function showAuthStep(step){
  document.getElementById('loginForm').style.display = step === 'login' ? 'block' : 'none';
  document.getElementById('signupStep1').style.display = step === 'signupStep1' ? 'block' : 'none';
  document.getElementById('signupStep2').style.display = step === 'signupStep2' ? 'block' : 'none';
  document.getElementById('signupStep3').style.display = step === 'signupStep3' ? 'block' : 'none';
  document.getElementById('loginNameField').style.display = step === 'enterName' ? 'block' : 'none';
  document.getElementById('authTabLogin').classList.toggle('active', step === 'login' || step === 'enterName');
  document.getElementById('authTabSignup').classList.toggle('active', step.indexOf('signup') === 0 && authFlowMode === 'signup');

  if(step === 'signupStep1'){
    document.getElementById('step1Intro').textContent = authFlowMode === 'reset'
      ? "Enter your email and we'll send you a code to reset your password."
      : '';
    document.getElementById('step1EmailLabel').textContent = authFlowMode === 'reset' ? 'Email' : 'Work email';
    document.getElementById('sendOtpBtn').textContent = authFlowMode === 'reset' ? 'Send reset code' : 'Send verification code';
  }
  if(step === 'signupStep3'){
    document.getElementById('step3Intro').textContent = authFlowMode === 'reset'
      ? 'Set a new password for your account'
      : 'Create a password for your account';
    document.getElementById('step3PasswordLabel').textContent = authFlowMode === 'reset' ? 'New password (min 8 characters)' : 'Password (min 8 characters)';
    document.getElementById('createAccountBtn').textContent = authFlowMode === 'reset' ? 'Reset password' : 'Create account';
  }
}

// Makes a button's "in-flight" state actually visible — text changes, it visibly dims,
// and the cursor shows not-allowed — instead of just a silent .disabled=true that looks
// identical to a normal clickable button. This is what was inviting repeated clicks,
// especially on the sign-in page where a stuck-looking button is the first thing anyone
// sees.
function setBtnLoading(btn, loadingText){
  if(btn.dataset.origText === undefined) btn.dataset.origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = loadingText;
  btn.style.opacity = '0.6';
  btn.style.cursor = 'not-allowed';
}
function clearBtnLoading(btn){
  if(btn.dataset.origText !== undefined) btn.textContent = btn.dataset.origText;
  btn.disabled = false;
  btn.style.opacity = '';
  btn.style.cursor = '';
}
// Wraps an entire click handler so the visible loading state applies automatically,
// without needing to touch each handler's internal logic — safe even for handlers that
// already had their own disabled-toggling, since setting it twice is harmless. A repeat
// click while already in flight is ignored outright rather than queuing a second call.
// A function declaration (not a const arrow function) so it's hoisted — most of the 45
// handlers using this sit earlier in the file than this definition.
function withClickLoading(btn, loadingText, fn){
  return async (...args) => {
    if(btn.disabled) return;
    setBtnLoading(btn, loadingText);
    try{
      await fn(...args);
    } finally {
      clearBtnLoading(btn);
    }
  };
}

// ---- Log in ----
document.getElementById('loginBtn').onclick = async ()=>{
  hideMsg('loginMsg');
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const password = document.getElementById('loginPassword').value;
  if(!isValidEmail(email)){ showMsg('loginMsg', 'Enter a valid email address.'); return; }
  if(!password){ showMsg('loginMsg', 'Enter your password.'); return; }
  const btn = document.getElementById('loginBtn');
  try{
    setBtnLoading(btn, 'Signing in…');
    const res = await loginFn({ email, password });
    await auth.signInWithCustomToken(res.data.token);
    // onAuthStateChanged below picks it up from here
  }catch(e){
    showMsg('loginMsg', friendlyError(e, 'Sign-in failed. Please try again.'));
  }finally{
    clearBtnLoading(btn);
  }
};

// ---- Step 1: send the code (used by both Sign up and Forgot password) ----
let signupEmail = null;
document.getElementById('sendOtpBtn').onclick = async ()=>{
  hideMsg('signupStep1Msg');
  const email = document.getElementById('signupEmail').value.trim().toLowerCase();
  if(!isValidEmail(email)){ showMsg('signupStep1Msg', 'Enter a valid email address.'); return; }
  const btn = document.getElementById('sendOtpBtn');
  try{
    setBtnLoading(btn, 'Sending…');
    const res = await sendOtpCodeFn({ email });
    if(authFlowMode === 'signup' && res.data.hasPassword){
      showMsgWithLink('signupStep1Msg', 'An account already exists for this email — ', 'click to log in', ' instead.', ()=>{
        document.getElementById('loginEmail').value = email;
        hideMsg('signupStep1Msg');
        showAuthStep('login');
      });
      return;
    }
    if(authFlowMode === 'reset' && !res.data.hasPassword){
      showMsgWithLink('signupStep1Msg', 'No account found for this email — ', 'click to sign up', ' instead.', ()=>{
        authFlowMode = 'signup';
        document.getElementById('signupEmail').value = email;
        hideMsg('signupStep1Msg');
        showAuthStep('signupStep1');
      });
      return;
    }
    signupEmail = email;
    document.getElementById('signupEmailConfirm').textContent = email;
    document.getElementById('otpInput').value = '';
    showAuthStep('signupStep2');
  }catch(e){
    showMsg('signupStep1Msg', friendlyError(e, 'Could not send the code. Please try again.'));
  }finally{
    clearBtnLoading(btn);
  }
};

// ---- Step 2: verify the code ----
document.getElementById('verifyOtpBtn').onclick = async ()=>{
  hideMsg('signupStep2Msg');
  const code = document.getElementById('otpInput').value.trim();

    document.getElementById('newPassword').value = '';
    document.getElementById('newPasswordConfirm').value = '';
    showAuthStep('signupStep3');
  }catch(e){
    showMsg('signupStep2Msg', friendlyError(e, 'That code is incorrect.'));
  }finally{
    clearBtnLoading(btn);
  }
};
document.getElementById('resendOtpBtn').onclick = async ()=>{

// ---- Step 3: create the account, or reset the password ----
document.getElementById('createAccountBtn').onclick = async ()=>{

  }catch(e){

};

let pendingScopedLanding = null; // { siteId, stageId } — set once a scoped assignment link redeems successfully
let scopedLinkChecked = false;   // becomes true once the attempt (if any) finishes, success or fail

async function tryRedeemScopedLink(){
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  if(!token){ scopedLinkChecked = true; return; }
  try{
    const res = await redeemScopedLinkFn({ token });
    pendingScopedLanding = { siteId: res.data.siteId, stageId: res.data.stageId };
    window.history.replaceState({}, document.title, window.location.pathname);
    await auth.signInWithCustomToken(res.data.token);
  }catch(e){
    showMsg('loginMsg', friendlyError(e, 'That link is no longer valid. Please sign in normally.'));
    window.history.replaceState({}, document.title, window.location.pathname);
  }finally{
    scopedLinkChecked = true;
  }
}

auth.onAuthStateChanged(async (user)=>{
  if(user){
    const email = (user.email || '').toLowerCase();
    subscribeToBoard();
    // wait for the first Firestore snapshot to populate `board`
    while(!board){ await new Promise(r=>setTimeout(r, 80)); }
    const existing = board.users.find(u=>u.email===email);
    if(existing){
      currentUser = { email, name: existing.name };
      if(!activeStore || !getSite(activeStore) || !canSeeSite(getSite(activeStore))){ const vs = visibleSites(); activeStore = vs.length ? vs[0].id : null; }
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('whoDisplay').textContent = `Signed in as ${currentUser.name}`;
      handleLanding();
    } else {
      pendingNewUserEmail = email;
      showAuthStep('enterName');
      document.getElementById('loginGate').style.display = 'flex';
    }
  } else {
    if(!scopedLinkChecked){
      return; // still trying a scoped link — don't flash the login gate while that's in flight
    }
    showAuthStep('login');
    document.getElementById('loginGate').style.display = 'flex';
  }
});
tryRedeemScopedLink();

function handleLanding(){
  if(pendingScopedLanding){
    const landing = pendingScopedLanding;
    pendingScopedLanding = null; // consumed either way — never let it misfire on a later render
    const hasSite = landing.siteId && board.siteData[landing.siteId];
    // A sign-in link doesn't always carry a stage. Digest links name a project but no
    // single stage (a digest spans several), and daily-status links name neither — they
    // just sign the person in. Opening a sheet unconditionally would break on both, so
    // each part of the link is only acted on if it's actually there.
    if(hasSite){
      activeStore = landing.siteId;
      currentView = 'tracker';
      trackerSubView = 'detail';
      render();
      if(landing.stageId !== undefined && landing.stageId !== null && STAGES.find(st=>st.id===landing.stageId)){
        openSheet(landing.stageId);
      }
      return; // arrived via a sign-in link — don't interrupt with a tutorial either
    }
    // Signed in fine, but the link carried no project (or one this person can't see) —
    // fall through to the normal landing below rather than showing them nothing.
  }
  const urlParams = new URLSearchParams(window.location.search);
  const linkSite = urlParams.get('site');
  const linkStage = urlParams.get('stage');
  if(linkSite && linkStage && board.siteData[linkSite]){
    activeStore = linkSite;
    currentView = 'tracker';
    trackerSubView = 'detail';
    render();
    openSheet(parseInt(linkStage));
    return; // arriving via a direct task link — don't interrupt with a tutorial
  }
  const mine = findMyOpenAssignments();
  if(mine.length === 1){
    goToAssignment(mine[0]);
  } else if(mine.length > 1){
    currentView = 'myTasks';
    render();
    maybeStartTutorials();
  } else {
    currentView = 'tracker';
    trackerSubView = 'list';
    render();
    maybeStartTutorials();
  }
}
